<html lang="zh-TW">
<head>

    <script>
        // Tailwind config with dark mode
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            yellow: '#F7E7B5',
                            brown: '#736357',
                            'dark-brown': '#5D4D41',
                            light: '#fbf9f6'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Noto+Sans+TC:wght@300;500;700&display=swap');
        
        :root { 
            --brand-yellow: #F7E7B5; 
            --brand-brown: #736357; 
            --brand-dark-brown: #5D4D41;
            --brand-light: #fbf9f6; 
            --line-green: #06C755; 
            --error-red: #ef4444;
            --info-blue: #3b82f6;
        }

        body { 
            font-family: 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif; 
            background-color: var(--brand-light);
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
            color: var(--brand-brown); 
            -webkit-font-smoothing: antialiased; 
            -webkit-tap-highlight-color: transparent; 
            overscroll-behavior-y: none;
            transition: background-color 0.3s, color 0.3s;
        }

        /* Dark mode styles */
        body.dark {
            background-color: #1f2937;
            color: #f3f4f6;
        }

        .dark .glass-card {
            background: rgba(55, 65, 81, 0.95);
            border-color: rgba(75, 85, 99, 0.6);
        }

        .dark .cute-input {
            background: #374151;
            border-color: #4b5563;
            color: #f3f4f6;
        }

        .dark .cute-input:focus {
            background: #4b5563;
            border-color: var(--brand-yellow);
        }

        .dark .cute-input::placeholder {
            color: #6b7280;
        }

        .dark .text-slate-400 { color: #9ca3af; }
        .dark .text-slate-500 { color: #6b7280; }
        .dark .border-slate-100 { border-color: #4b5563; }
        .dark .bg-white { background-color: #374151; }
        .dark .bg-slate-50 { background-color: #1f2937; }

        .glass-card { 
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6); 
            border-bottom: 0;
            box-shadow: 
                0 4px 6px -1px rgba(115, 99, 87, 0.05), 
                0 10px 15px -3px rgba(115, 99, 87, 0.05),
                inset 0 0 0 1px rgba(255,255,255,0.5); 
            border-radius: 2rem; 
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
        }

        .section-highlight { border-bottom: 3px solid var(--brand-yellow); }

        .cute-input { 
            background: #ffffff; 
            border: 2px solid #eeebe6; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            color: var(--brand-dark-brown);
        }

        .cute-input:focus { 
            background: #ffffff; 
            border-color: var(--brand-brown); 
            box-shadow: 0 0 0 4px rgba(115, 99, 87, 0.1); 
            outline: none; 
            transform: translateY(-1px);
        }

        .cute-input.input-error {
            border-color: var(--error-red) !important;
            background-color: #fef2f2 !important;
        }

        .dark .cute-input.input-error {
            background-color: rgba(239, 68, 68, 0.1) !important;
        }

        .cute-input::placeholder { color: #d1ccc5; }

        .canvas-container { 
            position: relative; 
            border-radius: 1.5rem; 
            overflow: hidden; 
            background: #fff; 
            touch-action: none; 
            user-select: none;
            -webkit-user-select: none; 
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.05);
        }

        .canvas-container, 
        .canvas-container canvas {
            touch-action: none;
            display: block;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-user-drag: none;
        }

        .canvas-container canvas {
            width: 100%;
            height: 100%;
        }

        body.signing-mode {
            overflow: hidden !important;
            position: fixed !important;
            width: 100% !important;
            height: 100% !important;
            touch-action: none !important;
        }

        .fullscreen-signature {
            position: fixed;
            inset: 0;
            z-index: 100;
            touch-action: none;
            -webkit-overflow-scrolling: none;
            overscroll-behavior: none;
        }

        @keyframes pulse-soft { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.02); } }
        .line-btn-animated { background-color: var(--line-green); animation: pulse-soft 2.5s infinite ease-in-out; }

        .fade-enter { opacity: 0; transform: translateY(10px); }
        .fade-enter-active { opacity: 1; transform: translateY(0); transition: all 0.5s cubic-bezier(0.2, 0.8, 0.2, 1); }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }
        
        .shake-error {
            animation: shake 0.4s ease-in-out;
        }

        .group-error {
            padding: 8px;
            margin: -4px;
            border-radius: 1.2rem;
            border: 2px dashed var(--error-red);
            background-color: #fff8f8;
            animation: shake 0.4s ease-in-out;
        }

        .dark .group-error {
            background-color: rgba(239, 68, 68, 0.1);
        }

        .pill-button {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .pill-button:active {
            transform: scale(0.96);
        }

        @keyframes slide-down {
            from { transform: translate(-50%, -100%); opacity: 0; }
            to { transform: translate(-50%, 24px); opacity: 1; }
        }
        .toast-enter { animation: slide-down 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        /* Field error message */
        .field-error {
            color: var(--error-red);
            font-size: 11px;
            font-weight: 700;
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 4px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Skeleton loading */
        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: skeleton-loading 1.5s infinite;
            border-radius: 0.5rem;
        }

        .dark .skeleton {
            background: linear-gradient(90deg, #374151 25%, #4b5563 50%, #374151 75%);
            background-size: 200% 100%;
        }

        @keyframes skeleton-loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Date picker custom styles */
        .react-datepicker-wrapper {
            width: 100%;
        }
        .react-datepicker__input-container input {
            width: 100%;
        }
        .react-datepicker {
            font-family: 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif !important;
            border: 2px solid var(--brand-brown) !important;
            border-radius: 1rem !important;
            box-shadow: 0 10px 25px -5px rgba(115, 99, 87, 0.2) !important;
        }
        .react-datepicker__header {
            background: var(--brand-yellow) !important;
            border-bottom: none !important;
            border-radius: 0.8rem 0.8rem 0 0 !important;
        }
        .react-datepicker__current-month {
            color: var(--brand-brown) !important;
            font-weight: 800 !important;
        }
        .react-datepicker__day-name {
            color: var(--brand-brown) !important;
            font-weight: 700 !important;
        }
        .react-datepicker__day--selected {
            background: var(--brand-brown) !important;
            border-radius: 50% !important;
        }
        .react-datepicker__day:hover {
            background: var(--brand-yellow) !important;
            border-radius: 50% !important;
        }
        .react-datepicker__day--in-range {
            background: rgba(115, 99, 87, 0.2) !important;
        }
        .react-datepicker__day--in-selecting-range {
            background: rgba(247, 231, 181, 0.5) !important;
        }

        /* Stay duration badge */
        .stay-duration-badge {
            background: linear-gradient(135deg, var(--brand-yellow), #ffd700);
            color: var(--brand-brown);
            padding: 8px 16px;
            border-radius: 9999px;
            font-weight: 800;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 12px rgba(247, 231, 181, 0.4);
            animation: pulse-soft 2s infinite;
        }

        /* Dark mode toggle button */
        .dark-mode-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 50;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--brand-brown);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(115, 99, 87, 0.3);
            cursor: pointer;
            transition: all 0.3s;
        }
        .dark-mode-toggle:hover {
            transform: scale(1.1);
        }
        .dark .dark-mode-toggle {
            background: var(--brand-yellow);
            color: var(--brand-brown);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, useCallback } = React;

        const SUPABASE_URL = 'https://fpkzuotxxbsqisgwupix.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_VsAJfSi7Fb3zu_A5Ksm2wA_mAUkDLBs'; 
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // --- Dark Mode Hook ---
        const useDarkMode = () => {
            const [isDark, setIsDark] = useState(() => {
                const saved = localStorage.getItem('darkMode');
                if (saved !== null) return JSON.parse(saved);
                return window.matchMedia('(prefers-color-scheme: dark)').matches;
            });

            useEffect(() => {
                localStorage.setItem('darkMode', JSON.stringify(isDark));
                document.body.classList.toggle('dark', isDark);
            }, [isDark]);

            return [isDark, setIsDark];
        };

        const dataURLtoBlob = (dataurl) => {
            let arr = dataurl.split(','), mime = arr[0].match(/:(.*?);/)[1],
                bstr = atob(arr[1]), n = bstr.length, u8arr = new Uint8Array(n);
            while(n--){
                u8arr[n] = bstr.charCodeAt(n);
            }
            return new Blob([u8arr], {type:mime});
        }

        const Icon = ({ name, size = 20, className = "" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (window.lucide && iconRef.current) {
                    window.lucide.createIcons({ root: iconRef.current, attrs: { "stroke-width": 2.5, class: className } });
                }
            }, [name, className]);
            return <span ref={iconRef} key={name} className="inline-flex items-center justify-center"><i data-lucide={name} style={{ width: size, height: size }}></i></span>;
        };

        const Toast = ({ message, type = 'error', onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, [onClose]);
            const bgColor = type === 'error' ? 'bg-[#ef4444] shadow-red-200' : 'bg-[#06C755] shadow-green-200';
            const iconName = type === 'error' ? 'alert-circle' : 'check-circle';
            return (
                <div className={`fixed top-0 left-1/2 z-[200] flex items-center gap-3 px-6 py-4 rounded-full shadow-xl text-white font-bold text-sm tracking-wide toast-enter ${bgColor} backdrop-blur-md`}>
                    <Icon name={iconName} size={20} className="text-white" />
                    <span>{message}</span>
                </div>
            );
        };

        // --- Field Error Component ---
        const FieldError = ({ message }) => {
            if (!message) return null;
            return (
                <div className="field-error">
                    <Icon name="alert-circle" size={12} />
                    <span>{message}</span>
                </div>
            );
        };

        // --- Skeleton Loading Components ---
        const SkeletonInput = () => (
            <div className="space-y-1.5">
                <div className="skeleton h-4 w-24"></div>
                <div className="skeleton h-12 w-full"></div>
            </div>
        );

        const SkeletonSection = () => (
            <div className="glass-card p-8 space-y-6">
                <div className="skeleton h-6 w-48 mb-6"></div>
                <div className="grid md:grid-cols-2 gap-6">
                    <SkeletonInput />
                    <SkeletonInput />
                    <SkeletonInput />
                    <SkeletonInput />
                </div>
            </div>
        );

        // --- Input with Error Component (移到 App 外部避免重新渲染導致鍵盤消失) ---
        const InputWithError = ({ name, type = 'text', value, onChange, placeholder, error, className = '', inputMode, pattern, step, min }) => (
            <div className="space-y-1">
                <input 
                    name={name}
                    id={name}
                    type={type}
                    inputMode={inputMode}
                    pattern={pattern}
                    step={step}
                    min={min}
                    value={value} 
                    onChange={onChange} 
                    className={`w-full cute-input rounded-xl px-5 py-3.5 font-bold text-[#736357] dark:text-[#F7E7B5] ${error ? 'input-error shake-error' : ''} ${className}`} 
                    placeholder={placeholder} 
                />
                <FieldError message={error} />
            </div>
        );

        // --- 舊客資料選擇 Modal ---
        const HistoryModal = ({ records, onClose, onSelect }) => {
            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-[#5D4D41]/40 backdrop-blur-sm animate-in fade-in duration-300">
                    <div className="w-full max-w-md bg-white dark:bg-gray-800 rounded-3xl overflow-hidden shadow-2xl relative max-h-[80vh] flex flex-col">
                        <div className="bg-[#736357] p-6 text-white text-center">
                            <h3 className="text-xl font-bold">🎉 歡迎回來！</h3>
                            <p className="text-sm opacity-80 mt-1">我們找到了以下寶貝的紀錄，請選擇要帶入的資料：</p>
                        </div>
                        <div className="p-6 space-y-3 overflow-y-auto bg-[#fbf9f6] dark:bg-gray-900">
                            {records.map((record, index) => (
                                <button key={index} onClick={() => onSelect(record)} 
                                    className="w-full bg-white dark:bg-gray-800 p-4 rounded-2xl border border-slate-100 dark:border-gray-700 shadow-sm hover:border-[#F7E7B5] hover:shadow-md transition-all text-left flex items-center gap-4 group">
                                    <div className="w-12 h-12 rounded-full bg-[#F7E7B5]/20 flex items-center justify-center text-[#736357] font-bold text-lg group-hover:bg-[#F7E7B5] transition-colors">
                                        {record.raw_data.pet_name.charAt(0)}
                                    </div>
                                    <div>
                                        <div className="font-bold text-[#736357] dark:text-[#F7E7B5] text-lg">{record.raw_data.pet_name}</div>
                                        <div className="text-xs text-slate-400">上次服務：{record.raw_data.service_type || '無紀錄'}</div>
                                    </div>
                                    <div className="ml-auto text-[#736357] dark:text-[#F7E7B5] opacity-0 group-hover:opacity-100 transition-opacity">
                                        <Icon name="arrow-right" size={20} />
                                    </div>
                                </button>
                            ))}
                        </div>
                        <div className="p-4 bg-white dark:bg-gray-800 border-t border-slate-100 dark:border-gray-700">
                            <button onClick={onClose} className="w-full py-3 rounded-xl text-slate-400 font-bold text-sm hover:bg-slate-50 dark:hover:bg-gray-700 transition-colors">
                                不使用舊資料，填寫新表單
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const SuccessReceipt = ({ data, signature, onClose }) => {
            const isBoarding = !!data.checkin_date;
            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-[#5D4D41]/40 backdrop-blur-sm animate-in fade-in duration-300">
                    <div className="w-full max-w-md bg-white dark:bg-gray-800 rounded-3xl overflow-hidden shadow-2xl relative max-h-[90vh] overflow-y-auto transform transition-all scale-100">
                        <div className="bg-[#736357] p-8 pb-10 text-center relative overflow-hidden flex flex-col justify-center min-h-[140px]">
                            <div className="absolute top-0 left-0 w-full h-full opacity-10 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]"></div>
                            <div className="absolute -top-10 -right-10 w-32 h-32 bg-[#F7E7B5] rounded-full opacity-20 blur-2xl"></div>
                            <div className="absolute -bottom-10 -left-10 w-32 h-32 bg-[#F7E7B5] rounded-full opacity-20 blur-2xl"></div>
                            <div className="relative z-10 space-y-2">
                                <h2 className="text-3xl font-black text-white tracking-wide">預約暨簽署成功</h2>
                                <div className="inline-flex items-center gap-1.5 bg-black/10 px-3 py-1 rounded-lg backdrop-blur-sm">
                                    <Icon name="mail" size={12} className="text-[#F7E7B5]"/>
                                    <p className="text-[#F7E7B5] text-xs font-bold tracking-wider">
                                        副本已寄至 {data.email}
                                    </p>
                                </div>
                            </div>
                        </div>
                        <div className="relative h-6 bg-[#fcfbf9] dark:bg-gray-900 -mt-1">
                            <div className="absolute -top-3 w-full h-6 bg-[#fcfbf9] dark:bg-gray-900" style={{
                                maskImage: 'radial-gradient(circle at 10px bottom, transparent 8px, black 8.5px)',
                                maskSize: '20px 100%',
                                maskPosition: 'center bottom',
                                WebkitMaskImage: 'radial-gradient(circle at 10px bottom, transparent 8px, black 8.5px)',
                                WebkitMaskSize: '20px 100%',
                                WebkitMaskPosition: 'center bottom'
                            }}></div>
                        </div>
                        <div className="px-8 pb-8 pt-2 bg-[#fcfbf9] dark:bg-gray-900 space-y-6">
                            <div className="flex gap-4 p-5 bg-white dark:bg-gray-800 rounded-2xl border border-slate-100 dark:border-gray-700 shadow-[0_4px_20px_-10px_rgba(0,0,0,0.05)]">
                                <div className="flex-1 space-y-1">
                                    <span className="text-[10px] text-slate-400 font-bold uppercase tracking-wider">飼主</span>
                                    <div className="font-black text-[#736357] dark:text-[#F7E7B5] text-lg leading-tight">{data.owner_name}</div>
                                    <div className="text-xs text-slate-400 font-medium">{data.phone}</div>
                                </div>
                                <div className="w-[1px] bg-slate-100 dark:bg-gray-700 my-1"></div>
                                <div className="flex-1 space-y-1 text-right">
                                    <span className="text-[10px] text-slate-400 font-bold uppercase tracking-wider">寵物</span>
                                    <div className="font-black text-[#736357] dark:text-[#F7E7B5] text-lg leading-tight">{data.pet_name}</div>
                                    <div className="text-xs text-slate-400 font-medium">{data.breed} ({data.sex})</div>
                                </div>
                            </div>
                            <div className="space-y-4">
                                <div className="flex items-center gap-3">
                                    <div className={`p-2.5 rounded-xl shadow-sm ${isBoarding ? 'bg-orange-50 text-orange-600 dark:bg-orange-900 dark:text-orange-300' : 'bg-blue-50 text-blue-600 dark:bg-blue-900 dark:text-blue-300'}`}>
                                        <Icon name={isBoarding ? "home" : "scissors"} size={22} />
                                    </div>
                                    <div>
                                        <div className="text-[10px] text-slate-400 font-bold uppercase">服務項目</div>
                                        <div className="font-bold text-[#736357] dark:text-[#F7E7B5] text-lg">{isBoarding ? '住宿 ＋ 美容' : data.service_type}</div>
                                    </div>
                                </div>
                                {isBoarding ? (
                                    <div className="flex items-center justify-between bg-white dark:bg-gray-800 p-4 rounded-2xl border border-dashed border-slate-200 dark:border-gray-600">
                                        <div className="text-center">
                                            <div className="text-[10px] text-slate-400 mb-1 font-bold">入住 Check-in</div>
                                            <div className="font-black text-[#736357] dark:text-[#F7E7B5] text-sm">{data.checkin_date}</div>
                                        </div>
                                        <div className="flex-1 h-[2px] bg-slate-100 dark:bg-gray-700 mx-3 relative rounded-full">
                                            <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-slate-300 bg-white dark:bg-gray-800 p-1 rounded-full border border-slate-100 dark:border-gray-700">
                                                <Icon name="arrow-right" size={12} />
                                            </div>
                                        </div>
                                        <div className="text-center">
                                            <div className="text-[10px] text-slate-400 mb-1 font-bold">退房 Check-out</div>
                                            <div className="font-black text-[#736357] dark:text-[#F7E7B5] text-sm">{data.checkout_date}</div>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="flex items-center gap-3">
                                        <div className="p-2.5 rounded-xl shadow-sm bg-purple-50 text-purple-600 dark:bg-purple-900 dark:text-purple-300">
                                            <Icon name="clock" size={22} />
                                        </div>
                                        <div>
                                            <div className="text-[10px] text-slate-400 font-bold uppercase">預計接回時間</div>
                                            <div className="font-bold text-[#736357] dark:text-[#F7E7B5] text-lg">
                                                {data.pickup_time ? data.pickup_time : <span className="text-slate-400 italic font-normal text-sm">另行通知</span>}
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                            <div className="border-t-2 border-dashed border-slate-200 dark:border-gray-700 pt-6 flex flex-col gap-5">
                                <div className="flex justify-between items-end">
                                    <div className="text-right w-full">
                                        <div className="text-[10px] text-slate-400 font-bold uppercase mb-1 tracking-widest">預估金額</div>
                                        <div className="text-4xl font-black text-[#736357] dark:text-[#F7E7B5] leading-none tracking-tight">
                                            <span className="text-sm align-top mr-1 font-bold opacity-60">NT$</span>
                                            {data.service_price || 0}
                                        </div>
                                    </div>
                                </div>
                                <div className="space-y-2">
                                    <div className="text-[10px] text-slate-400 font-bold uppercase tracking-wider text-center">電子簽署憑證</div>
                                    <div className="p-6 bg-white dark:bg-gray-800 border border-slate-100 dark:border-gray-700 rounded-2xl flex justify-center shadow-sm relative overflow-hidden">
                                        <div className="absolute inset-0 opacity-[0.03] bg-[url('https://www.transparenttextures.com/patterns/cream-paper.png')]"></div>
                                        <img src={signature} alt="Signature" className="h-24 object-contain relative z-10" />
                                    </div>
                                </div>
                            </div>
                            <div className="pt-2">
                                <button onClick={onClose} className="w-full py-4 bg-[#736357] text-white rounded-2xl font-bold shadow-lg hover:bg-[#5e5046] active:scale-[0.98] transition-all flex items-center justify-center gap-2 group">
                                    <div className="bg-white/20 p-1 rounded-full group-hover:rotate-90 transition-transform">
                                        <Icon name="x" size={16} /> 
                                    </div>
                                    關閉並重新整理
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            )
        }

        // --- Error Messages Map ---
        const ERROR_MESSAGES = {
            email: '請輸入有效的電子郵件格式 (例如: example@email.com)',
            owner_name: '請輸入飼主姓名',
            phone: '請輸入有效的手機號碼 (例如: 0912345678)',
            owner_id: '身分證字號格式錯誤，請檢查',
            address: '請輸入通訊地址',
            emergency_name: '請輸入緊急聯絡人姓名',
            emergency_phone: '請輸入有效的緊急聯絡電話',
            pet_name: '請輸入寵物名字',
            breed: '請輸入寵物品種',
            weight: '請輸入有效的體重 (必須大於 0)',
            age: '請輸入寵物年齡',
            sex: '請選擇寵物性別',
            fix: '請選擇是否結紮',
            chip_status: '請選擇晶片狀態',
            dog_traits: '請至少選擇一項親狗程度',
            medical_status: '請選擇是否有過往病史',
            medical_history: '請選擇病史項目',
            preferred_clinic: '請填寫指定就醫診療機構 (若無請填無)',
            checkin_date: '請選擇入住日期',
            checkout_date: '請選擇退房日期',
            is_barking: '請選擇是否容易吠叫',
            barking_detail: '請說明吠叫情況',
            stay_exp: '請選擇是否有住宿經驗',
            food_aggr: '請選擇是否會護食',
            pad_toilet: '請選擇是否會在尿布墊上廁所',
            vaccine: '請選擇是否定期施打疫苗',
            vaccine_file: '請上傳疫苗手冊照片',
            deworm: '請選擇是否定期驅蟲',
            deworm_brand: '請填寫驅蟲藥品牌',
            crate_status: '請選擇籠內訓練狀況',
            allergy: '請填寫過敏資訊 (若無請填無)',
            personality: '請描述寵物個性',
            special_notes: '請填寫注意事項 (若無請填無)',
            boarding_notice_agree: '請勾選同意入住須知',
            service_type: '請選擇服務項目',
            service_type_other: '請填寫其他服務項目內容',
            service_price: '請輸入有效的金額 (必須大於 0)',
            legal_agree: '請勾選同意契約條款',
            signature: '請完成數位簽名'
        };

        const App = () => {
            const [view, setView] = useState('entry'); 
            const [isBoarding, setIsBoarding] = useState(false);
            const [showFullSig, setShowFullSig] = useState(false);
            const [realtimeSig, setRealtimeSig] = useState(null);
            const [boardingOpen, setBoardingOpen] = useState(false);
            const [groomingOpen, setGroomingOpen] = useState(false);
            const [seniorOpen, setSeniorOpen] = useState(false);
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [showSuccess, setShowSuccess] = useState(false); 
            const [toast, setToast] = useState(null);
            const [errors, setErrors] = useState({});
            const [isProcessingImg, setIsProcessingImg] = useState(false);
            const [isPageLoading, setIsPageLoading] = useState(true);

            // Dark mode
            const [isDark, setIsDark] = useDarkMode();

            // 新增：舊客查詢相關狀態
            const [isSearching, setIsSearching] = useState(false);
            const [showHistoryModal, setShowHistoryModal] = useState(false);
            const [historyRecords, setHistoryRecords] = useState([]);

            const [formData, setFormData] = useState({
                email: '', owner_name: '', owner_id: '', phone: '', address: '', 
                emergency_name: '', emergency_phone: '',
                pet_name: '', breed: '', sex: '', age: '', weight: '', fix: '', 
                chip_status: '', chip_id: '', preferred_clinic: '',
                dog_traits: [], is_barking: '', barking_detail: '',
                medical_status: '', medical_history: [], medical_history_other: '',
                checkin_date: '', checkout_date: '', stay_exp: '',
                crate_status: [], food_aggr: '', pad_toilet: '',
                vaccine: '', deworm: '', deworm_brand: '', vaccine_file: null,
                allergy: '', personality: '', special_notes: '', boarding_notice_agree: false,
                service_type: '', service_type_other: '', 
                pickup_time: '', service_price: '',
                legal_agree: false
            });

            const fullSigCanvasRef = useRef(null);
            const padInstance = useRef(null);

            // --- 新增：判斷是否為高齡寵物 (8歲以上) ---
            const isSenior = useMemo(() => {
                const ageNum = parseFloat(formData.age);
                return !isNaN(ageNum) && ageNum >= 8;
            }, [formData.age]);

            // Simulate page loading
            useEffect(() => {
                const timer = setTimeout(() => setIsPageLoading(false), 800);
                return () => clearTimeout(timer);
            }, []);

            const showToast = (message, type = 'error') => {
                setToast({ message, type });
            };

            // Calculate stay duration
            const stayDuration = useMemo(() => {
                if (!formData.checkin_date || !formData.checkout_date) return null;
                const start = new Date(formData.checkin_date);
                const end = new Date(formData.checkout_date);
                const diffTime = end - start;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                return diffDays > 0 ? diffDays : null;
            }, [formData.checkin_date, formData.checkout_date]);

            const compressImage = (file) => {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.readAsDataURL(file);
                    reader.onload = (event) => {
                        const img = new Image();
                        img.src = event.target.result;
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            let width = img.width;
                            let height = img.height;
                            const max_size = 1200; 
                            if (width > height) {
                                if (width > max_size) {
                                    height *= max_size / width;
                                    width = max_size;
                                }
                            } else {
                                if (height > max_size) {
                                    width *= max_size / height;
                                    height = max_size;
                                }
                            }
                            canvas.width = width;
                            canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);
                            const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
                            resolve(dataUrl);
                        };
                    };
                });
            };

            const handleChange = (field, value) => {
                let finalVal = value;
                if (field === 'email') finalVal = value.toLowerCase();
                if (field === 'owner_id') finalVal = value.toUpperCase();
                setFormData(prev => ({ ...prev, [field]: finalVal }));
                if (errors[field]) setErrors(prev => ({ ...prev, [field]: null }));
            };

            // --- 新增：搜尋舊客資料邏輯 ---
            const handleSearchHistory = async () => {
                const phone = formData.phone;
                if (!phone || phone.length < 9) {
                    showToast("⚠️ 請先輸入完整的連絡電話", "error");
                    return;
                }

                setIsSearching(true);
                try {
                    const { data, error } = await supabase
                        .rpc('search_guest_history', { phone_input: phone });
                    if (error) throw error;

                    if (!data || data.length === 0) {
                        showToast("🔍 查無此電話的過往紀錄", "error");
                    } else {
                        const uniquePets = new Map();
                        data.forEach(record => {
                            if (record.raw_data && record.raw_data.pet_name) {
                                if (!uniquePets.has(record.raw_data.pet_name)) {
                                    uniquePets.set(record.raw_data.pet_name, record);
                                }
                            }
                        });
                        
                        const records = Array.from(uniquePets.values());
                        setHistoryRecords(records);
                        setShowHistoryModal(true);
                    }
                } catch (err) {
                    console.error("Search Error:", err);
                    showToast("❌ 查詢失敗，請檢查網路", "error");
                } finally {
                    setIsSearching(false);
                }
            };

            // --- 新增：帶入舊資料邏輯 ---
            const handleApplyHistory = (record) => {
                const oldData = record.raw_data;
                
                const { 
                    checkin_date, checkout_date, pickup_time, service_price, 
                    signature, legal_agree, boarding_notice_agree, vaccine_file,
                    emergency2_name, emergency2_phone,
                    ...reusableData 
                } = oldData;

                setFormData(prev => ({
                    ...prev,
                    ...reusableData,
                    phone: formData.phone 
                }));

                setRealtimeSig(null);
                
                setShowHistoryModal(false);
                showToast(`✅ 已帶入 ${oldData.pet_name} 的過往資料`, "success");
            };

            const toggleArrayField = (field, value) => {
                setFormData(prev => {
                    const currentArr = Array.isArray(prev[field]) ? prev[field] : [];
                    let updatedArr = currentArr.includes(value) ? currentArr.filter(i => i !== value) : [...currentArr, value];
                    if (updatedArr.length > 0 && errors[field]) setErrors(prev => ({ ...prev, [field]: null }));
                    return { ...prev, [field]: updatedArr };
                });
            };

            const validateEmail = (email) => /\S+@\S+\.com/.test(email);
            const validatePhone = (phone) => /^09\d{8}$/.test(phone);
            const validateTwID = (id) => {
                if (!/^[A-Z][12]\d{8}$/.test(id)) return false;
                const letters = "ABCDEFGHJKLMNPQRSTUVXYWZIO";
                const letterVal = letters.indexOf(id[0]) + 10;
                const n1 = Math.floor(letterVal / 10);
                const n2 = letterVal % 10;
                const numbers = [n1, n2, ...id.slice(1).split('').map(Number)];
                const weights = [1, 9, 8, 7, 6, 5, 4, 3, 2, 1, 1];
                let sum = 0;
                for (let i = 0; i < 11; i++) sum += numbers[i] * weights[i];
                return sum % 10 === 0;
            };

            const handleSubmit = async () => {
                const newErrors = {};
                const requiredText = ['email', 'owner_name', 'phone', 'owner_id', 'address', 'emergency_name', 'emergency_phone', 'pet_name', 'breed', 'weight', 'age', 'preferred_clinic'];
                requiredText.forEach(f => { if (!formData[f] || formData[f].toString().trim() === '') newErrors[f] = ERROR_MESSAGES[f]; });
                
                if (formData.email && !validateEmail(formData.email)) newErrors.email = ERROR_MESSAGES.email;
                if (formData.phone && !validatePhone(formData.phone)) newErrors.phone = ERROR_MESSAGES.phone;
                if (formData.emergency_phone && !validatePhone(formData.emergency_phone)) newErrors.emergency_phone = ERROR_MESSAGES.emergency_phone;
                if (formData.owner_id && !validateTwID(formData.owner_id)) newErrors.owner_id = ERROR_MESSAGES.owner_id;
                
                if (!formData.weight || parseFloat(formData.weight) <= 0) {
                     newErrors.weight = ERROR_MESSAGES.weight;
                }

                if (!formData.sex) newErrors.sex = ERROR_MESSAGES.sex;
                if (!formData.fix) newErrors.fix = ERROR_MESSAGES.fix;
                if (!formData.chip_status) newErrors.chip_status = ERROR_MESSAGES.chip_status;
                // 晶片號碼驗證：選擇「有晶片」時必填
                if (formData.chip_status === '有晶片' && (!formData.chip_id || formData.chip_id.trim() === '')) {
                    newErrors.chip_id = '請輸入晶片號碼';
                }
                if (formData.dog_traits.length === 0) newErrors.dog_traits = ERROR_MESSAGES.dog_traits;
                if (!formData.medical_status) newErrors.medical_status = ERROR_MESSAGES.medical_status;
                else if (formData.medical_status === '有' && formData.medical_history.length === 0) newErrors.medical_history = ERROR_MESSAGES.medical_history;
                // 其他病史驗證：選擇「其他」時必填
                if (formData.medical_status === '有' && formData.medical_history.includes('其他') && (!formData.medical_history_other || formData.medical_history_other.trim() === '')) {
                    newErrors.medical_history_other = '請填寫其他病史內容';
                }

                if (isBoarding) {
                    if (!formData.checkin_date) newErrors.checkin_date = ERROR_MESSAGES.checkin_date;
                    if (!formData.checkout_date) newErrors.checkout_date = ERROR_MESSAGES.checkout_date;

                    if (formData.checkin_date && formData.checkout_date) {
                        const start = new Date(formData.checkin_date);
                        const end = new Date(formData.checkout_date);
                        if (end <= start) {
                            newErrors.checkout_date = '退房日期必須晚於入住日期';
                        }
                    }
                    if (!formData.is_barking) newErrors.is_barking = ERROR_MESSAGES.is_barking;
                    if (formData.is_barking === '會' && (!formData.barking_detail || formData.barking_detail.trim() === '')) newErrors.barking_detail = ERROR_MESSAGES.barking_detail;
                    if (!formData.stay_exp) newErrors.stay_exp = ERROR_MESSAGES.stay_exp;
                    if (!formData.food_aggr) newErrors.food_aggr = ERROR_MESSAGES.food_aggr;
                    if (!formData.pad_toilet) newErrors.pad_toilet = ERROR_MESSAGES.pad_toilet;
                    if (!formData.vaccine) newErrors.vaccine = ERROR_MESSAGES.vaccine;
                    if (formData.vaccine === '有' && !formData.vaccine_file) newErrors.vaccine_file = ERROR_MESSAGES.vaccine_file;
                    if (!formData.deworm) newErrors.deworm = ERROR_MESSAGES.deworm;
                    if (formData.deworm === '有' && (!formData.deworm_brand || formData.deworm_brand.trim() === '')) newErrors.deworm_brand = ERROR_MESSAGES.deworm_brand;
                    if (formData.crate_status.length === 0) newErrors.crate_status = ERROR_MESSAGES.crate_status;
                    if (!formData.allergy) newErrors.allergy = ERROR_MESSAGES.allergy;
                    if (!formData.personality) newErrors.personality = ERROR_MESSAGES.personality;
                    if (!formData.special_notes) newErrors.special_notes = ERROR_MESSAGES.special_notes;
                    if (!formData.boarding_notice_agree) newErrors.boarding_notice_agree = ERROR_MESSAGES.boarding_notice_agree;
                } else {
                    if (!formData.service_type) newErrors.service_type = ERROR_MESSAGES.service_type;
                    if (formData.service_type === '其他項目' && (!formData.service_type_other || formData.service_type_other.trim() === '')) newErrors.service_type_other = ERROR_MESSAGES.service_type_other;
                    if (!formData.service_price || parseInt(formData.service_price) <= 0) newErrors.service_price = ERROR_MESSAGES.service_price;
                }

                if (!formData.legal_agree) newErrors.legal_agree = ERROR_MESSAGES.legal_agree;
                if (!realtimeSig) newErrors.signature = ERROR_MESSAGES.signature;

                setErrors(newErrors);
                const errorKeys = Object.keys(newErrors);
                if (errorKeys.length > 0) {
                    const firstError = errorKeys[0];
                    let el = document.getElementById(firstError) || document.getElementsByName(firstError)[0];
                    if (firstError === 'vaccine_file') el = document.getElementById('vaccine-label');
                    if (firstError === 'signature') el = document.getElementById('signature');
                    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    
                    showToast(`⚠️ 請修正 ${errorKeys.length} 個錯誤欄位`);
                    return;
                }

                setIsSubmitting(true);

                try {
                    // reCAPTCHA v3 驗證
                    let recaptchaToken = null;
                    if (window.grecaptcha && window.grecaptcha.execute) {
                        try {
                            recaptchaToken = await window.grecaptcha.execute('6LcXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX', { action: 'submit_booking' });
                            console.log('reCAPTCHA token obtained:', recaptchaToken ? 'success' : 'failed');
                        } catch (recaptchaError) {
                            console.warn('reCAPTCHA 驗證失敗，繼續提交:', recaptchaError);
                            // 如果 reCAPTCHA 失敗，仍然允許提交（避免阻擋正常用戶）
                        }
                    } else {
                        console.warn('reCAPTCHA 未載入，跳過驗證');
                    }

                    let signatureUrl = null;
                    let vaccineUrl = null;
                    const timestamp = Date.now();

                    if (realtimeSig) {
                        const sigBlob = dataURLtoBlob(realtimeSig);
                        const fileName = `sig_${timestamp}_${Math.random().toString(36).substring(7)}.jpg`;
                        const { data: sigData, error: sigError } = await supabase.storage.from('signatures').upload(fileName, sigBlob, { contentType: 'image/jpeg' });
                        if (sigError) throw sigError;
                        const { data: { publicUrl } } = supabase.storage.from('signatures').getPublicUrl(fileName);
                        signatureUrl = publicUrl;
                    }

                    if (formData.vaccine_file) {
                        const vacBlob = dataURLtoBlob(formData.vaccine_file);
                        const fileName = `vac_${timestamp}_${Math.random().toString(36).substring(7)}.jpg`;
                        const { data: vacData, error: vacError } = await supabase.storage.from('vaccines').upload(fileName, vacBlob, { contentType: 'image/jpeg' });
                        if (vacError) throw vacError;
                        const { data: { publicUrl } } = supabase.storage.from('vaccines').getPublicUrl(fileName);
                        vaccineUrl = publicUrl;
                    }

                    const { error: insertError } = await supabase
                        .from('bookings')
                        .insert({
                            owner_name: formData.owner_name,
                            phone: formData.phone,
                            pet_name: formData.pet_name,
                            service_type: isBoarding ? '住宿＋美容' : formData.service_type,
                            checkin_date: isBoarding ? formData.checkin_date : null,
                            checkout_date: isBoarding ? formData.checkout_date : null,
                            pickup_time: formData.pickup_time,
                            service_price: isBoarding ? 0 : formData.service_price,
                            signature_url: signatureUrl,
                            vaccine_url: vaccineUrl,
                            status: 'pending', 
                            raw_data: formData,
                        });

                    if (insertError) throw insertError;
                    localStorage.removeItem('wangwang_form_draft');
                    setShowSuccess(true);

                } catch (error) {
                    console.error('Submission Error:', error);
                    showToast(`❌ 提交失敗: ${error.message || '請檢查網路連線'}`);
                } finally {
                    setIsSubmitting(false);
                }
            };

            const handleSuccessClose = () => {
                setShowSuccess(false);
                window.location.reload();
            }

            const selectServiceFlow = (type) => {
                setIsBoarding(type === 'both');
                setView('client');
                setTimeout(() => { window.scrollTo({top: 0, behavior: 'smooth'}); }, 100);
            };

            const scrollPositionRef = useRef(0);
            const initialOrientationRef = useRef(null);
            const canvasSizeRef = useRef({ width: 0, height: 0 });

            useEffect(() => {
                let timer;
                let orientationLocked = false;
                
                const lockOrientation = async () => {
                    try {
                        initialOrientationRef.current = window.screen?.orientation?.type || 'portrait-primary';
                        if (window.screen?.orientation?.lock) {
                            await window.screen.orientation.lock(initialOrientationRef.current);
                            orientationLocked = true;
                        }
                    } catch (e) {
                        console.log('Screen orientation lock not supported:', e.message);
                    }
                };

                const unlockOrientation = () => {
                    try {
                        if (orientationLocked && window.screen?.orientation?.unlock) {
                            window.screen.orientation.unlock();
                        }
                    } catch (e) {
                        console.log('Screen orientation unlock failed:', e.message);
                    }
                };

                const preventTouchMove = (e) => {
                    if (showFullSig) {
                        e.preventDefault();
                    }
                };

                const preventGesture = (e) => {
                    if (showFullSig) {
                        e.preventDefault();
                    }
                };

                const initCanvas = () => {
                    const canvas = fullSigCanvasRef.current;
                    if (!canvas) return;
                    
                    const container = canvas.parentElement;
                    const rect = container.getBoundingClientRect();
                    const displayWidth = rect.width;
                    const displayHeight = rect.height;
                    
                    canvasSizeRef.current = { width: displayWidth, height: displayHeight };
                    
                    const ratio = Math.max(window.devicePixelRatio || 1, 1);
                    canvas.width = displayWidth * ratio;
                    canvas.height = displayHeight * ratio;
                    
                    canvas.style.width = displayWidth + 'px';
                    canvas.style.height = displayHeight + 'px';
                    
                    const ctx = canvas.getContext("2d");
                    ctx.scale(ratio, ratio);
                    
                    ctx.fillStyle = "rgb(255, 255, 255)";
                    ctx.fillRect(0, 0, displayWidth, displayHeight);
                    
                    if (padInstance.current) {
                        padInstance.current.off();
                    }
                    
                    padInstance.current = new SignaturePad(canvas, { 
                        penColor: "rgb(115, 99, 87)",
                        backgroundColor: "rgb(255, 255, 255)", 
                        minWidth: 1.5,
                        maxWidth: 4.0,
                        throttle: 16, 
                        minDistance: 3, 
                        velocityFilterWeight: 0.7,
                    });
                };

                if (showFullSig && fullSigCanvasRef.current) {
                    scrollPositionRef.current = window.scrollY;
                    
                    document.body.classList.add('signing-mode');
                    document.body.style.top = `-${scrollPositionRef.current}px`;
                    
                    lockOrientation();
                    
                    document.addEventListener('touchmove', preventTouchMove, { passive: false });
                    document.addEventListener('gesturestart', preventGesture, { passive: false });
                    document.addEventListener('gesturechange', preventGesture, { passive: false });
                    document.addEventListener('gestureend', preventGesture, { passive: false });
                    
                    timer = setTimeout(initCanvas, 150);
                }
                
                return () => { 
                    if (timer) clearTimeout(timer);
                    if (padInstance.current) padInstance.current.off(); 
                    
                    unlockOrientation();
                    
                    document.body.classList.remove('signing-mode');
                    document.body.style.top = '';
                    window.scrollTo(0, scrollPositionRef.current);
                    
                    document.removeEventListener('touchmove', preventTouchMove);
                    document.removeEventListener('gesturestart', preventGesture);
                    document.removeEventListener('gesturechange', preventGesture);
                    document.removeEventListener('gestureend', preventGesture);
                };
            }, [showFullSig]);

            const pillBtn = (field, val, active) => (
                <button type="button" onClick={() => handleChange(field, val)} 
                    className={`pill-button flex-1 py-3.5 rounded-xl font-bold text-sm border transition-all duration-300 transform ${active ? 'bg-[#736357] text-white border-[#736357] shadow-lg shadow-[#736357]/20' : 'bg-white dark:bg-gray-700 text-slate-400 border-slate-200 dark:border-gray-600 hover:border-[#F7E7B5] hover:text-[#736357] dark:hover:text-[#F7E7B5] hover:bg-[#F7E7B5]/5'}`}>
                    {val}
                </button>
            );

            const getTodayDate = () => new Date().toISOString().split('T')[0];
            const getMinCheckoutDate = () => {
                if (!formData.checkin_date) return getTodayDate();
                const d = new Date(formData.checkin_date);
                d.setDate(d.getDate() + 1);
                return d.toISOString().split('T')[0];
            };

            const UnifiedLineSection = ({ formData, setFormData }) => {
                const [lineConfirmed, setLineConfirmed] = useState(false);
                return (
                    <div className="glass-card section-highlight overflow-hidden border-none bg-gradient-to-br from-white via-[#fefcf9] to-[#F7E7B5]/20 dark:from-gray-800 dark:via-gray-800 dark:to-[#F7E7B5]/10 p-8 shadow-sm relative">
                        <div className="absolute top-0 right-0 w-64 h-64 bg-[#F7E7B5]/20 rounded-full blur-3xl -translate-y-1/2 translate-x-1/3"></div>
                        
                        <div className="flex flex-col lg:flex-row items-center gap-8 relative z-10">
                            <div className="flex-1 space-y-4 text-center lg:text-left">
                                <div className="flex items-center justify-center lg:justify-start gap-3">
                                    <div className="w-14 h-14 bg-[#06C755] text-white rounded-2xl flex items-center justify-center shadow-lg shadow-green-200 transform -rotate-3 transition-transform hover:rotate-0">
                                        <Icon name="message-circle" size={30} />
                                    </div>
                                    <h3 className="text-2xl font-black text-[#736357] dark:text-[#F7E7B5] tracking-tight">官方 LINE 諮詢服務</h3>
                                </div>
                                <div className="space-y-2 text-[#736357] dark:text-gray-300 font-medium text-sm leading-relaxed opacity-90">
                                    <p>為了更了解您的小寶貝，請先加 LINE 並 <span className="text-red-500 font-bold underline decoration-wavy underline-offset-4 decoration-2">丟個貼圖</span> 我們才看得到您哦！😊</p>
                                    <p className="inline-flex items-center gap-1 text-[#06C755] text-xs font-bold bg-[#06C755]/10 px-3 py-1 rounded-full">
                                        <Icon name="hash" size={12}/> LINE ID: @cik3330f
                                    </p>
                                </div>
                            </div>
                            <div className="flex flex-col items-center gap-3 min-w-[240px]">
                                <a href="https://line.me/R/ti/p/@cik3330f" target="_blank" className="line-btn-animated w-full text-center py-4 rounded-2xl text-white font-black text-lg shadow-xl shadow-green-200 hover:shadow-2xl transition-all active:scale-95 flex items-center justify-center gap-2">
                                    <Icon name="message-circle" size={20}/> 立即加 LINE
                                </a>
                                <button type="button" onClick={() => setLineConfirmed(!lineConfirmed)} 
                                    className={`w-full flex items-center justify-center gap-2 px-6 py-3 rounded-xl font-bold text-xs transition-all duration-500 border-2 ${lineConfirmed ? 'bg-[#06C755] text-white border-[#06C755] shadow-inner' : 'bg-white dark:bg-gray-700 text-[#06C755] border-[#06C755] hover:bg-[#06C755]/5'}`}>
                                    <Icon name="check-circle" size={14} className={lineConfirmed ? "" : "opacity-50"} />
                                    {lineConfirmed ? "已加 LINE 並丟貼圖" : "確認：已加 LINE 丟貼圖"}
                                </button>
                            </div>
                        </div>
                    </div>
                );
            };

            // Dark mode toggle button
            const DarkModeToggle = () => (
                <button 
                    onClick={() => setIsDark(!isDark)} 
                    className="dark-mode-toggle"
                    title={isDark ? '切換淺色模式' : '切換深色模式'}
                >
                    <Icon name={isDark ? "sun" : "moon"} size={24} />
                </button>
            );

            if (view === 'entry') {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-8 bg-[#fefcf9] dark:bg-gray-900 relative overflow-hidden">
                        <DarkModeToggle />
                        <div className="absolute top-[-10%] right-[-10%] w-[500px] h-[500px] bg-[#F7E7B5]/30 rounded-full blur-[100px] mix-blend-multiply animate-pulse pointer-events-none"></div>
                        <div className="absolute bottom-[-10%] left-[-10%] w-[500px] h-[500px] bg-[#736357]/10 rounded-full blur-[100px] mix-blend-multiply pointer-events-none"></div>
                        
                        <div className="w-48 h-48 md:w-64 md:h-64 mx-auto mb-10 relative transform hover:scale-105 transition-transform duration-500">
                            <img src="./logo.png" alt="汪汪犬旅 Logo" className="w-full h-full object-contain drop-shadow-2xl" />
                        </div>
                        
                        <div className="grid md:grid-cols-2 gap-8 w-full max-w-4xl px-4 relative z-10">
                            <button onClick={() => selectServiceFlow('grooming')} className="glass-card p-10 text-left group hover:translate-y-[-5px] hover:shadow-[0_20px_40px_-15px_rgba(115,99,87,0.15)] bg-white dark:bg-gray-800 border-b-8 section-highlight relative overflow-hidden">
                                <div className="absolute top-0 right-0 w-32 h-32 bg-[#736357]/5 rounded-full blur-2xl transform translate-x-1/2 -translate-y-1/2"></div>
                                <div className="w-16 h-16 bg-[#736357]/5 text-[#736357] dark:text-[#F7E7B5] rounded-2xl flex items-center justify-center mb-6 group-hover:bg-[#736357] group-hover:text-white transition-all duration-300 shadow-sm">
                                    <Icon name="scissors" size={32} />
                                </div>
                                <h3 className="text-3xl font-black mb-3 text-[#736357] dark:text-[#F7E7B5]">美容洗澡</h3>
                                <p className="text-slate-400 font-medium text-sm mb-8 leading-relaxed">細心呵護，讓毛孩煥然一新</p>
                                <div className="text-[#736357] dark:text-[#F7E7B5] font-bold flex items-center gap-2 text-sm uppercase tracking-wider group-hover:translate-x-2 transition-transform">
                                    開始填寫 <div className="bg-[#736357]/10 p-1.5 rounded-full group-hover:bg-[#736357] group-hover:text-white transition-colors"><Icon name="arrow-right" size={16}/></div>
                                </div>
                            </button>
                            
                            <button onClick={() => selectServiceFlow('both')} className="glass-card p-10 text-left group hover:translate-y-[-5px] hover:shadow-[0_20px_40px_-15px_rgba(247,231,181,0.4)] bg-white dark:bg-gray-800 border-b-8 border-[#F7E7B5] relative overflow-hidden">
                                <div className="absolute top-0 right-0 w-32 h-32 bg-[#F7E7B5]/30 rounded-full blur-2xl transform translate-x-1/2 -translate-y-1/2"></div>
                                <div className="w-16 h-16 bg-[#F7E7B5]/30 text-[#736357] dark:text-[#F7E7B5] rounded-2xl flex items-center justify-center mb-6 group-hover:bg-[#F7E7B5] transition-all duration-300 shadow-sm">
                                    <Icon name="home" size={32} />
                                </div>
                                <h3 className="text-3xl font-black mb-3 text-[#736357] dark:text-[#F7E7B5]">住宿 ＋ 洗澡</h3>
                                <p className="text-slate-400 font-medium text-sm mb-8 leading-relaxed">不關籠旅館，像家一樣的溫暖</p>
                                <div className="text-[#736357] dark:text-[#F7E7B5] font-bold flex items-center gap-2 text-sm uppercase tracking-wider group-hover:translate-x-2 transition-transform">
                                    開始填寫 <div className="bg-[#F7E7B5]/30 p-1.5 rounded-full group-hover:bg-[#736357] group-hover:text-white transition-colors"><Icon name="arrow-right" size={16}/></div>
                                </div>
                            </button>
                        </div>

                        <footer className="py-8 text-center relative z-20">
                            <a href="admin.html" className="inline-flex items-center justify-center p-4 text-slate-300 hover:text-[#736357] dark:hover:text-[#F7E7B5]" title="Staff Only">
                                <Icon name="lock" size={28} />
                            </a>
                        </footer>

                    </div>
                );
            }

            // Show skeleton while loading
            if (isPageLoading) {
                return (
                    <div className="min-h-screen pb-32">
                        <nav className="fixed top-0 w-full z-40 bg-white/80 dark:bg-gray-800/80 backdrop-blur-xl border-b border-[#736357]/5 shadow-sm">
                            <div className="px-6 py-4 flex justify-between items-center max-w-7xl mx-auto">
                                <div className="flex items-center gap-3">
                                    <div className="skeleton w-8 h-8 rounded-full"></div>
                                    <div className="skeleton w-24 h-6"></div>
                                </div>
                                <div className="skeleton w-20 h-8 rounded-full"></div>
                            </div>
                        </nav>
                        <main className="pt-32 px-4 max-w-4xl mx-auto space-y-8">
                            <div className="text-center space-y-3 pb-4">
                                <div className="skeleton h-6 w-48 mx-auto"></div>
                                <div className="skeleton h-10 w-72 mx-auto"></div>
                            </div>
                            <SkeletonSection />
                            <SkeletonSection />
                        </main>
                    </div>
                );
            }

            return (
                <div className="min-h-screen pb-32">
                    <DarkModeToggle />
                    {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                    {showSuccess && <SuccessReceipt data={formData} signature={realtimeSig} onClose={handleSuccessClose} />}
                    {showHistoryModal && <HistoryModal records={historyRecords} onClose={() => setShowHistoryModal(false)} onSelect={handleApplyHistory} />}

                    <nav className="fixed top-0 w-full z-40 bg-white/80 dark:bg-gray-800/80 backdrop-blur-xl border-b border-[#736357]/5 dark:border-gray-700 shadow-sm">
                        <div className="px-6 py-4 flex justify-between items-center max-w-7xl mx-auto">
                            <div className="flex items-center gap-3 cursor-pointer group" onClick={() => setView('entry')}>
                                <img src="./logo.png" alt="Logo" className="w-8 h-8 object-contain group-hover:rotate-12 transition-transform" />
                                <div className="font-black text-xl text-[#736357] dark:text-[#F7E7B5] tracking-tight">汪汪犬旅</div>
                            </div>
                            <button onClick={() => setView('entry')} className="text-xs font-bold text-[#736357]/60 dark:text-gray-400 hover:text-[#736357] dark:hover:text-[#F7E7B5] hover:bg-[#736357]/5 dark:hover:bg-gray-700 px-4 py-2 border border-[#736357]/10 dark:border-gray-600 rounded-full transition-all flex items-center gap-2">
                                <Icon name="arrow-left" size={14}/> 返回首頁
                            </button>
                        </div>
                    </nav>

                    <main className="pt-32 px-4 max-w-4xl mx-auto space-y-8">
                        <div className="text-center space-y-3 pb-4">
                            <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-[#736357]/5 dark:bg-gray-700 text-[#736357] dark:text-[#F7E7B5] text-xs font-bold uppercase tracking-wider">
                                {isBoarding ? "Boarding & Grooming" : "Grooming Service"}
                            </div>
                            <h2 className="text-3xl md:text-4xl font-black text-[#736357] dark:text-[#F7E7B5] tracking-tight">
                                {isBoarding ? "住宿與美容服務填寫" : "美容服務填寫資料"}
                            </h2>
                        </div>

                        <UnifiedLineSection formData={formData} setFormData={setFormData} />
                        
                        <div className="space-y-10">
                            {/* 1. 飼主基本資料 */}
                            <section className="glass-card p-8 md:p-10 space-y-8 section-highlight">
                                <div className="flex items-center gap-4 border-b border-[#736357]/10 dark:border-gray-600 pb-6">
                                    <div className="w-10 h-10 rounded-full bg-[#736357]/5 dark:bg-gray-700 flex items-center justify-center text-[#736357] dark:text-[#F7E7B5]">
                                        <Icon name="user" size={20}/>
                                    </div>
                                    <h3 className="text-xl font-bold text-[#736357] dark:text-[#F7E7B5]">飼主基本資料</h3>
                                </div>
                                <div className="grid md:grid-cols-2 gap-6">
                                    <div className="space-y-1.5">
                                        <label className="text-xs font-bold text-slate-400 ml-1">電子郵件 *(寄送契約副本用)</label>
                                        <InputWithError 
                                            name="email" 
                                            type="email" 
                                            value={formData.email} 
                                            onChange={e=>handleChange('email', e.target.value)} 
                                            placeholder="example@email.com"
                                            error={errors.email}
                                        />
                                    </div>
                                    <div className="space-y-1.5">
                                        <label className="text-xs font-bold text-slate-400 ml-1">主人姓名 *</label>
                                        <InputWithError 
                                            name="owner_name" 
                                            value={formData.owner_name} 
                                            onChange={e=>handleChange('owner_name', e.target.value)} 
                                            placeholder="請輸入全名"
                                            error={errors.owner_name}
                                        />
                                    </div>
                                    <div className="space-y-1.5">
                                        <label className="text-xs font-bold text-slate-400 ml-1">連絡電話 *</label>
                                        <div className="flex gap-2">
                                            <div className="flex-1">
                                                <InputWithError 
                                                    name="phone" 
                                                    type="tel" 
                                                    inputMode="numeric" 
                                                    value={formData.phone} 
                                                    onChange={e=>handleChange('phone', e.target.value.replace(/\D/g, ''))} 
                                                    placeholder="0912345678"
                                                    error={errors.phone}
                                                />
                                            </div>
                                            <button 
                                                onClick={handleSearchHistory} 
                                                disabled={isSearching}
                                                className="px-4 bg-[#736357] text-white rounded-xl font-bold text-sm shadow-md hover:bg-[#5D4D41] transition-all flex items-center gap-1 disabled:opacity-50 h-[54px]"
                                            >
                                                {isSearching ? <Icon name="loader-2" size={16} className="animate-spin" /> : <Icon name="search" size={16} />}
                                                舊客
                                            </button>
                                        </div>
                                    </div>
                                    <div className="space-y-1.5">
                                        <label className="text-xs font-bold text-slate-400 ml-1 flex items-center gap-1">
                                            身分證字號 <span className="text-red-500 font-black text-[10px] bg-red-50 dark:bg-red-900/30 px-1.5 py-0.5 rounded-md ml-1">入住時請攜帶正本核對</span> *
                                        </label>
                                        <InputWithError 
                                            name="owner_id" 
                                            value={formData.owner_id} 
                                            onChange={e=>handleChange('owner_id', e.target.value)} 
                                            placeholder="例如: A123456789"
                                            error={errors.owner_id}
                                        />
                                    </div>
                                    <div className="md:col-span-2 space-y-1.5">
                                        <label className="text-xs font-bold text-slate-400 ml-1">通訊地址 *</label>
                                        <InputWithError 
                                            name="address" 
                                            value={formData.address} 
                                            onChange={e=>handleChange('address', e.target.value)} 
                                            placeholder="請輸入完整地址"
                                            error={errors.address}
                                        />
                                    </div>
                                    
                                    <div className="space-y-1.5">
                                        <label className="text-xs font-bold text-red-400 ml-1">緊急聯絡人姓名 *</label>
                                        <InputWithError 
                                            name="emergency_name" 
                                            value={formData.emergency_name} 
                                            onChange={e=>handleChange('emergency_name', e.target.value)} 
                                            placeholder=""
                                            error={errors.emergency_name}
                                            className="border-red-50 bg-red-50/10 focus:border-red-200"
                                        />
                                    </div>
                                    <div className="space-y-1.5">
                                        <label className="text-xs font-bold text-red-400 ml-1">緊急連絡電話 *</label>
                                        <InputWithError 
                                            name="emergency_phone" 
                                            type="tel" 
                                            inputMode="numeric" 
                                            value={formData.emergency_phone} 
                                            onChange={e=>handleChange('emergency_phone', e.target.value.replace(/\D/g, ''))} 
                                            placeholder=""
                                            error={errors.emergency_phone}
                                            className="border-red-50 bg-red-50/10 focus:border-red-200"
                                        />
                                    </div>
                                </div>
                            </section>

                            {/* 2. 寵物資料與住宿問卷 */}
                            <section className={`glass-card p-8 md:p-10 space-y-8 section-highlight ${isBoarding ? 'bg-gradient-to-b from-white to-[#F7E7B5]/10 dark:from-gray-800 dark:to-[#F7E7B5]/5' : 'bg-white dark:bg-gray-800'}`}>
                                <div className="flex items-center gap-4 border-b border-[#736357]/10 dark:border-gray-600 pb-6">
                                    <div className="w-10 h-10 rounded-full bg-[#736357]/5 dark:bg-gray-700 flex items-center justify-center text-[#736357] dark:text-[#F7E7B5]">
                                        <Icon name="calendar" size={20}/>
                                    </div>
                                    <h3 className="text-xl font-bold text-[#736357] dark:text-[#F7E7B5]">
                                        {isBoarding ? "住宿行為與健康問卷" : "寵物詳細資料"}
                                    </h3>
                                </div>
                                
                                <div className="grid md:grid-cols-2 gap-6">
                                    {isBoarding && (
                                        <>
                                            <div className="space-y-1.5">
                                                <label className="text-xs font-bold text-slate-400 ml-1">入住日期 *</label>
                                                <InputWithError 
                                                    name="checkin_date" 
                                                    type="date" 
                                                    value={formData.checkin_date} 
                                                    onChange={e=>handleChange('checkin_date', e.target.value)} 
                                                    error={errors.checkin_date}
                                                />
                                            </div>
                                            <div className="space-y-1.5">
                                                <label className="text-xs font-bold text-slate-400 ml-1">退房日期 *</label>
                                                <InputWithError 
                                                    name="checkout_date" 
                                                    type="date" 
                                                    value={formData.checkout_date} 
                                                    onChange={e=>handleChange('checkout_date', e.target.value)} 
                                                    error={errors.checkout_date}
                                                />
                                            </div>
                                            {/* Stay duration display */}
                                            {stayDuration && (
                                                <div className="md:col-span-2 flex justify-center py-2">
                                                    <div className="stay-duration-badge">
                                                        <Icon name="calendar-days" size={18} />
                                                        <span>住宿天數：{stayDuration} 晚</span>
                                                    </div>
                                                </div>
                                            )}
                                        </>
                                    )}
                                    
                                    <div className="md:col-span-2 grid md:grid-cols-2 lg:grid-cols-3 gap-6 pt-4 border-t border-[#736357]/10 dark:border-gray-600 mt-2">
                                        <div className="space-y-1.5">

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>汪汪犬旅 | 數位契約填寫系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Noto+Sans+TC:wght@300;500;700&display=swap');
        :root { --brand-yellow: #F7E7B5; --brand-brown: #736357; --brand-light: #fefcf9; --line-green: #06C755; }
        body { font-family: 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif; background: var(--brand-light); color: var(--brand-brown); -webkit-font-smoothing: antialiased; }
        .glass-card { background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(16px); border: 1px solid rgba(115, 99, 87, 0.1); border-bottom: 4px solid var(--brand-yellow); box-shadow: 0 12px 40px -12px rgba(115, 99, 87, 0.12); transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1); border-radius: 2.5rem; }
        .glass-card:hover { transform: translateY(-4px); box-shadow: 0 25px 50px -15px rgba(115, 99, 87, 0.2); }
        .cute-input { background: #fdfaf6; border: 2px solid rgba(115, 99, 87, 0.05); transition: all 0.4s ease; box-shadow: inset 0 2px 4px rgba(115, 99, 87, 0.02); }
        .cute-input:focus { background: #ffffff; border-color: var(--brand-yellow); box-shadow: 0 0 0 5px rgba(247, 231, 181, 0.4); outline: none; }
        .canvas-container { position: relative; touch-action: none; user-select: none; }
        .canvas-container canvas { width: 100% !important; height: 100% !important; display: block; cursor: crosshair; }
        .section-dot { width: 8px; height: 8px; background: var(--brand-yellow); border-radius: 50%; display: inline-block; margin-right: 12px; box-shadow: 0 0 10px var(--brand-yellow); }
        @keyframes line-pulse { 0% { box-shadow: 0 0 0 0 rgba(6, 199, 85, 0.4); } 70% { box-shadow: 0 0 0 15px rgba(6, 199, 85, 0); } 100% { box-shadow: 0 0 0 0 rgba(6, 199, 85, 0); } }
        .line-btn-animated { background-color: var(--line-green); animation: line-pulse 2s infinite; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const Icon = ({ name, size = 20, className = "" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (window.lucide && iconRef.current) {
                    window.lucide.createIcons({ root: iconRef.current, attrs: { "stroke-width": 2, class: className } });
                }
            }, [name, className]);
            return <span ref={iconRef} key={name} className="inline-flex items-center justify-center"><i data-lucide={name} style={{ width: size, height: size }}></i></span>;
        };

const App = () => {
            const [view, setView] = useState('entry'); 
            const [isBoarding, setIsBoarding] = useState(false);
            const [showFullSig, setShowFullSig] = useState(false);
            const [realtimeSig, setRealtimeSig] = useState(null);
            const [boardingOpen, setBoardingOpen] = useState(false);
            const [groomingOpen, setGroomingOpen] = useState(false);
            const [isSubmitting, setIsSubmitting] = useState(false);

            const [formData, setFormData] = useState({
                email: '', owner_name: '', owner_id: '', phone: '', address: '', 
                emergency_name: '', emergency_phone: '',
                pet_name: '', breed: '', sex: '', age: '', weight: '', fix: '', 
                chip_status: '無晶片', chip_id: '', preferred_clinic: '',
                is_human_friendly: '', dog_traits: [], is_barking: '', barking_detail: '',
                medical_status: '無', medical_history: [], medical_history_other: '',
                checkin_date: '', checkout_date: '', stay_exp: '',
                crate_status: [], food_aggr: '', pad_toilet: '',
                vaccine: '', deworm: '', deworm_brand: '', 
                allergy: '', personality: '', special_notes: '', boarding_notice_agree: false,
                service_type: '', pickup_time: '', service_price: '',
                legal_agree: false
            });

            const fullSigCanvasRef = useRef(null);
            const padInstance = useRef(null);

            const selectServiceFlow = (type) => {
                const isB = type === 'both';
                setIsBoarding(isB);
                setView('client');
                setTimeout(() => { window.scrollTo({top: 0, behavior: 'smooth'}); }, 100);
            };

            const toggleArrayField = (field, value) => {
                setFormData(prev => {
                    const currentArr = Array.isArray(prev[field]) ? prev[field] : [];
                    let updatedArr = currentArr.includes(value) ? currentArr.filter(i => i !== value) : [...currentArr, value];
                    return { ...prev, [field]: updatedArr };
                });
            };

            useEffect(() => {
                let timer;
                if (showFullSig && fullSigCanvasRef.current) {
                    timer = setTimeout(() => {
                        const canvas = fullSigCanvasRef.current;
                        const ratio = Math.max(window.devicePixelRatio || 1, 1);
                        const updateSize = () => {
                            const rect = canvas.getBoundingClientRect();
                            canvas.width = rect.width * ratio;
                            canvas.height = rect.height * ratio;
                            const context = canvas.getContext("2d");
                            context.setTransform(ratio, 0, 0, ratio, 0, 0);
                        };
                        updateSize();
                        padInstance.current = new SignaturePad(canvas, { penColor: "rgb(115, 99, 87)" });
                    }, 150);
                }
                return () => { if (timer) clearTimeout(timer); if (padInstance.current) padInstance.current.off(); };
            }, [showFullSig]);

            const pillBtn = (field, val, active) => (
                <button type="button" onClick={() => setFormData({...formData, [field]: val})} className={`flex-1 py-4 rounded-2xl font-bold text-sm border-2 transition-all duration-300 ${active ? 'bg-[#736357] text-white border-[#736357] shadow-lg scale-[1.03]' : 'bg-white text-slate-400 border-slate-100 hover:border-[#F7E7B5]'}`}>{val}</button>
            );

            const UnifiedLineSection = ({ formData, setFormData }) => {
                const [lineConfirmed, setLineConfirmed] = useState(false);
                return (
                    <div className="glass-card overflow-hidden border-none bg-gradient-to-br from-white via-white to-[#F7E7B5]/30 p-8">
                        <div className="flex flex-col lg:flex-row items-center gap-8">
                            <div className="flex-1 space-y-4 text-center lg:text-left">
                                <div className="flex items-center justify-center lg:justify-start gap-3">
                                    <div className="w-12 h-12 bg-[#06C755] text-white rounded-2xl flex items-center justify-center shadow-lg transform -rotate-3"><Icon name="message-circle" size={26} /></div>
                                    <h3 className="text-2xl font-black text-[#736357]">官方 LINE 諮詢服務</h3>
                                </div>
                                <div className="space-y-2 text-[#736357] font-bold text-sm leading-relaxed opacity-90">
                                    <p>讓我們入住前更了解您的小寶貝，請先加 LINE 並 <span className="text-red-500 underline decoration-wavy underline-offset-4">丟個貼圖</span> 我們才看得到您哦！😊</p>
                                    <p className="text-[#06C755] text-xs">LINE ID: @cik3330f</p>
                                </div>
                            </div>
                            <div className="flex flex-col items-center gap-3 min-w-[240px]">
                                <a href="https://line.me/R/ti/p/@cik3330f" target="_blank" className="line-btn-animated w-full text-center py-4 rounded-2xl text-white font-black text-lg shadow-xl hover:scale-105 transition-transform">立即加 LINE</a>
                                <button type="button" onClick={() => setLineConfirmed(!lineConfirmed)} className={`w-full flex items-center justify-center gap-2 px-6 py-3 rounded-xl font-black text-xs transition-all duration-500 border-2 ${lineConfirmed ? 'bg-[#06C755] text-white border-[#06C755] shadow-inner' : 'bg-white text-[#06C755] border-[#06C755] hover:bg-[#06C755]/5'}`}><Icon name={lineConfirmed ? "check-circle" : "circle"} size={14} />{lineConfirmed ? "已加 LINE 並丟貼圖" : "確認：已加 LINE 丟貼圖"}</button>
                            </div>
                        </div>
                    </div>
                );
            };

            if (view === 'entry') {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-8 bg-[#fefcf9]">
                        <div className="w-48 h-48 md:w-64 md:h-64 mx-auto mb-6 flex items-center justify-center">
                            <img src="./logo.png" alt="汪汪犬旅 Logo" className="w-full h-full object-contain drop-shadow-2xl" />
                        </div>
                        <div className="grid md:grid-cols-2 gap-10 w-full max-w-5xl px-4">
                            <button onClick={() => selectServiceFlow('grooming')} className="glass-card p-12 text-left group bg-white">
                                <Icon name="scissors" size={36} className="text-[#736357] mb-8" />
                                <h3 className="text-3xl font-black mb-4 text-[#736357]">美容洗澡</h3>
                                <div className="text-[#736357] font-black flex items-center gap-2">Start Journey <Icon name="arrow-right" /></div>
                            </button>
                            <button onClick={() => selectServiceFlow('both')} className="glass-card p-12 text-left group bg-[#F7E7B5]/10 border-[#F7E7B5]/40">
                                <Icon name="home" size={36} className="text-[#736357] mb-8" />
                                <h3 className="text-3xl font-black mb-4 text-[#736357]">住宿 ＋ 美容</h3>
                                <div className="text-[#736357] font-black flex items-center gap-2">Start Journey <Icon name="arrow-right" /></div>
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen pb-32">
                    <nav className="fixed top-0 w-full z-40 bg-white/80 backdrop-blur-xl border-b border-[#F7E7B5]/20 px-8 py-6 flex justify-between items-center shadow-sm">
                        <div className="flex items-center gap-3 cursor-pointer" onClick={() => setView('entry')}>
                            <img src="./logo.png" alt="Logo" className="w-10 h-10 object-contain" />
                            <div className="font-black text-2xl text-[#736357] tracking-tight">汪汪犬旅</div>
                        </div>
                        <button onClick={() => setView('entry')} className="text-[10px] font-black text-[#736357]/60 border px-5 py-2 rounded-full hover:text-[#736357]">Back to Menu</button>
                    </nav>

<main className="pt-36 px-6 max-w-4xl mx-auto space-y-8">
                        <div className="text-center space-y-4">
                            <h2 className="text-4xl md:text-5xl font-black text-[#736357]">
                                {isBoarding ? "住宿與美容服務填寫" : "美容服務填寫資料"}
                            </h2>
                        </div>

                        <UnifiedLineSection formData={formData} setFormData={setFormData} />
                        
                        <div className="space-y-12 pt-4">
                            {/* 1. 飼主基本資料 (兩者皆需填寫) */}
                            <section className="glass-card p-12 space-y-8">
                                <h3 className="text-2xl font-black text-[#736357] border-b pb-4 flex items-center gap-2"><Icon name="user"/> 飼主基本資料</h3>
                                <div className="grid md:grid-cols-2 gap-8">
                                    <div className="space-y-2"><label className="text-sm font-bold text-slate-400">電子郵件 *</label><input type="email" value={formData.email} onChange={e=>setFormData({...formData, email:e.target.value})} className="w-full cute-input rounded-2xl px-6 py-4 font-bold text-[#736357]" /></div>
                                    <div className="space-y-2"><label className="text-sm font-bold text-slate-400">主人姓名 *</label><input value={formData.owner_name} onChange={e=>setFormData({...formData, owner_name:e.target.value})} className="w-full cute-input rounded-2xl px-6 py-4 font-bold text-[#736357]" /></div>
                                    <div className="space-y-2"><label className="text-sm font-bold text-slate-400">連絡電話 *</label><input type="tel" value={formData.phone} onChange={e=>setFormData({...formData, phone:e.target.value})} className="w-full cute-input rounded-2xl px-6 py-4 font-bold text-[#736357]" /></div>
                                    <div className="space-y-2"><label className="text-sm font-bold text-slate-400">身分證字號 *</label><input value={formData.owner_id} onChange={e=>setFormData({...formData, owner_id:e.target.value})} className="w-full cute-input rounded-2xl px-6 py-4 font-bold text-[#736357]" /></div>
                                    <div className="space-y-2"><label className="text-sm font-bold text-slate-400 text-red-500">緊急聯絡人姓名 *</label><input value={formData.emergency_name} onChange={e=>setFormData({...formData, emergency_name:e.target.value})} className="w-full cute-input rounded-2xl px-6 py-4 font-bold text-[#736357] border-red-100" /></div>
                                    <div className="space-y-2"><label className="text-sm font-bold text-slate-400 text-red-500">緊急連絡電話 *</label><input value={formData.emergency_phone} onChange={e=>setFormData({...formData, emergency_phone:e.target.value})} className="w-full cute-input rounded-2xl px-6 py-4 font-bold text-[#736357] border-red-100" /></div>
                                    <div className="md:col-span-2 space-y-2"><label className="text-sm font-bold text-slate-400">通訊地址 *</label><input value={formData.address} onChange={e=>setFormData({...formData, address:e.target.value})} className="w-full cute-input rounded-2xl px-6 py-4 font-bold text-[#736357]" /></div>
                                </div>
                            </section>

                            {/* 2. 寵物詳細資料與住宿問卷 (核心邏輯區) */}
                            <section className="glass-card p-12 space-y-8 bg-[#F7E7B5]/5">
                                <h3 className="text-2xl font-black text-[#736357] border-b pb-4 flex items-center gap-2">
                                    <Icon name="calendar"/> {isBoarding ? "住宿行為與健康問卷" : "寵物詳細資料"}
                                </h3>
                                <div className="grid md:grid-cols-2 gap-8">
                                    {/* A. 住宿限定欄位 - 日期 */}
                                    {isBoarding && (
                                        <>
                                            <div className="space-y-2"><label className="text-sm font-bold text-slate-400">入住日期 *</label><input type="date" value={formData.checkin_date} onChange={e=>setFormData({...formData, checkin_date:e.target.value})} className="w-full cute-input rounded-2xl px-6 py-4 font-bold text-[#736357]" /></div>
                                            <div className="space-y-2"><label className="text-sm font-bold text-slate-400">退房日期 *</label><input type="date" value={formData.checkout_date} onChange={e=>setFormData({...formData, checkout_date:e.target.value})} className="w-full cute-input rounded-2xl px-6 py-4 font-bold text-[#736357]" /></div>
                                        </>
                                    )}
                                    
                                    {/* B. 共同顯示欄位 - 寵物基本資訊 */}
                                    <div className="md:col-span-2 grid md:grid-cols-2 lg:grid-cols-3 gap-8 pt-4 border-t border-[#736357]/10 mt-2">
                                        <div className="space-y-2"><label className="text-sm font-bold text-slate-400 ml-1">寵物名字 *</label><input value={formData.pet_name} onChange={e=>setFormData({...formData, pet_name:e.target.value})} className="w-full cute-input rounded-2xl px-6 py-4 font-bold text-[#736357]" /></div>
                                        <div className="space-y-2"><label className="text-sm font-bold text-slate-400 ml-1">品種 *</label><input value={formData.breed} onChange={e=>setFormData({...formData, breed:e.target.value})} className="w-full cute-input rounded-2xl px-6 py-4 font-bold text-[#736357]" /></div>
                                        <div className="space-y-2"><label className="text-sm font-bold text-slate-400 ml-1">體重 * (kg)</label><input type="number" value={formData.weight} onChange={e=>setFormData({...formData, weight:e.target.value})} className="w-full cute-input rounded-2xl px-6 py-4 font-bold text-[#736357]" /></div>
                                        <div className="space-y-2"><label className="text-sm font-bold text-slate-400 ml-1">年齡 *</label><input value={formData.age} onChange={e=>setFormData({...formData, age:e.target.value})} className="w-full cute-input rounded-2xl px-6 py-4 font-bold text-[#736357]" /></div>
                                        <div className="space-y-3"><label className="text-sm font-bold text-slate-400 ml-1">性別</label><div className="flex gap-2">{pillBtn('sex', '公', formData.sex==='公')}{pillBtn('sex', '母', formData.sex==='母')}</div></div>
                                        <div className="space-y-3"><label className="text-sm font-bold text-slate-400 ml-1">結紮</label><div className="flex gap-2">{pillBtn('fix', '是', formData.fix==='是')}{pillBtn('fix', '否', formData.fix==='否')}</div></div>
                                    </div>

                                    {/* C. 共同顯示欄位 - 表現、晶片與診所 */}
                                    <div className="md:col-span-2 space-y-8 pt-4 border-t border-[#736357]/10 mt-4">
                                        <div className="grid md:grid-cols-2 gap-8">
                                            <div className="space-y-3">
                                                <label className="text-sm font-bold text-slate-400">親狗表現 (可複選) *</label>
                                                <div className="flex flex-wrap gap-2">
                                                    {['有攻擊性','無攻擊性','可與狗朋友們一起玩耍','不能與狗朋友們一起玩耍'].map(v => (
                                                        <button type="button" key={v} onClick={()=>toggleArrayField('dog_traits', v)} className={`px-4 py-2 rounded-xl text-xs font-bold border-2 transition-all ${formData.dog_traits.includes(v) ? 'bg-[#736357] text-white' : 'bg-white text-slate-400'}`}>{v}</button>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>

                                        <div className="space-y-3">
                                            <label className="text-sm font-bold text-slate-400">晶片 *</label>
                                            <div className="flex flex-wrap gap-4">
                                                {['有晶片', '有晶片(號碼不詳)', '無晶片'].map(s => (
                                                    <button key={s} type="button" onClick={()=>setFormData({...formData, chip_status: s})} className={`px-5 py-3 rounded-xl font-bold text-sm border-2 transition-all ${formData.chip_status === s ? 'bg-[#736357] text-white border-[#736357]' : 'bg-white text-slate-400 border-slate-100'}`}>{s}</button>
                                                ))}
                                            </div>
                                            {formData.chip_status === '有晶片' && <input placeholder="輸入晶片號碼" value={formData.chip_id} onChange={e=>setFormData({...formData, chip_id:e.target.value})} className="w-full cute-input rounded-2xl px-6 py-4 font-bold text-[#736357]" />}
                                        </div>

                                        <div className="space-y-2">
                                            <label className="text-sm font-bold text-slate-400">指定就醫診所 (若未填寫則送往特約醫院)</label>
                                            <input value={formData.preferred_clinic} onChange={e=>setFormData({...formData, preferred_clinic:e.target.value})} className="w-full cute-input rounded-2xl px-6 py-4 font-bold text-[#736357]" placeholder="例如：汪汪動物醫院" />
                                        </div>

                                        <div className="space-y-3">
                                            <label className="text-sm font-bold text-slate-400">過往病史 (可複選) *</label>
                                            <div className="flex gap-3 mb-4">{pillBtn('medical_status', '無', formData.medical_status === '無')}{pillBtn('medical_status', '有', formData.medical_status === '有')}</div>
                                            {formData.medical_status === '有' && (
                                                <div className="space-y-4 animate-in fade-in">
                                                    <div className="flex flex-wrap gap-2">
                                                        {['心臟病','氣喘','氣管塌陷','白內障','癲癇','心絲蟲','艾利希體','腹膜炎','腹積水','手術外傷未癒合','髖關節問題','骨折','腸炎','血便','血尿','懷孕','傳診性疾病'].map(v => (
                                                            <button type="button" key={v} onClick={() => toggleArrayField('medical_history', v)} className={`px-4 py-2 rounded-full text-xs font-bold border-2 transition-all ${formData.medical_history.includes(v) ? 'bg-[#736357] text-white' : 'bg-white text-slate-400'}`}>{v}</button>
                                                        ))}
                                                        <button type="button" onClick={() => toggleArrayField('medical_history', '其他')} className={`px-4 py-2 rounded-full text-xs font-bold border-2 transition-all ${formData.medical_history.includes('其他') ? 'bg-[#06C755] text-white' : 'bg-white text-slate-400 border-dashed border-slate-300'}`}>＋ 其他</button>
                                                    </div>
                                                    {formData.medical_history.includes('其他') && <textarea value={formData.medical_history_other || ''} onChange={e => setFormData({...formData, medical_history_other: e.target.value})} className="w-full cute-input rounded-xl px-4 py-3 font-bold text-[#736357] min-h-[80px] text-sm" placeholder="請詳細說明其他病史..." />}
                                                </div>
                                            )}
                                        </div>
                                    </div>

                                    {/* D. 住宿限定欄位 - 吠叫/護食/疫苗/籠內/日常注意/圖片 */}
                                    {isBoarding && (
                                        <div className="md:col-span-2 space-y-8 pt-4 border-t border-[#736357]/10 mt-4">
                                            <div className="grid md:grid-cols-2 gap-8">
                                                <div className="space-y-3">
                                                    <label className="text-sm font-bold text-slate-400">會容易吠叫嗎 *</label>
                                                    <div className="flex gap-2">{pillBtn('is_barking', '會', formData.is_barking === '會')}{pillBtn('is_barking', '不會', formData.is_barking === '不會')}</div>
                                                    {formData.is_barking === '會' && <textarea value={formData.barking_detail || ''} onChange={e => setFormData({...formData, barking_detail: e.target.value})} className="w-full cute-input rounded-xl px-4 py-3 font-bold text-[#736357] mt-2 min-h-[80px] text-sm" placeholder="什麼情況下會吠叫？" />}
                                                </div>
                                                <div className="space-y-3"><label className="text-sm font-bold text-slate-400">有住宿過的經驗嗎 *</label><div className="flex gap-2">{pillBtn('stay_exp', '有', formData.stay_exp==='有')}{pillBtn('stay_exp', '沒有', formData.stay_exp==='沒有')}</div></div>
                                                <div className="space-y-3"><label className="text-sm font-bold text-slate-400">會護食嗎 *</label><div className="flex gap-2">{pillBtn('food_aggr', '會', formData.food_aggr==='會')}{pillBtn('food_aggr', '不會', formData.food_aggr==='不會')}</div></div>
                                                <div className="space-y-3"><label className="text-sm font-bold text-slate-400">會在尿布墊上上廁所嗎 *</label><div className="flex gap-2">{pillBtn('pad_toilet', '會', formData.pad_toilet==='會')}{pillBtn('pad_toilet', '不會', formData.pad_toilet==='不會')}</div></div>
                                                <div className="space-y-3"><label className="text-sm font-bold text-slate-400">每年定期施打疫苗 (請提供疫苗手冊) *</label><div className="flex gap-2">{pillBtn('vaccine', '有', formData.vaccine==='有')}{pillBtn('vaccine', '沒有', formData.vaccine==='沒有')}</div></div>
                                                <div className="space-y-3">
                                                    <label className="text-sm font-bold text-slate-400">每月定期驅蟲預防 *</label>
                                                    <div className="flex gap-2">{pillBtn('deworm', '有', formData.deworm==='有')}{pillBtn('deworm', '無', formData.deworm==='無')}</div>
                                                    {formData.deworm === '有' && <input value={formData.deworm_brand} onChange={e=>setFormData({...formData, deworm_brand:e.target.value})} className="w-full cute-input rounded-xl px-4 py-3 font-bold text-[#736357] mt-2 text-sm" placeholder="使用哪個牌子的驅蟲藥？" />}
                                                </div>
                                            </div>

                                            <div className="space-y-3">
                                                <div className="flex flex-col gap-1">
                                                    <label className="text-sm font-bold text-slate-400">籠內訓練狀況 (可複選) *</label>
                                                    <p className="text-[11px] font-bold text-[#736357]/70">何謂籠內訓練：<a href="https://www.hapet.com.tw/blog/posts/cratetraining" target="_blank" className="text-[#736357] underline decoration-dashed underline-offset-4 hover:text-[#06C755]">能在圍欄內獨立休息，不焦慮、不持續吠叫、不激動衝撞</a></p>
                                                </div>
                                                <div className="flex flex-col gap-2 pt-1">
                                                    {['有 平常在家都有在圍欄內或籠子睡覺','有 以前有訓練過 但日常沒有維持','有 但不確認現在能不能適應','沒有 但之前在外住宿 在房間可以適應得很好','從來沒有'].map(v => (
                                                        <button type="button" key={v} onClick={()=>toggleArrayField('crate_status', v)} className={`px-5 py-3 rounded-xl text-left text-xs font-bold border-2 transition-all duration-300 ${formData.crate_status.includes(v) ? 'bg-[#736357] text-white shadow-md translate-x-1' : 'bg-white text-slate-400 border-slate-100 hover:border-[#F7E7B5]'}`}>{v}</button>
                                                    ))}
                                                </div>
                                            </div>

                                            <div className="space-y-8 border-t border-[#736357]/10 pt-8">
                                                <h4 className="text-xl font-black text-[#736357] flex items-center gap-2"><Icon name="info" size={20}/> 狗狗的日常情形及注意事項</h4>
                                                <div className="space-y-2"><label className="text-sm font-bold text-slate-400">有對什麼過敏嗎 (例如:雞肉或牛肉) *</label><textarea value={formData.allergy} onChange={e=>setFormData({...formData, allergy:e.target.value})} className="w-full cute-input rounded-2xl px-6 py-4 font-bold text-[#736357] min-h-[100px]" placeholder="您的回答" /></div>
                                                <div className="space-y-2"><label className="text-sm font-bold text-slate-400">個性如何呢? 有分離焦慮嗎? *</label><textarea value={formData.personality} onChange={e=>setFormData({...formData, personality:e.target.value})} className="w-full cute-input rounded-2xl px-6 py-4 font-bold text-[#736357] min-h-[100px]" placeholder="您的回答" /></div>
                                                <div className="space-y-2"><label className="text-sm font-bold text-slate-400">有需要特別注意的嗎? 任何事情都可以說越詳細越好</label><textarea value={formData.special_notes} onChange={e=>setFormData({...formData, special_notes:e.target.value})} className="w-full cute-input rounded-2xl px-6 py-4 font-bold text-[#736357] min-h-[120px]" placeholder="您的回答" /></div>
                                                
                                                <div className="max-w-xl mx-auto overflow-hidden rounded-[2rem] border-4 border-[#F7E7B5] shadow-xl bg-white group">
                                                    <img src="./入住須知.jpg" alt="入住須知" className="w-full h-auto object-contain block" onError={(e) => { e.target.parentNode.innerHTML = '<div className="p-10 text-center text-[#736357] font-bold">💡 請確認 "入住須知.jpg" 放置於同一路徑下</div>'; }} />
                                                    <div className="bg-[#F7E7B5] p-3 text-center text-[#736357] text-xs font-black tracking-widest flex items-center justify-center gap-2"><Icon name="eye" size={14}/> 請務必詳閱上方內容</div>
                                                </div>

                                                <div className="pt-4">
                                                    <label className="flex items-center gap-4 cursor-pointer group bg-white p-6 rounded-2xl border-2 border-red-100 hover:border-red-300 transition-all shadow-sm">
                                                        <input type="checkbox" checked={formData.boarding_notice_agree} onChange={e=>setFormData({...formData, boarding_notice_agree:e.target.checked})} className="accent-red-500 w-7 h-7 cursor-pointer" />
                                                        <div className="flex flex-col">
                                                            <span className="text-base font-black text-red-500 underline decoration-2 underline-offset-4">入住即代表同意入住須知及注意事項 *</span>
                                                            <p className="text-[11px] text-slate-400 font-bold mt-1">我已確認理解上述所有規範，並願意承諾遵守。</p>
                                                        </div>
                                                    </label>
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </section>

                            {/* 3. 本次服務內容 (僅美容洗澡顯示) */}
                            {!isBoarding && (
                                <section className="glass-card p-12 space-y-8 animate-in fade-in">
                                    <h3 className="text-2xl font-black text-[#736357] border-b pb-4 flex items-center gap-2"><Icon name="scissors"/> 本次服務內容</h3>
                                    <div className="grid md:grid-cols-2 gap-8">
                                        <div className="md:col-span-2 space-y-4">
                                            <label className="text-sm font-bold text-slate-400">服務項目</label>
                                            <div className="flex flex-wrap gap-3">{['包月洗澡','基礎洗澡','精緻美容','局部修剪','寵物安親','其他項目'].map(s => (<button key={s} type="button" onClick={()=>setFormData({...formData, service_type: s})} className={`px-6 py-4 rounded-2xl font-bold text-sm border-2 transition-all ${formData.service_type === s ? 'bg-[#736357] text-white border-[#736357]' : 'bg-white text-slate-400'}`}>{s}</button>))}</div>
                                        </div>
                                        <div className="space-y-2"><label className="text-sm font-bold text-slate-400">預計接回時間</label><input type="time" value={formData.pickup_time} onChange={e=>setFormData({...formData, pickup_time:e.target.value})} className="w-full cute-input rounded-2xl px-6 py-4 font-bold text-[#736357]" /><p className="text-[10px] text-red-500 font-bold italic mt-2 ml-1">※ 逾時 30 分鐘以上，將依每小時 $200 加收安親費。</p></div>
                                        <div className="space-y-2"><label className="text-sm font-bold text-slate-400">本次服務金額 *NT$</label><input type="number" placeholder="請輸入金額" value={formData.service_price} onChange={e=>setFormData({...formData, service_price:e.target.value})} className="w-full cute-input rounded-2xl px-6 py-4 font-bold text-[#736357]" /><p className="text-[10px] text-slate-400 font-bold italic mt-2 ml-1">※ 此金額為基礎報價，若有特殊狀況將另行告知加價。</p></div>
                                    </div>
                                </section>
                            )}

                            {/* 4. 法律條款與數位簽署 (兩者皆需) */}
                            <section className="glass-card p-12 space-y-10">
                                <div className="flex items-center gap-4 border-b pb-4"><Icon name="edit-3" className="text-[#736357]"/><h3 className="text-2xl font-black text-[#736357]">法律條款與數位簽署</h3></div>
                                <div className="bg-[#fefcf9] rounded-[3rem] p-10 space-y-6 border border-slate-100 shadow-inner">
                                    {isBoarding && (
                                        <div className="space-y-4">
                                            <button type="button" onClick={() => setBoardingOpen(!boardingOpen)} className="w-full flex justify-between items-center text-sm font-black text-[#736357] bg-white px-8 py-5 rounded-2xl shadow-sm border"><span>📜 閱讀完整犬、貓寄養契約條款</span><Icon name="chevron-down" className={`transition-all duration-500 ${boardingOpen ? 'rotate-180' : ''}`}/></button>
                                            {boardingOpen && (
                                                <div className="text-xs text-slate-600 p-6 bg-white rounded-2xl border leading-loose space-y-2 animate-in fade-in">
                                                    <p>一、飼主須於三天前預約住宿。二、本旅館採不關籠方式，入住前須在本館美容洗澡。三、須證明已施打疫苗。四、需提供兩位緊急聯絡人。五、需自備飼料物品。六、逾時加收安親費。七、損壞設施需照價賠償。</p>
                                                </div>
                                            )}
                                        </div>
                                    )}
                                    <div className="space-y-4">
                                        <button type="button" onClick={() => setGroomingOpen(!groomingOpen)} className="w-full flex justify-between items-center text-sm font-black text-[#736357] bg-white px-8 py-5 rounded-2xl shadow-sm border"><span>📜 閱讀完整犬、貓美容契約條款</span><Icon name="chevron-down" className={`transition-all duration-500 ${groomingOpen ? 'rotate-180' : ''}`}/></button>
                                        {groomingOpen && <div className="text-xs text-slate-600 p-6 bg-white rounded-2xl border leading-loose">1. 特殊病史請事先告知。2. 寄生蟲將逕行除蟲，費用由飼主負擔。3. 逾時接回將酌收安親託管費。</div>}
                                    </div>
                                    <div className="pt-6 border-t border-slate-100"><label className="flex items-center gap-5 cursor-pointer group"><input type="checkbox" checked={formData.legal_agree} onChange={e=>setFormData({...formData, legal_agree:e.target.checked})} className="accent-[#736357] w-6 h-6" /><span className="text-lg font-black text-[#736357]">本人已詳閱並理解以上契約條款，保證填寫資訊屬實。</span></label></div>
                                </div>
                                <div onClick={() => setShowFullSig(true)} className="bg-[#fefcf9] border-4 border-dashed border-[#F7E7B5] h-60 rounded-[3rem] flex flex-col items-center justify-center cursor-pointer hover:bg-white transition-all overflow-hidden relative shadow-inner group">{realtimeSig ? <img src={realtimeSig} className="h-full object-contain p-8" /> : (<div className="text-center space-y-4"><div className="w-16 h-16 bg-[#736357] text-white rounded-2xl flex items-center justify-center mx-auto shadow-lg group-hover:scale-110 transition-transform"><Icon name="pen-tool" size={32} /></div><p className="text-lg font-black text-[#736357]">點擊此處開啟簽名板</p></div>)}</div>
                                <button onClick={() => {if(!formData.legal_agree || !realtimeSig) return alert("⚠️ 請勾選條款並簽名"); if(isBoarding && !formData.boarding_notice_agree) return alert("⚠️ 請勾選住宿須知同意書"); setIsSubmitting(true); setTimeout(()=>{alert("✨ 存檔成功！"); setIsSubmitting(false); window.location.reload();}, 1000);}} disabled={isSubmitting} className="w-full py-8 bg-[#736357] text-white rounded-[2.5rem] font-black text-2xl shadow-2xl hover:opacity-90 active:scale-[0.98] disabled:bg-slate-200 transition-all">{isSubmitting ? "正在儲存資料..." : "確認並提交契約"}</button>
                            </section>
                        </div>
                    </main>

                    {showFullSig && (
                        <div className="fixed inset-0 bg-slate-900/95 backdrop-blur-2xl z-[100] flex flex-col p-6 md:p-12">
                            <div className="flex-1 bg-white rounded-[5rem] overflow-hidden flex flex-col shadow-2xl relative">
                                <div className="flex justify-between items-center px-12 py-10 border-b"><button onClick={()=>setShowFullSig(false)} className="text-sm font-black uppercase text-slate-300">Cancel</button><div className="text-center"><span className="font-black text-[#736357] text-2xl tracking-tighter italic leading-none">汪汪犬旅</span></div><button onClick={()=>{setRealtimeSig(padInstance.current.toDataURL()); setShowFullSig(false);}} className="bg-[#736357] text-white px-10 py-4 rounded-[1.5rem] font-black shadow-xl hover:scale-105 transition-all">完成簽署</button></div>
                                <div className="flex-1 canvas-container"><canvas ref={fullSigCanvasRef}></canvas></div>
                                <div className="absolute bottom-12 w-full flex justify-center"><button onClick={()=>padInstance.current.clear()} className="bg-white text-slate-400 text-xs font-black px-8 py-4 rounded-full shadow-lg border hover:text-[#736357] flex items-center gap-2"><Icon name="eraser" size={14}/> 清除重簽</button></div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

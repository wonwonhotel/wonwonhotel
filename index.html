                                                                        <button type="button" onClick={() => setFormData({...formData, vaccine_file: null})} className="absolute top-3 right-3 bg-white/90 text-red-500 p-2 rounded-full shadow-lg hover:bg-red-50 transition-colors">
                                                                            <Icon name="x" size={16} />
                                                                        </button>
                                                                </div>
                                                            )}
                                                        </div>
                                                    )}
                                                </div>
                                                <div className="space-y-3" id="deworm">
                                                    <label className="text-xs font-bold text-slate-400 ml-1">每月定期驅蟲預防 *</label>
                                                    <div className={`flex gap-2 ${errors.deworm ? 'group-error' : ''}`}>{pillBtn('deworm', '有', formData.deworm==='有')}{pillBtn('deworm', '無', formData.deworm==='無')}</div>
                                                    {formData.deworm === '有' && <input name="deworm_brand" value={formData.deworm_brand} onChange={e=>handleChange('deworm_brand', e.target.value)} className={`w-full cute-input rounded-xl px-5 py-3 font-bold text-[#736357] mt-2 text-sm shadow-inner ${errors.deworm_brand ? 'shake-error' : ''}`} placeholder="使用哪個牌子的驅蟲藥？" />}
                                                </div>
                                            </div>

                                            <div className="space-y-4" id="crate_status">
                                                <div className="flex flex-col gap-1.5">
                                                    <label className="text-xs font-bold text-slate-400 ml-1">籠內訓練狀況 (可複選) *</label>
                                                    <p className="text-[11px] font-bold text-[#736357]/60 ml-1">何謂籠內訓練：<a href="https://www.hapet.com.tw/blog/posts/cratetraining" target="_blank" className="text-[#736357] underline decoration-dashed underline-offset-4 hover:text-[#06C755] transition-all">能在圍欄或房間內獨立休息，不焦慮、不持續吠叫、不激動衝撞</a></p>
                                                </div>
                                                <div className={`flex flex-col gap-2.5 pt-1 ${errors.crate_status ? 'group-error' : ''}`}>
                                                    {['有 平常在家都有在圍欄內或籠子睡覺','有 以前有訓練過 但日常沒有維持','有 但不確認現在能不能適應','沒有 但之前在外住宿 在房間可以適應得很好','從來沒有'].map(v => (
                                                        <button type="button" key={v} onClick={()=>toggleArrayField('crate_status', v)} className={`pill-button px-5 py-4 rounded-xl text-left text-xs font-bold border transition-all duration-300 ${formData.crate_status.includes(v) ? 'bg-[#736357] text-white shadow-md translate-x-1' : 'bg-white text-slate-400 border-slate-200 hover:border-[#F7E7B5] hover:text-[#736357]'}`}>{v}</button>
                                                    ))}
                                                </div>
                                            </div>

                                            <div className="space-y-8 border-t border-[#736357]/20 pt-10 mt-10">
                                                <div className="flex items-center gap-3">
                                                    <Icon name="info" size={24} className="text-[#736357]"/>
                                                    <h4 className="text-xl font-bold text-[#736357]">狗狗的日常情形及注意事項</h4>
                                                </div>
                                                <div className="space-y-1.5"><label className="text-xs font-bold text-slate-400 ml-1">有對什麼過敏嗎 (例如:雞肉或牛肉) *</label><textarea name="allergy" value={formData.allergy} onChange={e=>handleChange('allergy', e.target.value)} className={`w-full cute-input rounded-xl px-5 py-3.5 font-bold text-[#736357] min-h-[100px] ${errors.allergy ? 'shake-error' : ''}`} placeholder="請詳細填寫過敏原..."/></div>
                                                <div className="space-y-1.5"><label className="text-xs font-bold text-slate-400 ml-1">個性如何呢? 有分離焦慮嗎? *</label><textarea name="personality" value={formData.personality} onChange={e=>handleChange('personality', e.target.value)} className={`w-full cute-input rounded-xl px-5 py-3.5 font-bold text-[#736357] min-h-[100px] ${errors.personality ? 'shake-error' : ''}`} placeholder="請描述個性、與其他狗相處狀況..."/></div>
                                                <div className="space-y-1.5"><label className="text-xs font-bold text-slate-400 ml-1">有需要特別注意的嗎? 任何事情都可以說越詳細越好 *</label><textarea name="special_notes" value={formData.special_notes} onChange={e=>handleChange('special_notes', e.target.value)} className={`w-full cute-input rounded-xl px-5 py-3.5 font-bold text-[#736357] min-h-[120px] ${errors.special_notes ? 'shake-error' : ''}`} placeholder="餵食習慣、特殊癖好、身體狀況備註等... (若無請填無)"/></div>
                                                
                                                <div className="max-w-xl mx-auto overflow-hidden rounded-[2rem] border-[6px] border-[#F7E7B5] shadow-xl bg-white group hover:scale-[1.01] transition-transform duration-500">
                                                    <img src="./入住須知.jpg" alt="入住須知" className="w-full h-auto object-contain block" onError={(e) => { e.target.onerror = null; e.target.parentNode.innerHTML = '<div className="p-16 text-center text-[#736357] font-bold bg-[#F7E7B5]/10">💡 提示：請確認 "入住須知.jpg" 圖片已與 HTML 置於同一路徑</div>'; }} />
                                                    <div className="bg-[#F7E7B5] p-3.5 text-center text-[#736357] text-xs font-black tracking-widest flex items-center justify-center gap-2"><Icon name="eye" size={14}/> 請務必詳閱上方入住須知內容</div>
                                                </div>

                                                <div className="pt-4">
                                                    <label id="boarding_notice_agree" className={`flex items-center gap-4 cursor-pointer group bg-white p-7 rounded-[2rem] border-2 transition-all shadow-sm hover:shadow-md ${errors.boarding_notice_agree ? 'shake-error border-red-500' : 'border-red-100 hover:border-red-300'}`}>
                                                        <div className="relative">
                                                            <input type="checkbox" checked={formData.boarding_notice_agree} onChange={e=>handleChange('boarding_notice_agree', e.target.checked)} className="accent-red-500 w-8 h-8 cursor-pointer relative z-10" />
                                                            <div className="absolute inset-0 bg-red-100 rounded-lg scale-75 blur-sm group-hover:scale-110 transition-transform"></div>
                                                        </div>
                                                        <div className="flex flex-col">
                                                            <span className="text-base font-black text-red-500 underline decoration-2 underline-offset-4 tracking-tight">入住即代表同意入住須知及注意事項 *</span>
                                                            <p className="text-[11px] text-slate-400 font-bold mt-1.5 tracking-wide leading-none">我已確認理解上述所有規範，並願意承諾遵守。</p>
                                                        </div>
                                                    </label>
                                                </div>

                                                {/* 已移除住宿費用輸入欄位 */}

                                            </div>
                                        </div>
                                    )}
                                </div>
                            </section>

                            {/* 3. 本次服務內容 (非住宿時顯示) */}
                            {!isBoarding && (
                                <section className="glass-card p-8 md:p-10 space-y-8 animate-in fade-in duration-500 section-highlight">
                                    <div className="flex items-center gap-4 border-b border-[#736357]/10 pb-6">
                                        <div className="w-10 h-10 rounded-full bg-[#736357]/5 flex items-center justify-center text-[#736357]">
                                            <Icon name="scissors" size={20}/>
                                        </div>
                                        <h3 className="text-xl font-bold text-[#736357]">本次服務內容</h3>
                                    </div>
                                    <div className="grid md:grid-cols-2 gap-8">
                                        <div className="md:col-span-2 space-y-4">
                                            <label className="text-xs font-bold text-slate-400 ml-1 tracking-wider uppercase">服務項目 *</label>
                                            <div id="service_type" className={`flex flex-wrap gap-3 ${errors.service_type ? 'group-error' : ''}`}>
                                                {['包月洗澡','基礎洗澡','精緻美容','局部修剪','寵物安親','其他項目'].map(s => (
                                                    <button key={s} type="button" onClick={()=>handleChange('service_type', s)} 
                                                        className={`pill-button px-6 py-4 rounded-2xl font-bold text-sm border transition-all ${formData.service_type === s ? 'bg-[#736357] text-white border-[#736357] shadow-lg shadow-[#736357]/20 scale-[1.02]' : 'bg-white text-slate-400 border-slate-200 hover:border-[#F7E7B5] hover:text-[#736357]'}`}>
                                                        {s}
                                                    </button>
                                                ))}
                                            </div>
                                            {formData.service_type === '其他項目' && (
                                                <div className="mt-3 animate-in fade-in">
                                                    <input name="service_type_other" value={formData.service_type_other} onChange={e=>handleChange('service_type_other', e.target.value)} 
                                                        className={`w-full cute-input rounded-xl px-5 py-3.5 font-bold text-[#736357] ${errors.service_type_other ? 'shake-error' : ''}`} placeholder="請填寫其他服務項目內容..."
                                                    />
                                                </div>
                                            )}
                                        </div>
                                        
                                        <div className="space-y-2">
                                            <div className="flex flex-col">
                                                <label className="text-xs font-bold text-slate-400 ml-1 uppercase">預計接回時間</label>
                                                <span className="text-[11px] text-red-500 font-bold ml-1">* 若未填寫，則另行通知接回時間</span>
                                            </div>
                                            <input type={formData.pickup_time ? "time" : "text"} placeholder="(另行通知)"
                                                onFocus={(e) => e.target.type = 'time'}
                                                onBlur={(e) => { if(!e.target.value) e.target.type = 'text'; }}
                                                value={formData.pickup_time} onChange={e=>setFormData({...formData, pickup_time:e.target.value})} 
                                                className="w-full cute-input rounded-xl px-5 py-3.5 font-bold text-[#736357] min-h-[54px] placeholder-slate-300" 
                                            />
                                            {formData.pickup_time && (
                                                <button type="button" onClick={() => setFormData({...formData, pickup_time: ''})}
                                                    className="text-xs font-bold text-slate-400 underline decoration-dashed ml-1 hover:text-[#736357] transition-colors">
                                                    清除時間 (改為另行通知)
                                                </button>
                                            )}
                                            <p className="text-[10px] text-red-500 font-bold italic mt-2.5 ml-1">※ 逾時 30 分鐘以上，將依每小時 $200 加收安親費。</p>
                                        </div>

                                        <div className="space-y-2">
                                            <label className="text-xs font-bold text-slate-400 ml-1 uppercase">本次服務金額 *</label>
                                            <div className="relative group">
                                                <span className="absolute left-5 top-1/2 -translate-y-1/2 text-lg font-bold text-[#736357] z-10">NT$</span>
                                                <input name="service_price" type="tel" inputMode="numeric" pattern="[0-9]*" placeholder="0" 
                                                    value={formData.service_price} onChange={e => handleChange('service_price', e.target.value.replace(/[^0-9]/g, ''))} 
                                                    className={`w-full cute-input rounded-xl py-4 pr-5 pl-16 font-bold text-[#736357] text-2xl shadow-inner ${errors.service_price ? 'shake-error' : ''}`} 
                                                />
                                            </div>
                                            <p className="text-[10px] text-slate-400 font-bold italic mt-2.5 ml-1">※ 此金額為基礎報價，若有特殊狀況將另行告知加價。</p>
                                        </div>
                                    </div>
                                </section>
                            )}

                            {/* 4. 法律條款與數位簽署 (保持不變) */}
                            <section className="glass-card p-8 md:p-10 space-y-10 section-highlight">
                                <div className="flex items-center gap-4 border-b border-[#736357]/10 pb-6">
                                    <div className="w-10 h-10 rounded-full bg-[#736357]/5 flex items-center justify-center text-[#736357]">
                                        <Icon name="edit-3" size={20}/>
                                    </div>
                                    <h3 className="text-xl font-bold text-[#736357]">法律條款與數位簽署</h3>
                                </div>
                                
                                <div className="bg-[#fefcf9] rounded-[2.5rem] p-8 md:p-10 space-y-6 border border-slate-100 shadow-inner">
                                    {isBoarding && (
                                        <div className="space-y-4">
                                            <button type="button" onClick={() => setBoardingOpen(!boardingOpen)} className="w-full flex justify-between items-center text-sm font-black text-[#736357] bg-white px-8 py-5 rounded-2xl shadow-sm border border-[#736357]/5 hover:bg-[#F7E7B5]/20 hover:border-[#F7E7B5]/50 transition-all group">
                                                <span>📜 閱讀完整犬、貓寄養契約條款</span>
                                                <div className={`transition-transform duration-500 bg-[#736357]/10 p-1.5 rounded-full group-hover:bg-[#736357] group-hover:text-white ${boardingOpen ? 'rotate-180' : ''}`}>
                                                    <Icon name="chevron-down" size={16}/>
                                                </div>
                                            </button>
                                            {boardingOpen && (
                                                <div className="text-xs text-slate-500 p-8 bg-white rounded-2xl border border-dashed leading-loose space-y-3 animate-in slide-in-from-top-2">
                                                    <p className="font-bold border-b pb-2">一、飼主誠實告知義務：</p>
                                                    <p>甲方須於三天前預約住宿。本旅館採不關籠方式，入住前須在本館美容洗澡。須證明已施打疫苗並提供兩位緊急聯絡人。需自備飼料物品。逾時將加收安親費。損壞設施需照價賠償。</p>
                                                </div>
                                            )}
                                        </div>
                                    )}
                                    <div className="space-y-4">
                                        <button type="button" onClick={() => setGroomingOpen(!groomingOpen)} className="w-full flex justify-between items-center text-sm font-black text-[#736357] bg-white px-8 py-5 rounded-2xl shadow-sm border border-[#736357]/5 hover:bg-[#F7E7B5]/20 hover:border-[#F7E7B5]/50 transition-all group">
                                            <span>📜 閱讀完整犬、貓美容契約條款</span>
                                            <div className={`transition-transform duration-500 bg-[#736357]/10 p-1.5 rounded-full group-hover:bg-[#736357] group-hover:text-white ${groomingOpen ? 'rotate-180' : ''}`}>
                                                <Icon name="chevron-down" size={16}/>
                                            </div>
                                        </button>
                                        {groomingOpen && (
                                            <div className="text-xs text-slate-500 p-8 bg-white rounded-2xl border border-dashed leading-loose space-y-3 animate-in slide-in-from-top-2">
                                                <p>1. 特殊病史請事先告知。2. 寄生蟲將逕行除蟲，費用由飼主負擔。3. 逾時接回將酌收安親託管費。</p>
                                            </div>
                                        )}
                                    </div>
                                    
                                    <div className="pt-6 border-t border-slate-100">
                                        <label id="legal_agree" className={`flex items-center gap-5 cursor-pointer group p-4 rounded-2xl transition-all ${errors.legal_agree ? 'shake-error' : ''}`}>
                                            <input type="checkbox" checked={formData.legal_agree} onChange={e=>handleChange('legal_agree', e.target.checked)} className="accent-[#736357] w-7 h-7 cursor-pointer" />
                                            <span className="text-lg font-black text-[#736357] tracking-tight group-hover:opacity-80 transition-opacity">本人已詳閱並理解以上契約條款，保證填寫資訊屬實。</span>
                                        </label>
                                    </div>
                                </div>

                                <div className="space-y-4">
                                    <div className="flex justify-between items-end px-2">
                                        <label className="text-xs font-bold text-slate-400 uppercase tracking-wider">飼主簽名處 *</label>
                                        {realtimeSig && (
                                            <span className="text-[10px] bg-[#06C755]/10 text-[#06C755] px-3 py-1 rounded-full font-bold animate-in fade-in flex items-center gap-1">
                                                <Icon name="check" size={12}/> 已完成簽署
                                            </span>
                                        )}
                                    </div>

                                    <div id="signature" className={`relative w-full rounded-[2.5rem] transition-all duration-300 overflow-hidden group ${realtimeSig ? 'bg-white shadow-lg border-2 border-[#736357]' : 'bg-[#fdfaf6] border-4 border-dashed border-[#F7E7B5] hover:border-[#736357]/30 hover:bg-[#F7E7B5]/10 cursor-pointer'} ${errors.signature ? 'shake-error border-red-500' : ''}`}
                                        onClick={() => !realtimeSig && setShowFullSig(true)}>
                                        {realtimeSig ? (
                                            <div className="relative h-64 flex items-center justify-center p-8 bg-[url('https://www.transparenttextures.com/patterns/cream-paper.png')]">
                                                <img src={realtimeSig} className="h-full object-contain drop-shadow-sm rotate-[-2deg] scale-110" alt="簽名預覽" />
                                            </div>
                                        ) : (
                                            <div className="h-64 flex flex-col items-center justify-center space-y-4">
                                                <div className="w-20 h-20 bg-white rounded-3xl flex items-center justify-center shadow-sm border border-[#736357]/10 group-hover:scale-110 group-hover:rotate-6 transition-all duration-300">
                                                    <Icon name="pen-tool" className="text-[#736357]" size={32} />
                                                </div>
                                                <div className="text-center space-y-1">
                                                    <p className="text-xl font-black text-[#736357] tracking-tight">點擊此處開啟數位簽名板</p>
                                                    <p className="text-xs font-bold text-slate-400">請在框線內簽上您的全名</p>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                    
                                    {realtimeSig && (
                                        <div className="flex justify-center pt-2 animate-in fade-in">
                                            <button type="button" onClick={() => { setShowFullSig(true); }} className="flex items-center gap-2 px-6 py-3 rounded-full bg-slate-100 text-slate-500 font-bold text-sm hover:bg-[#736357] hover:text-white hover:shadow-lg transition-all active:scale-95 group">
                                                <div className="group-hover:rotate-[-180deg] transition-transform duration-500">
                                                    <Icon name="rotate-ccw" size={16}/> 
                                                </div>
                                                清除重簽
                                            </button>
                                        </div>
                                    )}
                                </div>

                                <button onClick={handleSubmit} disabled={isSubmitting || isProcessingImg} className="w-full py-7 bg-gradient-to-r from-[#736357] to-[#8b786a] text-white rounded-[2.5rem] font-black text-2xl shadow-xl hover:shadow-2xl hover:translate-y-[-2px] active:scale-[0.98] disabled:bg-slate-200 disabled:from-slate-300 disabled:to-slate-300 transition-all flex items-center justify-center gap-3">
                                    {isSubmitting ? (
                                        <React.Fragment><Icon name="loader-2" className="animate-spin" size={28}/> 正在儲存資料...</React.Fragment>
                                    ) : (
                                        <React.Fragment>確認並提交數位契約 <Icon name="send" size={24}/></React.Fragment>
                                    )}
                                </button>
                            </section>
                        </div>
                    </main>

                    {showFullSig && (
                        <div 
                            className="fixed inset-0 bg-slate-900/95 backdrop-blur-2xl z-[100] flex flex-col p-4 md:p-12 animate-in fade-in duration-300"
                            style={{ touchAction: 'none', overscrollBehavior: 'none' }}
                            onTouchMove={(e) => e.preventDefault()}
                        >
                            <div className="flex-1 bg-white rounded-[2rem] md:rounded-[3rem] overflow-hidden flex flex-col shadow-2xl relative border-4 border-[#F7E7B5]">
                                <div className="flex justify-between items-center px-3 md:px-8 py-3 md:py-6 border-b border-[#736357]/10 bg-[#fefcf9] flex-shrink-0">
                                    {/* 優化後的取消按鈕 - 增大觸控區域 */}
                                    <button 
                                        onClick={()=>setShowFullSig(false)} 
                                        className="min-w-[60px] min-h-[48px] px-4 py-3 rounded-xl bg-slate-100 hover:bg-red-50 text-slate-400 hover:text-red-500 font-black text-sm transition-all flex items-center justify-center gap-1.5 active:scale-95"
                                    >
                                        <Icon name="x" size={20}/> 
                                        <span className="hidden sm:inline">取消</span>
                                    </button>
                                    <div className="text-center hidden md:block">
                                        <span className="font-black text-[#736357] text-2xl tracking-tighter italic leading-none">汪汪犬旅 數位簽名</span>
                                    </div>
                                    <button onClick={() => {
                                        if (padInstance.current.isEmpty()) { alert("⚠️ 請先簽名後再點擊完成！"); } 
                                        else {
                                            setRealtimeSig(padInstance.current.toDataURL("image/jpeg", 0.5)); 
                                            setShowFullSig(false); 
                                            handleChange('signature', true);
                                            // 簽名完成後滾動到簽名區域
                                            setTimeout(() => {
                                                const sigEl = document.getElementById('signature');
                                                if (sigEl) sigEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                                            }, 100);
                                        }
                                    }} className="bg-[#736357] text-white px-5 md:px-8 py-3 rounded-xl font-black shadow-lg hover:scale-105 transition-all flex items-center gap-2 min-h-[48px] active:scale-95">
                                        <Icon name="check" size={18}/> 完成
                                    </button>
                                </div>
                                
                                {/* 建議直式簽名提示 */}
                                <div className="flex-shrink-0 bg-gradient-to-r from-[#F7E7B5]/30 via-[#F7E7B5]/50 to-[#F7E7B5]/30 py-2.5 px-4 flex items-center justify-center gap-2 md:hidden">
                                    <span className="text-xs font-bold text-[#736357]">📱 建議手機直式簽名，效果更佳</span>
                                </div>
                                
                                <div 
                                    className="flex-1 canvas-container bg-slate-50/50 relative"
                                    style={{ touchAction: 'none', minHeight: '200px' }}
                                >
                                    <div className="absolute inset-0 pointer-events-none opacity-20 bg-[radial-gradient(#736357_1px,transparent_1px)] [background-size:16px_16px]"></div>
                                    <canvas 
                                        ref={fullSigCanvasRef} 
                                        className="w-full h-full relative z-10"
                                        style={{ touchAction: 'none' }}
                                    ></canvas>
                                </div>
                                <div className="flex-shrink-0 py-4 md:py-6 flex justify-center bg-white border-t border-[#736357]/10">
                                    <button onClick={()=>padInstance.current.clear()} className="bg-white/90 backdrop-blur text-[#736357] text-xs font-black px-8 py-3 rounded-full shadow-xl border border-[#736357]/10 hover:bg-[#F7E7B5]/20 transition-all flex items-center gap-2 transform hover:scale-105">
                                        <Icon name="eraser" size={16}/> 清除重寫
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

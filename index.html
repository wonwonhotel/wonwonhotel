<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">

    <title>汪汪犬旅 | 數位契約填寫系統</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#736357">
    
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">    

    <link rel="preconnect" href="https://cdn.tailwindcss.com">
    <link rel="preconnect" href="https://unpkg.com">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/react-datepicker@4.25.0/dist/react-datepicker.min.css">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Tailwind config with dark mode
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            yellow: '#F7E7B5',
                            brown: '#736357',
                            'dark-brown': '#5D4D41',
                            light: '#fbf9f6'
                        }
                    }
                }
            }
        }
    </script>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js" defer></script>
    <script src="https://unpkg.com/lucide@latest" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>

    <style>
        
        :root { 
            --brand-yellow: #F7E7B5; 
            --brand-brown: #736357; 
            --brand-dark-brown: #5D4D41;
            --brand-light: #fbf9f6; 
            --line-green: #06C755; 
            --error-red: #ef4444;
            --info-blue: #3b82f6;
        }

html, body { 
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    font-family: 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif; 
    background-color: var(--brand-light);
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
    color: var(--brand-brown); 
    -webkit-font-smoothing: antialiased; 
    -webkit-tap-highlight-color: transparent; 
    overflow-x: hidden;
    overscroll-behavior-y: contain;
    transition: background-color 0.3s, color 0.3s;
}


        /* Dark mode styles */
        body.dark {
            background-color: #1f2937;
            color: #f3f4f6;
        }

        .dark .glass-card {
            background: rgba(55, 65, 81, 0.95);
            border-color: rgba(75, 85, 99, 0.6);
        }

        .dark .cute-input {
            background: #374151;
            border-color: #4b5563;
            color: #f3f4f6;
        }

        .dark .cute-input:focus {
            background: #4b5563;
            border-color: var(--brand-yellow);
        }

        .dark .cute-input::placeholder {
            color: #6b7280;
        }

        .dark .text-slate-400 { color: #9ca3af; }
        .dark .text-slate-500 { color: #6b7280; }
        .dark .border-slate-100 { border-color: #4b5563; }
        .dark .bg-white { background-color: #374151; }
        .dark .bg-slate-50 { background-color: #1f2937; }

        .glass-card { 
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6); 
            border-bottom: 0;
            box-shadow: 
                0 4px 6px -1px rgba(115, 99, 87, 0.05), 
                0 10px 15px -3px rgba(115, 99, 87, 0.05),
                inset 0 0 0 1px rgba(255,255,255,0.5); 
            border-radius: 2rem; 
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
        }

        .section-highlight { border-bottom: 3px solid var(--brand-yellow); }

        .cute-input { 
            background: #ffffff; 
            border: 3px solid #eeebe6; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            color: var(--brand-dark-brown);
            box-shadow: 0 2px 8px rgba(115, 99, 87, 0.06), inset 0 1px 3px rgba(255, 255, 255, 0.9);
        }

        .cute-input:focus { 
            background: #ffffff; 
            border-color: var(--brand-brown); 
            box-shadow: 0 0 0 5px rgba(115, 99, 87, 0.15), 0 6px 16px rgba(115, 99, 87, 0.12); 
            outline: none; 
            transform: translateY(-2px);
        }

        .cute-input.input-error {
            border-color: var(--error-red) !important;
            background-color: #fef2f2 !important;
            box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.15), 0 4px 12px rgba(239, 68, 68, 0.2) !important;
        }

        .dark .cute-input.input-error {
            background-color: rgba(239, 68, 68, 0.1) !important;
        }

        .cute-input::placeholder { color: #d1ccc5; }

        .canvas-container { 
            position: relative; 
            border-radius: 1.5rem; 
            overflow: hidden; 
            background: #fff; 
            touch-action: none; 
            user-select: none;
            -webkit-user-select: none; 
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.05);
        }

        .canvas-container, 
        .canvas-container canvas {
            touch-action: none;
            display: block;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-user-drag: none;
        }

        .canvas-container canvas {
            width: 100%;
            height: 100%;
        }

body.signing-mode {
    position: fixed !important;
    width: 100vw !important;
    height: 100vh !important;
    top: 0 !important;
    left: 0 !important;
    overflow: hidden !important;
    touch-action: none !important;
}


        .fullscreen-signature {
            position: fixed;
            inset: 0;
            z-index: 100;
            touch-action: none;
            -webkit-overflow-scrolling: none;
            overscroll-behavior: none;
        }

        @keyframes pulse-soft { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.02); } }
        .line-btn-animated { background-color: var(--line-green); animation: pulse-soft 2.5s infinite ease-in-out; }

        .fade-enter { opacity: 0; transform: translateY(10px); }
        .fade-enter-active { opacity: 1; transform: translateY(0); transition: all 0.5s cubic-bezier(0.2, 0.8, 0.2, 1); }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }
        
        .shake-error {
            animation: shake 0.4s ease-in-out;
        }

        .group-error {
            padding: 8px;
            margin: -4px;
            border-radius: 1.2rem;
            border: 2px dashed var(--error-red);
            background-color: #fff8f8;
            animation: shake 0.4s ease-in-out;
        }

        .dark .group-error {
            background-color: rgba(239, 68, 68, 0.1);
        }

        .pill-button {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .pill-button:active {
            transform: scale(0.96);
        }

        @keyframes slide-down {
            from { transform: translate(-50%, -100%); opacity: 0; }
            to { transform: translate(-50%, 24px); opacity: 1; }
        }
        .toast-enter { animation: slide-down 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        /* Field error message */
        .field-error {
            color: var(--error-red);
            font-size: 11px;
            font-weight: 700;
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 4px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Skeleton loading */
        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: skeleton-loading 1.5s infinite;
            border-radius: 0.5rem;
        }

        .dark .skeleton {
            background: linear-gradient(90deg, #374151 25%, #4b5563 50%, #374151 75%);
            background-size: 200% 100%;
        }

        @keyframes skeleton-loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Date picker custom styles */
        .react-datepicker-wrapper {
            width: 100%;
        }
        .react-datepicker__input-container input {
            width: 100%;
        }
        .react-datepicker {
            font-family: 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif !important;
            border: 2px solid var(--brand-brown) !important;
            border-radius: 1rem !important;
            box-shadow: 0 10px 25px -5px rgba(115, 99, 87, 0.2) !important;
        }
        .react-datepicker__header {
            background: var(--brand-yellow) !important;
            border-bottom: none !important;
            border-radius: 0.8rem 0.8rem 0 0 !important;
        }
        .react-datepicker__current-month {
            color: var(--brand-brown) !important;
            font-weight: 800 !important;
        }
        .react-datepicker__day-name {
            color: var(--brand-brown) !important;
            font-weight: 700 !important;
        }
        .react-datepicker__day--selected {
            background: var(--brand-brown) !important;
            border-radius: 50% !important;
        }
        .react-datepicker__day:hover {
            background: var(--brand-yellow) !important;
            border-radius: 50% !important;
        }
        .react-datepicker__day--in-range {
            background: rgba(115, 99, 87, 0.2) !important;
        }
        .react-datepicker__day--in-selecting-range {
            background: rgba(247, 231, 181, 0.5) !important;
        }

        /* Stay duration badge */
        .stay-duration-badge {
            background: linear-gradient(135deg, var(--brand-yellow), #ffd700);
            color: var(--brand-brown);
            padding: 8px 16px;
            border-radius: 9999px;
            font-weight: 800;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 12px rgba(247, 231, 181, 0.4);
            animation: pulse-soft 2s infinite;
        }

        /* Dark mode toggle button */
        .dark-mode-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 50;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--brand-brown);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(115, 99, 87, 0.3);
            cursor: pointer;
            transition: all 0.3s;
        }
        .dark-mode-toggle:hover {
            transform: scale(1.1);
        }
        .dark .dark-mode-toggle {
            background: var(--brand-yellow);
            color: var(--brand-brown);
        }
    </style>
</head>

<body>
    <div id="root"></div>
    
<script type="text/babel">
const { useState, useEffect, useRef, useMemo, useCallback } = React;
        // --- Terms Modal Component (全螢幕條款彈窗) ---
        const TermsModal = ({ isOpen, onClose, title, children, onAgree }) => {
            const contentRef = useRef(null);
            const [canAgree, setCanAgree] = useState(false);

            useEffect(() => {
                if (isOpen) {
                    setCanAgree(false); // 每次打開重置
                    document.body.style.overflow = 'hidden'; // 禁止背景捲動
                } else {
                    document.body.style.overflow = '';
                }
                return () => { document.body.style.overflow = ''; };
            }, [isOpen]);

            const handleScroll = (e) => {
                const { scrollTop, scrollHeight, clientHeight } = e.target;
                // 檢查是否捲動到底部 (容許 50px 誤差)
                if (scrollHeight - scrollTop - clientHeight < 50) {
                    setCanAgree(true);
                }
            };

// 初始檢查：如果內容很短不需要捲動，直接允許同意
            useEffect(() => {
                if (isOpen) {
                    setCanAgree(false); // 先重置為不可點擊
                    
                    // ⚡️ 重點修改：延遲 500ms 等待動畫結束後，才檢查內容高度
                    const timer = setTimeout(() => {
                        if (contentRef.current) {
                            // 若內容確實短於視窗 (不需要捲動)，才自動解鎖
                            if (contentRef.current.scrollHeight <= contentRef.current.clientHeight + 1) {
                                setCanAgree(true);
                            }
                        }
                    }, 500);
                    return () => clearTimeout(timer);
                }
            }, [isOpen]);

            if (!isOpen) return null;

            return (
                <div className="fixed inset-0 z-[150] bg-white dark:bg-gray-900 flex flex-col animate-in slide-in-from-bottom-full duration-300">
                    {/* Header */}
                    <div className="px-5 py-4 border-b border-slate-100 dark:border-gray-800 bg-white/90 dark:bg-gray-900/90 backdrop-blur-sm flex justify-between items-center shrink-0">
                        <h3 className="text-lg font-black text-[#736357] dark:text-[#F7E7B5]">{title}</h3>
                        <button type="button" onClick={onClose} className="p-2 bg-slate-100 dark:bg-gray-800 rounded-full hover:bg-slate-200 dark:hover:bg-gray-700 transition-colors">
                            <Icon name="x" size={20} className="text-slate-500 dark:text-gray-400" />
                        </button>
                    </div>

                    {/* Content (Scrollable) */}
                    <div 
                        ref={contentRef}
                        onScroll={handleScroll}
                        className="flex-1 overflow-y-auto p-6 text-sm leading-relaxed text-[#736357] dark:text-gray-300 space-y-4"
                    >
                        {children}
                        <div className="h-10"></div> {/* 底部留白 */}
                    </div>

                    {/* Footer Action */}
                    <div className="p-5 border-t border-slate-100 dark:border-gray-800 bg-white dark:bg-gray-900 shrink-0 shadow-[0_-5px_20px_rgba(0,0,0,0.05)]">
                        {!canAgree && (
                            <div className="text-center text-xs font-bold text-red-400 mb-3 animate-pulse">
                                👇 請滑動至最底部以同意條款
                            </div>
                        )}
                        <button 
                            onClick={() => {
                                if(canAgree) {
                                    if (onAgree) onAgree();
                                    onClose();
                                }
                            }}
                            type="button"

                            disabled={!canAgree}
                            className={`w-full py-4 rounded-xl font-bold text-base flex items-center justify-center gap-2 transition-all ${
                                canAgree 
                                    ? 'bg-[#736357] text-white shadow-lg shadow-[#736357]/30 hover:bg-[#5D4D41]' 
                                    : 'bg-slate-200 dark:bg-gray-700 text-slate-400 dark:text-gray-500 cursor-not-allowed'
                            }`}
                        >
                            <Icon name="check-circle" size={20} />
                            本人已詳閱並同意以上契約內容
                        </button>
                    </div>
                </div>
            );
        };

        const SUPABASE_URL = 'https://fpkzuotxxbsqisgwupix.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_VsAJfSi7Fb3zu_A5Ksm2wA_mAUkDLBs'; 
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // --- Dark Mode Hook ---
        const useDarkMode = () => {
            const [isDark, setIsDark] = useState(() => {
                const saved = localStorage.getItem('darkMode');
                if (saved !== null) return JSON.parse(saved);
                return window.matchMedia('(prefers-color-scheme: dark)').matches;
            });

            useEffect(() => {
                localStorage.setItem('darkMode', JSON.stringify(isDark));
                document.body.classList.toggle('dark', isDark);
            }, [isDark]);

            return [isDark, setIsDark];
        };

        const dataURLtoBlob = (dataurl) => {
            let arr = dataurl.split(','), mime = arr[0].match(/:(.*?);/)[1],
                bstr = atob(arr[1]), n = bstr.length, u8arr = new Uint8Array(n);
            while(n--){
                u8arr[n] = bstr.charCodeAt(n);
            }
            return new Blob([u8arr], {type:mime});
        }

const Icon = ({ name, size = 20, className = "" }) => {
    const iconRef = useRef(null);
    useEffect(() => {
        // 確保 lucide 已載入
        if (typeof window.lucide !== 'undefined' && iconRef.current) {
            window.lucide.createIcons({ 
                root: iconRef.current, 
                attrs: { "stroke-width": 2.5, class: className },
                name: name,
                nameAttr: 'data-lucide'
            });
        }
    }, [name, className]);
    return <span ref={iconRef} key={name} className="inline-flex items-center justify-center"><i data-lucide={name} style={{ width: size, height: size }}></i></span>;
};


        const Toast = ({ message, type = 'error', onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, [onClose]);
            const bgColor = type === 'error' ? 'bg-[#ef4444] shadow-red-200' : 'bg-[#06C755] shadow-green-200';
            const iconName = type === 'error' ? 'alert-circle' : 'check-circle';
            return (
                <div className={`fixed top-0 left-1/2 z-[200] flex items-center gap-3 px-6 py-4 rounded-full shadow-xl text-white font-bold text-sm tracking-wide toast-enter ${bgColor} backdrop-blur-md`}>
                    <Icon name={iconName} size={20} className="text-white" />
                    <span>{message}</span>
                </div>
            );
        };

        // --- Field Error Component ---
        const FieldError = ({ message }) => {
            if (!message) return null;
            return (
                <div className="field-error">
                    <Icon name="alert-circle" size={12} />
                    <span>{message}</span>
                </div>
            );
        };

        // --- Skeleton Loading Components ---
        const SkeletonInput = () => (
            <div className="space-y-1.5">
                <div className="skeleton h-4 w-24"></div>
                <div className="skeleton h-12 w-full"></div>
            </div>
        );

        const SkeletonSection = () => (
            <div className="glass-card p-8 space-y-6">
                <div className="skeleton h-6 w-48 mb-6"></div>
                <div className="grid md:grid-cols-2 gap-6">
                    <SkeletonInput />
                    <SkeletonInput />
                    <SkeletonInput />
                    <SkeletonInput />
                </div>
            </div>
        );

        // --- Input with Error Component ---
        const InputWithError = ({ name, type = 'text', value, onChange, placeholder, error, className = '', inputMode, pattern, step, min }) => (
            <div className="space-y-1">
                <input 
                    name={name}
                    id={name}
                    type={type}
                    inputMode={inputMode}
                    pattern={pattern}
                    step={step}
                    min={min}
                    value={value} 
                    onChange={onChange} 
                    className={`w-full cute-input rounded-xl px-5 py-3.5 font-bold text-[#736357] dark:text-[#F7E7B5] ${error ? 'input-error shake-error' : ''} ${className}`} 
                    placeholder={placeholder} 
                />
                <FieldError message={error} />
            </div>
        );

        // --- 舊客資料選擇 Modal ---
        const HistoryModal = ({ records, onClose, onSelect }) => {
            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-[#5D4D41]/40 backdrop-blur-sm animate-in fade-in duration-300">
                    <div className="w-full max-w-md bg-white dark:bg-gray-800 rounded-3xl overflow-hidden shadow-2xl relative max-h-[80vh] flex flex-col">
                        <div className="bg-[#736357] p-6 text-white text-center">
                            <h3 className="text-xl font-bold">🎉 歡迎回來！</h3>
                            <p className="text-sm opacity-80 mt-1">我們找到了以下寶貝的紀錄，請選擇要帶入的資料：</p>
                        </div>
                        <div className="p-6 space-y-3 overflow-y-auto bg-[#fbf9f6] dark:bg-gray-900">
                            {records.map((record, index) => (
                                <button key={index} onClick={() => onSelect(record)} 
                                    className="w-full bg-white dark:bg-gray-800 p-4 rounded-2xl border border-slate-100 dark:border-gray-700 shadow-sm hover:border-[#F7E7B5] hover:shadow-md transition-all text-left flex items-center gap-4 group">
                                    <div className="w-12 h-12 rounded-full bg-[#F7E7B5]/20 flex items-center justify-center text-[#736357] font-bold text-lg group-hover:bg-[#F7E7B5] transition-colors">
                                        {record.raw_data.pet_name.charAt(0)}
                                    </div>
                                    <div>
                                        <div className="font-bold text-[#736357] dark:text-[#F7E7B5] text-lg">{record.raw_data.pet_name}</div>
                                        <div className="text-xs text-slate-400">上次服務：{record.raw_data.service_type || '無紀錄'}</div>
                                    </div>
                                    <div className="ml-auto text-[#736357] dark:text-[#F7E7B5] opacity-0 group-hover:opacity-100 transition-opacity">
                                        <Icon name="arrow-right" size={20} />
                                    </div>
                                </button>
                            ))}
                        </div>
                        <div className="p-4 bg-white dark:bg-gray-800 border-t border-slate-100 dark:border-gray-700">
                            <button onClick={onClose} className="w-full py-3 rounded-xl text-slate-400 font-bold text-sm hover:bg-slate-50 dark:hover:bg-gray-700 transition-colors">
                                不使用舊資料，填寫新表單
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const SuccessReceipt = ({ data, signature, onClose }) => {
            const isBoarding = !!data.checkin_date;
            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-[#5D4D41]/40 backdrop-blur-sm animate-in fade-in duration-300">
                    <div className="w-full max-w-md bg-white dark:bg-gray-800 rounded-3xl overflow-hidden shadow-2xl relative max-h-[90vh] overflow-y-auto transform transition-all scale-100">
                        <div className="bg-[#736357] p-8 pb-10 text-center relative overflow-hidden flex flex-col justify-center min-h-[140px]">

        const compressImage = (file) => {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        const max_size = 1200; 
                        if (width > height) {
                            if (width > max_size) {
                                height *= max_size / width;
                                width = max_size;
                            }
                        } else {
                            if (height > max_size) {
                                width *= max_size / height;
                                height = max_size;
                            }
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
                        resolve(dataUrl);
                    };
                };
            });
        };

                        }
                    } catch (e) {

const initCanvas = () => {
    const canvas = fullSigCanvasRef.current;
    if (!canvas) return;
    
    // 檢查 SignaturePad 是否已載入
    if (typeof window.SignaturePad === 'undefined') {
        console.error('SignaturePad library not loaded');
        return;
    }
    
    const container = canvas.parentElement;
    const rect = container.getBoundingClientRect();
    const displayWidth = rect.width;
    const displayHeight = rect.height;
    
    canvasSizeRef.current = { width: displayWidth, height: displayHeight };
    
    const ratio = Math.max(window.devicePixelRatio || 1, 1);
    canvas.width = displayWidth * ratio;
    canvas.height = displayHeight * ratio;
    
    canvas.style.width = displayWidth + 'px';
    canvas.style.height = displayHeight + 'px';
    
    const ctx = canvas.getContext("2d");
    ctx.scale(ratio, ratio);
    
    ctx.fillStyle = "rgb(255, 255, 255)";
    ctx.fillRect(0, 0, displayWidth, displayHeight);
    
    if (padInstance.current) {
        padInstance.current.off();
    }
    
    padInstance.current = new window.SignaturePad(canvas, { 
        penColor: "rgb(115, 99, 87)",
        backgroundColor: "rgb(255, 255, 255)", 
        minWidth: 1.5,
        maxWidth: 4.0,
        throttle: 16, 
        minDistance: 3, 
        velocityFilterWeight: 0.7,
    });
};


                if (showFullSig && fullSigCanvasRef.current) {

                    document.addEventListener('gesturestart', preventGesture, { passive: false });
                    document.addEventListener('gesturechange', preventGesture, { passive: false });
                    document.addEventListener('gestureend', preventGesture, { passive: false });
                    
                    timer = setTimeout(initCanvas, 150);

                    if (padInstance.current) padInstance.current.off(); 
                    
                    unlockOrientation();
                    
                    document.body.classList.remove('signing-mode');
                    document.body.style.top = '';
                    window.scrollTo(0, scrollPositionRef.current);

                                            <div className="w-16 h-16 rounded-full bg-[#736357]/5 dark:bg-gray-700 flex items-center justify-center text-[#736357] dark:text-[#F7E7B5] group-hover:scale-110 group-hover:bg-[#F7E7B5]/30 transition-all">

                            {/* Modals 渲染區塊 - 這邊放置實際的彈窗內容 */}
                            
{/* 1. 住宿條款內容 */}
                            <TermsModal 
                                isOpen={activeModal === 'boarding'} 
                                onClose={() => setActiveModal(null)} 
                                title="犬、貓寄養契約條款"
                                onAgree={() => handleTermAgree('boarding')}
                            >
                                <div className="space-y-4">
                                    <div className="space-y-2">
                                        <h5 className="font-black text-base text-[#736357] dark:text-[#F7E7B5] bg-[#F7E7B5]/20 px-2 py-1 rounded-lg inline-block">一、基本條款</h5>
                                        <div className="pl-2 space-y-3">
                                            <p><span className="font-bold text-[#736357] dark:text-[#F7E7B5]">1. 服務公約與付款：</span>飼主已詳閱並充分瞭解本工作室住宿服務之公約、計費方式及相關規則，並同意遵守與如實付款。</p>
                                            <p><span className="font-bold text-[#736357] dark:text-[#F7E7B5]">2. 聯絡資料正確性：</span>飼主須正確填寫本人及緊急聯絡人資料，並確保服務期間雙方均能於營業時間（10:00-18:00）保持聯繫暢通。若因資訊錯誤或無法聯繫造成之損失，由飼主自負全責。</p>
                                            <p><span className="font-bold text-[#736357] dark:text-[#F7E7B5]">3. 健康狀況誠實申報：</span>飼主應詳盡且誠實申報寵物健康狀況及特殊需求（如特殊病史、過敏症狀、近期手術、攻擊性行為等）。因隱瞞或不實陳述造成之損害，飼主須負擔全部責任及賠償。</p>
                                            <p><span className="font-bold text-[#736357] dark:text-[#F7E7B5]">4. 潛在健康風險認知：</span>飼主了解服務期間可能存在潛在健康風險，寵物於服務期間或返家七日內若發生疾病或健康問題，本公司不負相關責任。</p>
                                            <p><span className="font-bold text-[#736357] dark:text-[#F7E7B5]">6. 服務拒絕權利：</span>本工作室保有接受或拒絕提供服務之最終權利，尤其當寵物患有傳染性疾病且未告知、攻擊性嚴重、嚴重分離焦慮或嚴重吠叫者、或需特殊醫療照護未告知時。</p>
                                            <p><span className="font-bold text-[#736357] dark:text-[#F7E7B5]">7. 資料變更通知義務：</span>個人或緊急聯絡人資料變更後三日內，飼主應主動以 LINE 通知本工作室，否則相關損失與責任由飼主自行負擔。</p>
                                        </div>
                                    </div>

                                    <div className="space-y-2">
                                        <h5 className="font-black text-base text-[#736357] dark:text-[#F7E7B5] bg-[#F7E7B5]/20 px-2 py-1 rounded-lg inline-block">二、入住須知與健康規範</h5>
                                        <div className="pl-2 space-y-3">
                                            <p><span className="font-bold text-[#736357] dark:text-[#F7E7B5]">1. 住宿計價與時間：</span>住宿以「晚」計價，入住與退房時間為每日 10:00-18:00。</p>
                                            <p><span className="font-bold text-[#736357] dark:text-[#F7E7B5]">2. 身份建檔：</span>甲方需提供身份證正反面建檔，目的為防止棄養，入住手續約需 10–20 分鐘。</p>
                                            <p><span className="font-bold text-[#736357] dark:text-[#F7E7B5]">3. 營業時間與超時：</span>10:00-18:00 可預約入住或退房，如需提早或延後接送的話，需收費一小時200元作為安親費，最晚不超過7點，超過打烊時間請隔日再預約接送寵物，須自付過夜費用。</p>
                                            <div className="p-3 bg-red-50 dark:bg-red-900/10 rounded-xl border border-red-100 dark:border-red-900/30">
                                                <p className="font-bold text-red-500 mb-1">4. 入住條件與醫療費用：</p>
                                                <p className="text-xs opacity-90">入住請提供有效疫苗接種證明文件。未接種或過期者飼主須自負風險。如發現傳染病、皮膚病或寄生蟲（蚤蟲、壁蝨），本館將立即通知並送醫驅蟲，相關醫療費及交通費由飼主負擔，並請盡速領回，另酌收館内消毒費用 1500 元。貓咪不強迫洗澡。</p>
                                            </div>
                                            <p><span className="font-bold text-[#736357] dark:text-[#F7E7B5]">5. 特殊照護與藥物：</span>如需服藥或特殊照料，請於入住前告知並檢附藥物。褓母會盡量協助，但若犬隻嚴重抗拒或攻擊，請勿隱瞞，以免造成人員受傷。</p>
                                        </div>
                                    </div>

<div className="space-y-2">
                                        <h5 className="font-black text-base text-[#736357] dark:text-[#F7E7B5] bg-[#F7E7B5]/20 px-2 py-1 rounded-lg inline-block">三、住宿與照護安排</h5>
                                        <div className="pl-2 space-y-3">
                                            <p><span className="font-bold text-[#736357] dark:text-[#F7E7B5]">1. 放風與風險：</span>提供獨立房間及戶外草皮（雨天改室內）。飼主同意放風期間可能發生輕微碰撞或爪傷。如不希望參與放風須事先告知。</p>
                                            <p><span className="font-bold text-[#736357] dark:text-[#F7E7B5]">2. 不安排/單獨放風情況：</span>未施打疫苗、疫苗注射 7 日內、超過 8 歲高齡、慢性病、未結紮。</p>
                                            <p><span className="font-bold text-[#736357] dark:text-[#F7E7B5]">3. 特殊收費：</span>特殊飲食照護每日另收 100–500 元。(喂藥50/次、眼藥水50/次、刷牙50/次、其他依狀況報價)。</p>
                                            <p><span className="font-bold text-[#736357] dark:text-[#F7E7B5]">4. 自備物品：</span>需自備熟悉飼料、零食、毛毯。本館可冰存鮮食。食物不足須另外購買將另計收費。</p>
                                            <p><span className="font-bold text-[#736357] dark:text-[#F7E7B5]">5. 禮貌帶：</span>若狗狗有抬腳尿尿情形，將會給予穿戴禮貌帶並收取費用。</p>
                                            <p><span className="font-bold text-[#736357] dark:text-[#F7E7B5]">6. 損壞賠償：</span>若寵物造成設施損壞或他人受傷，甲方應負擔修繕或賠償責任。</p>
                                            <div className="p-3 bg-red-50 dark:bg-red-900/10 rounded-xl border border-red-100 dark:border-red-900/30">
                                                <p className="font-bold text-red-500 mb-1">7. 非24小時照護聲明 (重點)：</p>
                                                <p className="text-xs opacity-90 text-[#736357] dark:text-[#F7E7B5] leading-relaxed">本人（飼主）已知悉且同意，汪汪犬旅無提供夜間照顧服務。活動時間結束後至隔日開店前，寵物將獨處於房間內。若寵物於夜間無人時段發生突發狀況（如急病、休克、自身焦慮造成之傷害、嘔吐等），店家可能無法即時發現或處置，本人願意承擔此風險，並同意不追究店家責任。</p>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="space-y-2">
                                        <h5 className="font-black text-base text-[#736357] dark:text-[#F7E7B5] bg-[#F7E7B5]/20 px-2 py-1 rounded-lg inline-block">四、緊急狀況與送醫處理</h5>
                                        <div className="pl-2 space-y-3">
                                            <p>1. 若毛孩突發不適，將即時聯絡甲方，必要時送醫，費用由甲方負擔。</p>
                                            <p>2. 合作獸醫院：<span className="font-bold">耐旺福動物醫院</span>（台中市北屯區松竹路二段383之5號）。急診：<span className="font-bold">康德動物醫院</span>。送醫代辦費每次 500 元（不含車資診療費）。</p>
                                            <p>3. 送醫過程依實際情況判斷是否更換醫院，甲方不得指定。</p>
                                            <p>4. 若因隱瞞病況發生意外，店家不負賠償責任。</p>
                                        </div>
                                    </div>

                                    <div className="space-y-2">
                                        <h5 className="font-black text-base text-[#736357] dark:text-[#F7E7B5] bg-[#F7E7B5]/20 px-2 py-1 rounded-lg inline-block">五、預約與取消條款</h5>
                                        <ul className="pl-2 space-y-1 list-disc list-inside marker:text-[#F7E7B5]">
                                            <li>訂房須於三日內匯款。提前退宿不退費。</li>
                                            <li>15 天前取消：全額退</li>
                                            <li>7–14天前：退 50%</li>
                                            <li>少於 7 天：不退定金</li>
                                            <li>提前退房：不退款</li>
                                            <li>春節另訂規定</li>
                                            <li>天災可保留定金乙次（一年內有效）</li>
                                            <li>非指定銀行退款將扣除手續費</li>
                                        </ul>
                                    </div>

                                    <div className="space-y-2">
                                        <h5 className="font-black text-base text-[#736357] dark:text-[#F7E7B5] bg-[#F7E7B5]/20 px-2 py-1 rounded-lg inline-block">六、其他條款</h5>
                                        <div className="pl-2 space-y-3">
                                            <p><span className="font-bold text-[#736357] dark:text-[#F7E7B5]">1. 惡意棄養：</span>超過 48 小時未帶回且失聯，視為惡意棄養，將交由動保機構處理並追償費用。</p>
                                            <p><span className="font-bold text-[#736357] dark:text-[#F7E7B5]">2. 責任判定：</span>意外事故可委託合格動物醫院診斷，費用由提出方支付。</p>
                                            <p><span className="font-bold text-[#736357] dark:text-[#F7E7B5]">3. 賠償上限：</span>若因本工作室重大過失致寵物傷亡，醫療補償上限 2,000 元，慰撫金上限 5,000 元。超過部分不另負擔。</p>
                                        </div>
                                    </div>

                                    <div className="space-y-2">
                                        <h5 className="font-black text-base text-[#736357] dark:text-[#F7E7B5] bg-[#F7E7B5]/20 px-2 py-1 rounded-lg inline-block">七、個人資料保護政策</h5>
                                        <p className="pl-2">飼主同意提供之個資用於服務、緊急聯繫及行銷推廣。本工作室將妥善保存，未經同意不轉售第三方。</p>
                                    </div>

                                    <div className="space-y-2">
                                        <h5 className="font-black text-base text-[#736357] dark:text-[#F7E7B5] bg-[#F7E7B5]/20 px-2 py-1 rounded-lg inline-block">八、法律條款與爭議處理</h5>
                                        <div className="pl-2 space-y-3">
                                            <p><span className="font-bold text-[#736357] dark:text-[#F7E7B5]">1. 爭議申訴：</span>需於退宿後七日內書面通知。以獸醫診斷為準。</p>
                                            <p><span className="font-bold text-[#736357] dark:text-[#F7E7B5]">2. 禁止不實言論：</span>不得發布未經查證之負面評論或騷擾，違者須賠償損失。</p>
                                            <p><span className="font-bold text-[#736357] dark:text-[#F7E7B5]">3. 永久效力：</span>本同意書簽署一次即具永久效力。</p>
                                        </div>
                                    </div>

                                    <div className="space-y-2">
                                        <h5 className="font-black text-base text-[#736357] dark:text-[#F7E7B5] bg-[#F7E7B5]/20 px-2 py-1 rounded-lg inline-block">九、本同意書之修改</h5>
                                        <p className="pl-2">本工作室保有修改權利，將於官方 LINE 公告，不另行通知。繼續使用服務視為同意新條款。</p>
                                    </div>
                                    
                                    <div className="space-y-2 pb-4">
                                        <h5 className="font-black text-base text-[#736357] dark:text-[#F7E7B5] bg-[#F7E7B5]/20 px-2 py-1 rounded-lg inline-block">十、智慧財產權聲明</h5>
                                        <div className="pl-2 space-y-3">
                                            <p><span className="font-bold text-[#736357] dark:text-[#F7E7B5]">1. 影像使用授權：</span>本工作室於服務期間將拍攝寵物之照片或錄影影片，飼主同意本工作室得將前述影像及影片無償使用於公司官方網站、社群媒體，以及其他行銷宣傳或推廣用途。飼主同意不就前述使用向本工作室請求任何費用或報酬；若不同意將前述影像及影片使用於工作室官方網站、社群媒體，以及其他行銷宣傳或推廣用途，則不會將寵物之照片、影片上傳至網站。</p>
                                            <p><span className="font-bold text-[#736357] dark:text-[#F7E7B5]">2. 智慧財產權歸屬：</span>前述影像或影片之智慧財產權歸本公司所有，未經本工作室授權，飼主不得擅自使用、複製或授權第三方使用。</p>
                                        </div>
                                    </div>
                                </div>
                            </TermsModal>

{/* 2. 美容條款內容 */}
                            <TermsModal 
                                isOpen={activeModal === 'grooming'} 
                                onClose={() => setActiveModal(null)} 
                                title="美容服務契約條款"
                                onAgree={() => handleTermAgree('grooming')}
                            >
                                 <div className="space-y-4">
                                     <p className="text-xs font-bold text-red-500 mb-4">為保障寵物安全及服務品質，飼主預約本工作室任一服務前，請詳閱以下條款內容。當您預約，即視為已充分了解並同意遵守以下所有規定：</p>
                                     <div className="space-y-2">
                                        <h5 className="font-black text-base text-[#736357] dark:text-[#F7E7B5] bg-[#F7E7B5]/20 px-2 py-1 rounded-lg inline-block">一、共通條款</h5>
                                        <div className="pl-2 space-y-3">
                                            <p><span className="font-bold">1. 服務公約與付款：</span>飼主已詳閱並充分瞭解本工作室美容之公約、計費方式及相關規則，並同意遵守與如實付款。</p>
                                            <p><span className="font-bold">2. 聯絡資料正確性：</span>本契約應記載之寵物、甲方及乙方之基本資料，詳如本契約附件之「犬、貓美容服務簽約前詢問事項及基本資料表」。所有附件及線上表單填寫內容均視為本契約之一部分。</p>
                                            <p><span className="font-bold">3. 健康狀況誠實申報：</span>飼主應詳盡且誠實申報寵物健康狀況及特殊需求(如特殊病史、過敏症狀、近期手術、攻擊性行為等)。因隱瞞或不實陳述造成之損害,飼主須負擔全部責任及賠償。即使飼主已誠實揭露犬/貓狀況,美容服務期間仍可能因犬/貓個體差異、體質或既有疾病,引發不可預測之反應或急性症狀(例如:突發性過敏、氣喘、癲癇、心臟病發作、虛脫、情緒失控等),如該形非可歸責於店家操作或人員疏失所致,本店不負任何賠償責任,相關醫療費用由飼主負擔。</p>
                                            <p><span className="font-bold">4. 潛在健康風險認知：</span>飼主了解服務期間可能存在潛在健康風險，寵物於服務期間或返家七日內若發生疾病或健康問題，本工作室不負相關責任。</p>
                                            <p><span className="font-bold">5. 服務拒絕權利：</span>本工作室保有接受或拒絕提供服務之最終權利，尤其當寵物患有傳染性疾病且未告知、攻擊性嚴重或需特殊醫療照護未告知時。</p>
                                            <p><span className="font-bold">6. 資料變更通知義務：</span>個人或緊急聯絡人資料變更後三日內，飼主應主動以 LINE 通知本工作室，否則相關損失與責任由飼主自行負擔。</p>
                                        </div>
                                    </div>

                                    <div className="space-y-2">
                                        <h5 className="font-black text-base text-[#736357] dark:text-[#F7E7B5] bg-[#F7E7B5]/20 px-2 py-1 rounded-lg inline-block">二、服務項目與收費</h5>
                                        <div className="pl-2 space-y-3">
                                            <p>收費以毛孩體重、體型、毛量、毛質為評估標準，現場報價為準。</p>
                                            <div className="bg-red-50 dark:bg-red-900/10 p-3 rounded-xl border border-red-100 dark:border-red-900/30">
                                                <p className="font-bold text-red-500 mb-1">特殊費用說明：</p>
                                                <ul className="list-disc list-inside text-xs space-y-1">
                                                    <li>發現跳蚤/壁蝨：環境清潔費 1000元 + 升級除蚤洗劑(200起)。</li>
                                                    <li>打結/廢毛：拆結費 200元起、廢毛處理費 100元起。</li>
                                                    <li>情緒管理費：300–500元 (需額外協助安撫)。</li>
                                                </ul>
                                            </div>
                                            <p><span className="font-bold">服務異議：</span>美容服務完成後恕不接受異議、退款或補償。費用於施作前估價，並於當日支付。</p>
                                            <p><span className="font-bold">攻擊行為：</span>若過程中情緒過於緊張或有攻擊行為，將立即終止服務，不予收費。</p>
                                            <p><span className="font-bold">逾時收費：</span>美容完成後應於一小時內接回，逾時依安親費收費 (未滿一小時以一小時計)：</p>
                                            <ul className="list-disc list-inside pl-4 text-xs opacity-80">
                                                <li>狗狗：100元／時</li>
                                                <li>貓咪：100元／時</li>
                                            </ul>
                                            <p><span className="font-bold">營業時間結束後：</span>若未接回且無法聯繫，將提供必要照護，飼主領回時須負擔安置費用。</p>
                                            <p><span className="font-bold">逾三日未接回：</span>依《動物保護法》通報主管機關處理。</p>
                                            
                                            <div className="mt-4 p-4 border-2 border-dashed border-[#736357]/30 rounded-xl bg-[#F7E7B5]/10">
                                                <h6 className="font-black text-[#736357] dark:text-[#F7E7B5] mb-2">【五次美容連續回訪優惠方案】</h6>
                                                <ul className="list-decimal list-inside space-y-1 text-xs">
                                                    <li>此為條件式優惠，非包月/儲值/套票。</li>
                                                    <li>須自首次服務起 40日內完成第 1-4 次美容。</li>
                                                    <li>第 4 次後 15 日內回店使用第 5 次美容，方可享 SPA 抵用卷優惠。</li>
                                                    <li>僅第 5 次美容可折抵，前 4 次依原價計費。</li>
                                                    <li>若逾期未完成，視為不符條件，第 5 次依原價計費。</li>
                                                    <li>限同一毛孩使用，不得轉讓、延期。</li>
                                                </ul>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="space-y-2">
                                        <h5 className="font-black text-base text-[#736357] dark:text-[#F7E7B5] bg-[#F7E7B5]/20 px-2 py-1 rounded-lg inline-block">三、健康與接待規定</h5>
                                        <div className="pl-2 space-y-3">
                                            <p className="font-bold text-red-500">❌ 恕不接待：</p>
                                            <ul className="list-disc list-inside text-xs space-y-1 pl-2">
                                                <li>未滿3個月、未打完三劑疫苗幼犬貓、接種疫苗一周內。</li>
                                                <li>身上有活體寄生蟲。</li>
                                                <li>心臟病、癲癇、傳染性疾病(貓瘟/愛滋/白血/黴菌等)、呼吸道疾病、腎臟病等。</li>
                                            </ul>
                                            <p>美容當天若發現寄生蟲或傳染風險(打噴嚏/黴菌)，將退回並收取環境清潔費 1000元。</p>
                                            <p>若故意隱瞞攻擊行為導致人員受傷，須負責醫療費用。</p>
                                        </div>
                                    </div>

                                    <div className="space-y-2">
                                        <h5 className="font-black text-base text-[#736357] dark:text-[#F7E7B5] bg-[#F7E7B5]/20 px-2 py-1 rounded-lg inline-block">四、其他條款</h5>
                                        <div className="pl-2 space-y-3">
                                            <p><span className="font-bold">1. 輕微剃傷：</span>因不可抗力或毛孩不配合導致小於1公分淺表傷口，工作室將通知並消毒。飼主需於24小時內確認，逾期視同接受。若為操作疏失最高賠償 2000 元。</p>
                                            <p><span className="font-bold">2. 緊急醫療：</span>突發緊急狀況(休克/急病)且無法聯繫飼主時，將立即送醫。費用由甲方承擔。若因隱瞞病況發生意外，店家不負賠償責任。</p>
                                            <p><span className="font-bold">3. 非醫療機構：</span>本工作室不提供醫療診斷或投藥服務。</p>
                                        </div>
                                    </div>

                                    <div className="space-y-2">
                                        <h5 className="font-black text-base text-[#736357] dark:text-[#F7E7B5] bg-[#F7E7B5]/20 px-2 py-1 rounded-lg inline-block">五、個人資料保護政策</h5>
                                        <p className="pl-2">飼主個資將用於美容服務、緊急聯繫及行銷推廣。未經同意不會轉售第三方。</p>
                                    </div>

                                    <div className="space-y-2">
                                        <h5 className="font-black text-base text-[#736357] dark:text-[#F7E7B5] bg-[#F7E7B5]/20 px-2 py-1 rounded-lg inline-block">六、智慧財產權聲明</h5>
                                        <p className="pl-2">同意本工作室拍攝照片/影片並無償使用於官網及行銷用途。若不同意請告知，則不會上傳。</p>
                                    </div>

                                    <div className="space-y-2">
                                        <h5 className="font-black text-base text-[#736357] dark:text-[#F7E7B5] bg-[#F7E7B5]/20 px-2 py-1 rounded-lg inline-block">七、法律條款與爭議處理</h5>
                                        <div className="pl-2 space-y-3">
                                            <p><span className="font-bold">1. 爭議申訴：</span>需於服務完成後七日內提出。可共同委託獸醫診斷，費用由提出方負擔。</p>
                                            <p><span className="font-bold">2. 禁止不實言論：</span>不得發布未經查證之負面評論，違者須賠償損失。</p>
                                            <p><span className="font-bold">3. 管轄法院：</span>雙方同意以臺灣台中地方法院為第一審管轄法院。</p>
                                            <p><span className="font-bold">4. 監視器畫面：</span>爭議發生後三日內可書面要求調閱。首次免費，額外拷貝收費 200 元。</p>
                                        </div>
                                    </div>

                                    <div className="space-y-2 pb-4">
                                        <h5 className="font-black text-base text-[#736357] dark:text-[#F7E7B5] bg-[#F7E7B5]/20 px-2 py-1 rounded-lg inline-block">八、本同意書之修改</h5>
                                        <p className="pl-2">修改內容將於官方 LINE 公告，繼續使用服務視為同意。</p>
                                    </div>
                                </div>
                            </TermsModal>

{/* 3. 高風險美容 風險告知內容 */}
                            <TermsModal 
                                isOpen={activeModal === 'senior'} 
                                onClose={() => setActiveModal(null)} 
                                title="高風險寵物美容服務風險告知"
                                onAgree={() => handleTermAgree('senior')}
                            >

                                <div className="space-y-4">
                                    <h4 className="font-bold text-center text-lg mb-4 border-b pb-2 border-slate-100 dark:border-gray-700">【高風險寵物美容服務風險告知暨同意聲明】</h4>
                                    
                                    <div className="space-y-2">
                                        <p className="font-bold text-[#736357] dark:text-[#F7E7B5]">一、飼主誠實告知義務</p>
                                        <p className="text-xs opacity-80">本人（甲方）確認，已就本人所知悉之寵物年齡、過往病史（如心臟病、癲癇、氣喘、關節問題等）、近期手術或治療紀錄、懷孕狀況、過敏反應，以及行為特性（如咬人紀錄、特定部位敏感、抗拒保定等），向 貴店（乙方）為完整且真實之說明。</p>
                                        <p className="text-xs opacity-80">如因甲方未告知、未完全告知或提供不實資訊，致乙方於已盡合理專業注意義務之情形下，仍難以預見或防範風險發生者，其相關責任歸屬，雙方同意依實際情形及相關法律規定另行認定。</p>
                                    </div>

                                    <div className="space-y-2">
                                        <p className="font-bold text-[#736357] dark:text-[#F7E7B5]">二、高齡與特殊健康狀況之風險告知</p>
                                        <p className="text-xs opacity-80">本人知悉，若寵物屬於高齡個體、幼齡犬貓，或患有慢性疾病、潛在或隱性疾病者，其體能、心肺功能及對壓力之耐受度，可能低於一般健康寵物。</p>
                                        <p className="text-xs opacity-80">於美容過程中之洗澡、吹整、保定或操作，可能因緊張、興奮或身體負荷，誘發身體不適、休克、舊疾復發，甚或發生其他不可預期之風險。</p>
                                        <p className="text-xs opacity-80">本人已充分理解上述情形，並同意：如經判定該不利結果係源於寵物自身健康狀況或生理反應，且非因乙方之故意或重大過失所致者，乙方不負損害賠償責任。</p>
                                    </div>

                                    <div className="space-y-2">
                                        <p className="font-bold text-[#736357] dark:text-[#F7E7B5]">三、攻擊性與行為安全防護同意</p>
                                        <p className="text-xs opacity-80">如寵物於服務過程中出現高度緊張、攻擊行為、過度躁動或其他影響人員及寵物安全之情形，本人同意並授權乙方，基於安全考量，採取必要之防護與保定措施（包含但不限於牽繩保定、伊莉莎白頸圈、嘴套或雙人協同作業）。</p>
                                        <p className="text-xs opacity-80">若經專業判斷認為繼續服務恐危及寵物或人員安全，乙方得隨時中止服務，並依已完成之服務內容與進度計收費用。</p>
                                    </div>

                                    <div className="space-y-2">
                                        <p className="font-bold text-[#736357] dark:text-[#F7E7B5]">四、緊急醫療處置同意</p>
                                        <p className="text-xs opacity-80">服務期間如寵物發生身體不適或緊急狀況，本人同意乙方得優先將寵物送往本人指定或就近之合適動物醫院進行緊急處置，相關醫療及必要交通費用，由本人依法負擔。</p>
                                    </div>

                                    <div className="space-y-2">
                                        <p className="font-bold text-[#736357] dark:text-[#F7E7B5]">五、飼主確認</p>
                                        <p className="text-xs opacity-80">本人已詳閱並充分理解上述所有內容，確認已就相關風險獲得說明，並於審慎評估後，同意將寵物交付乙方進行美容服務。</p>
                                    </div>
                                </div>
                            </TermsModal>

{/* 4. 高風險住宿 風險告知內容 */}
                            <TermsModal 
                                isOpen={activeModal === 'boardingRisk'} 
                                onClose={() => setActiveModal(null)} 
                                title="高風險寵物住宿服務風險告知"
                                onAgree={() => handleTermAgree('boardingRisk')}
                            >
                                 <div className="space-y-4">
                                     <h4 className="font-bold text-center text-lg mb-4 border-b pb-2 border-red-500">【高風險寵物住宿服務風險告知暨同意聲明】</h4>
                                     <div className="space-y-3 text-xs leading-relaxed">
                                         <p>美容洗澡或住宿期間，因基因或本身遺傳問題,造成的疾病或寵物因天生病史，高齡幼犬猫，因寵物持有人遺漏、隱瞞，或已知風險、仍然堅持美容或住宿，途中若有意外休克或其他等狀況，本店會立即送至附近動物醫院救治。</p>
                                         <p>寵物若因以上因素導致疾病或死亡等問題發生，都將與汪汪犬旅寵物旅館無關，送醫途中或到院治療,所產生之相關費用都需由寵物持有人負擔。</p>
                                         <p>寵物持有人已知本店無24小時之服務，因此住宿期間若於晚上無人照護時，發生問題導致無即使救治，或因住宿或美容期間寵物本身焦慮，情緒不穩造成自己有傷害發生，都將與汪汪犬旅寵物旅館無關</p>
                                         <p>倘若發生法律上之糾紛，訴訟等相關問題，本切結書會以證據之證明呈上相關法律部門。</p>
                                     </div>
                                 </div>
                            </TermsModal>

                            {/* 提交按鈕 */}
                            <div className="pt-8 pb-16">
<button type="button" onClick={handleSubmit} disabled={isSubmitting}
    className="w-full py-6 bg-gradient-to-r from-[#736357] to-[#5D4D41] text-white rounded-[2rem] font-black text-xl shadow-2xl shadow-[#736357]/30 hover:shadow-[#736357]/50 hover:scale-[1.02] active:scale-[0.98] transition-all disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-3">
    {isSubmitting ? (
        <>
            <Icon name="loader-2" size={24} className="animate-spin"/>
            <span>提交中...</span>
        </>
    ) : (
        <>
            <Icon name="send" size={24}/>
            <span>確認並提交數位契約</span>
        </>
    )}
</button>

                            </div>
                        </div>
                    </main>

                    {/* 全螢幕簽名板 */}
                    {showFullSig && (
                        <div className="fullscreen-signature bg-white dark:bg-gray-900 flex flex-col">
                            <div className="flex items-center justify-between p-4 bg-[#736357] text-white">
                                <h3 className="font-bold text-base md:text-lg flex items-center gap-2">
                                    <Icon name="pen-tool" size={20}/> 請在下方簽名(建議您保持手機直立簽名即可，不需旋轉手機)
                                </h3>
<button type="button" onClick={() => setShowFullSig(false)} className="p-2 hover:bg-white/20 rounded-full transition-colors flex-shrink-0">
    <Icon name="x" size={24}/>
</button>
                            </div>
                            
                            {/* 按鈕移到畫布上方 - 避免手機底部按鈕被遮擋 */}
                            <div className="p-4 bg-white dark:bg-gray-900 border-b border-slate-200 dark:border-gray-700 flex gap-3">
<button type="button" 
    onClick={() => {
        if (padInstance.current) {
            padInstance.current.clear();
            const canvas = fullSigCanvasRef.current;
            if (canvas) {
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = "rgb(255,255,255)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
        }
    }}
    className="flex-1 py-4 bg-slate-100 dark:bg-gray-700 text-[#736357] dark:text-[#F7E7B5] rounded-xl font-bold flex items-center justify-center gap-2 hover:bg-slate-200 dark:hover:bg-gray-600 transition-colors">
    <Icon name="eraser" size={20}/> 清除重簽
</button>


<button type="button" 
    onClick={() => {
        if (padInstance.current && !padInstance.current.isEmpty()) {
            const dataUrl = padInstance.current.toDataURL('image/jpeg', 0.8);
            setRealtimeSig(dataUrl);
            if(errors.signature) setErrors(prev=>({...prev, signature:null}));
            setShowFullSig(false);
            showToast("✅ 簽名已儲存", "success");
            // 滾動回頁面底部（簽名區塊）
            setTimeout(() => {
                const signatureEl = document.getElementById('signature');
                if (signatureEl) signatureEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 100);
        } else {
            showToast("⚠️ 請先完成簽名");
        }
    }}
    className="flex-[2] py-4 bg-[#736357] text-white rounded-xl font-bold flex items-center justify-center gap-2 hover:bg-[#5D4D41] transition-colors shadow-lg">
    <Icon name="check" size={20}/> 確認簽名
</button>

                            </div>
                            
                            <div className="flex-1 p-4 bg-slate-100 dark:bg-gray-800">
                                <div className="canvas-container w-full h-full bg-white dark:bg-gray-700 rounded-2xl shadow-inner border-2 border-[#736357]/20 dark:border-gray-600">
                                    <canvas ref={fullSigCanvasRef} className="w-full h-full"></canvas>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
    </body>
</html>

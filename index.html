<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>汪汪犬旅 | 數位契約填寫系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Noto+Sans+TC:wght@300;500;700&display=swap');
        
        :root { 
            --brand-yellow: #F7E7B5; 
            --brand-brown: #736357; 
            --brand-dark-brown: #5D4D41;
            --brand-light: #fbf9f6; 
            --line-green: #06C755; 
            --error-red: #ef4444;
            --info-blue: #3b82f6;
        }

        body { 
            font-family: 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif; 
            background-color: var(--brand-light);
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
            color: var(--brand-brown); 
            -webkit-font-smoothing: antialiased; 
            -webkit-tap-highlight-color: transparent; 
            overscroll-behavior-y: none;
        }

        .glass-card { 
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6); 
            border-bottom: 0;
            box-shadow: 
                0 4px 6px -1px rgba(115, 99, 87, 0.05), 
                0 10px 15px -3px rgba(115, 99, 87, 0.05),
                inset 0 0 0 1px rgba(255,255,255,0.5); 
            border-radius: 2rem; 
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
        }

        .section-highlight { border-bottom: 3px solid var(--brand-yellow); }

        .cute-input { 
            background: #ffffff; 
            border: 2px solid #eeebe6; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            color: var(--brand-dark-brown);
        }

        .cute-input:focus { 
            background: #ffffff; 
            border-color: var(--brand-brown); 
            box-shadow: 0 0 0 4px rgba(115, 99, 87, 0.1); 
            outline: none; 
            transform: translateY(-1px);
        }

        /* 藍色系輸入框樣式 */
        .cute-input-blue {
            background: #ffffff;
            border: 2px solid #eff6ff; /* blue-50 */
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            color: var(--brand-dark-brown);
        }
        .cute-input-blue:focus {
            border-color: var(--info-blue);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
            outline: none;
            transform: translateY(-1px);
        }

        .cute-input::placeholder { color: #d1ccc5; }

        .canvas-container { 
            position: relative; 
            border-radius: 1.5rem; 
            overflow: hidden; 
            background: #fff; 
            touch-action: none; 
            user-select: none;
            -webkit-user-select: none; 
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.05);
        }

        .canvas-container, 
        .canvas-container canvas {
            touch-action: none;
            display: block;
            
            /* 1. 禁止 iOS 長按跳出選單 (容器跟畫布都要禁) */
            -webkit-touch-callout: none;
            
            /* 2. 禁止選取 */
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            
            /* 3. 禁止拖曳 */
            -webkit-user-drag: none;
        }

        /* 額外建議：確保畫布填滿容器，不留空隙 */
        .canvas-container canvas {
            width: 100%;
            height: 100%;
        }

        /* 簽名模式下禁止頁面滾動 */
        body.signing-mode {
            overflow: hidden !important;
            position: fixed !important;
            width: 100% !important;
            height: 100% !important;
            touch-action: none !important;
        }

        /* 全螢幕簽名板樣式優化 */
        .fullscreen-signature {
            position: fixed;
            inset: 0;
            z-index: 100;
            touch-action: none;
            -webkit-overflow-scrolling: none;
            overscroll-behavior: none;
        }

        @keyframes pulse-soft { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.02); } }
        .line-btn-animated { background-color: var(--line-green); animation: pulse-soft 2.5s infinite ease-in-out; }

        .fade-enter { opacity: 0; transform: translateY(10px); }
        .fade-enter-active { opacity: 1; transform: translateY(0); transition: all 0.5s cubic-bezier(0.2, 0.8, 0.2, 1); }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }
        
        .shake-error {
            animation: shake 0.4s ease-in-out;
            border-color: var(--error-red) !important;
            background-color: #fff8f8 !important;
            box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.15) !important;
        }

        .group-error {
            padding: 8px;
            margin: -4px;
            border-radius: 1.2rem;
            border: 2px dashed var(--error-red);
            background-color: #fff8f8;
            animation: shake 0.4s ease-in-out;
        }

        .pill-button {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .pill-button:active {
            transform: scale(0.96);
        }

        @keyframes slide-down {
            from { transform: translate(-50%, -100%); opacity: 0; }
            to { transform: translate(-50%, 24px); opacity: 1; }
        }
        .toast-enter { animation: slide-down 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        const SUPABASE_URL = 'https://fpkzuotxxbsqisgwupix.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_VsAJfSi7Fb3zu_A5Ksm2wA_mAUkDLBs'; 
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const dataURLtoBlob = (dataurl) => {
            let arr = dataurl.split(','), mime = arr[0].match(/:(.*?);/)[1],
                bstr = atob(arr[1]), n = bstr.length, u8arr = new Uint8Array(n);
            while(n--){
                u8arr[n] = bstr.charCodeAt(n);
            }
            return new Blob([u8arr], {type:mime});
        }

        const Icon = ({ name, size = 20, className = "" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (window.lucide && iconRef.current) {
                    window.lucide.createIcons({ root: iconRef.current, attrs: { "stroke-width": 2.5, class: className } });
                }
            }, [name, className]);
            return <span ref={iconRef} key={name} className="inline-flex items-center justify-center"><i data-lucide={name} style={{ width: size, height: size }}></i></span>;
        };

        const Toast = ({ message, type = 'error', onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, [onClose]);
            const bgColor = type === 'error' ? 'bg-[#ef4444] shadow-red-200' : 'bg-[#06C755] shadow-green-200';
            const iconName = type === 'error' ? 'alert-circle' : 'check-circle';
            return (
                <div className={`fixed top-0 left-1/2 z-[200] flex items-center gap-3 px-6 py-4 rounded-full shadow-xl text-white font-bold text-sm tracking-wide toast-enter ${bgColor} backdrop-blur-md`}>
                    <Icon name={iconName} size={20} className="text-white" />
                    <span>{message}</span>
                </div>
            );
        };

        // --- 舊客資料選擇 Modal ---
        const HistoryModal = ({ records, onClose, onSelect }) => {
            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-[#5D4D41]/40 backdrop-blur-sm animate-in fade-in duration-300">
                    <div className="w-full max-w-md bg-white rounded-3xl overflow-hidden shadow-2xl relative max-h-[80vh] flex flex-col">
                        <div className="bg-[#736357] p-6 text-white text-center">
                            <h3 className="text-xl font-bold">🎉 歡迎回來！</h3>
                            <p className="text-sm opacity-80 mt-1">我們找到了以下寶貝的紀錄，請選擇要帶入的資料：</p>
                        </div>
                        <div className="p-6 space-y-3 overflow-y-auto bg-[#fbf9f6]">
                            {records.map((record, index) => (
                                <button key={index} onClick={() => onSelect(record)} 
                                    className="w-full bg-white p-4 rounded-2xl border border-slate-100 shadow-sm hover:border-[#F7E7B5] hover:shadow-md transition-all text-left flex items-center gap-4 group">
                                    <div className="w-12 h-12 rounded-full bg-[#F7E7B5]/20 flex items-center justify-center text-[#736357] font-bold text-lg group-hover:bg-[#F7E7B5] transition-colors">
                                        {record.raw_data.pet_name.charAt(0)}
                                    </div>
                                    <div>
                                        <div className="font-bold text-[#736357] text-lg">{record.raw_data.pet_name}</div>
                                        <div className="text-xs text-slate-400">上次服務：{record.raw_data.service_type || '無紀錄'}</div>
                                    </div>
                                    <div className="ml-auto text-[#736357] opacity-0 group-hover:opacity-100 transition-opacity">
                                        <Icon name="arrow-right" size={20} />
                                    </div>
                                </button>
                            ))}
                        </div>
                        <div className="p-4 bg-white border-t border-slate-100">
                            <button onClick={onClose} className="w-full py-3 rounded-xl text-slate-400 font-bold text-sm hover:bg-slate-50 transition-colors">
                                不使用舊資料，填寫新表單
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const SuccessReceipt = ({ data, signature, onClose }) => {
            const isBoarding = !!data.checkin_date;
            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-[#5D4D41]/40 backdrop-blur-sm animate-in fade-in duration-300">
                    <div className="w-full max-w-md bg-white rounded-3xl overflow-hidden shadow-2xl relative max-h-[90vh] overflow-y-auto transform transition-all scale-100">
                        <div className="bg-[#736357] p-8 pb-10 text-center relative overflow-hidden flex flex-col justify-center min-h-[140px]">
                            <div className="absolute top-0 left-0 w-full h-full opacity-10 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]"></div>
                            <div className="absolute -top-10 -right-10 w-32 h-32 bg-[#F7E7B5] rounded-full opacity-20 blur-2xl"></div>
                            <div className="absolute -bottom-10 -left-10 w-32 h-32 bg-[#F7E7B5] rounded-full opacity-20 blur-2xl"></div>
                            <div className="relative z-10 space-y-2">
                                <h2 className="text-3xl font-black text-white tracking-wide">預約暨簽署成功</h2>
                                <div className="inline-flex items-center gap-1.5 bg-black/10 px-3 py-1 rounded-lg backdrop-blur-sm">
                                    <Icon name="mail" size={12} className="text-[#F7E7B5]"/>
                                    <p className="text-[#F7E7B5] text-xs font-bold tracking-wider">
                                        副本已寄至 {data.email}
                                    </p>
                                </div>
                            </div>
                        </div>
                        <div className="relative h-6 bg-[#fcfbf9] -mt-1">
                            <div className="absolute -top-3 w-full h-6 bg-[#fcfbf9]" style={{
                                maskImage: 'radial-gradient(circle at 10px bottom, transparent 8px, black 8.5px)',
                                maskSize: '20px 100%',
                                maskPosition: 'center bottom',
                                WebkitMaskImage: 'radial-gradient(circle at 10px bottom, transparent 8px, black 8.5px)',
                                WebkitMaskSize: '20px 100%',
                                WebkitMaskPosition: 'center bottom'
                            }}></div>
                        </div>
                        <div className="px-8 pb-8 pt-2 bg-[#fcfbf9] space-y-6">
                            <div className="flex gap-4 p-5 bg-white rounded-2xl border border-slate-100 shadow-[0_4px_20px_-10px_rgba(0,0,0,0.05)]">
                                <div className="flex-1 space-y-1">
                                    <span className="text-[10px] text-slate-400 font-bold uppercase tracking-wider">飼主</span>
                                    <div className="font-black text-[#736357] text-lg leading-tight">{data.owner_name}</div>
                                    <div className="text-xs text-slate-400 font-medium">{data.phone}</div>
                                </div>
                                <div className="w-[1px] bg-slate-100 my-1"></div>
                                <div className="flex-1 space-y-1 text-right">
                                    <span className="text-[10px] text-slate-400 font-bold uppercase tracking-wider">寵物</span>
                                    <div className="font-black text-[#736357] text-lg leading-tight">{data.pet_name}</div>
                                    <div className="text-xs text-slate-400 font-medium">{data.breed} ({data.sex})</div>
                                </div>
                            </div>
                            <div className="space-y-4">
                                <div className="flex items-center gap-3">
                                    <div className={`p-2.5 rounded-xl shadow-sm ${isBoarding ? 'bg-orange-50 text-orange-600' : 'bg-blue-50 text-blue-600'}`}>
                                        <Icon name={isBoarding ? "home" : "scissors"} size={22} />
                                    </div>
                                    <div>
                                        <div className="text-[10px] text-slate-400 font-bold uppercase">服務項目</div>
                                        <div className="font-bold text-[#736357] text-lg">{isBoarding ? '住宿 ＋ 美容' : data.service_type}</div>
                                    </div>
                                </div>
                                {isBoarding ? (
                                    <div className="flex items-center justify-between bg-white p-4 rounded-2xl border border-dashed border-slate-200">
                                        <div className="text-center">
                                            <div className="text-[10px] text-slate-400 mb-1 font-bold">入住 Check-in</div>
                                            <div className="font-black text-[#736357] text-sm">{data.checkin_date}</div>
                                        </div>
                                        <div className="flex-1 h-[2px] bg-slate-100 mx-3 relative rounded-full">
                                            <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-slate-300 bg-white p-1 rounded-full border border-slate-100">
                                                <Icon name="arrow-right" size={12} />
                                            </div>
                                        </div>
                                        <div className="text-center">
                                            <div className="text-[10px] text-slate-400 mb-1 font-bold">退房 Check-out</div>
                                            <div className="font-black text-[#736357] text-sm">{data.checkout_date}</div>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="flex items-center gap-3">
                                        <div className="p-2.5 rounded-xl shadow-sm bg-purple-50 text-purple-600">
                                            <Icon name="clock" size={22} />
                                        </div>
                                        <div>
                                            <div className="text-[10px] text-slate-400 font-bold uppercase">預計接回時間</div>
                                            <div className="font-bold text-[#736357] text-lg">
                                                {data.pickup_time ? data.pickup_time : <span className="text-slate-400 italic font-normal text-sm">另行通知</span>}
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                            <div className="border-t-2 border-dashed border-slate-200 pt-6 flex flex-col gap-5">
                                <div className="flex justify-between items-end">
                                    <div className="text-right w-full">
                                        <div className="text-[10px] text-slate-400 font-bold uppercase mb-1 tracking-widest">預估金額</div>
                                        <div className="text-4xl font-black text-[#736357] leading-none tracking-tight">
                                            <span className="text-sm align-top mr-1 font-bold opacity-60">NT$</span>
                                            {data.service_price || 0}
                                        </div>
                                    </div>
                                </div>
                                <div className="space-y-2">
                                    <div className="text-[10px] text-slate-400 font-bold uppercase tracking-wider text-center">電子簽署憑證</div>
                                    <div className="p-6 bg-white border border-slate-100 rounded-2xl flex justify-center shadow-sm relative overflow-hidden">
                                        <div className="absolute inset-0 opacity-[0.03] bg-[url('https://www.transparenttextures.com/patterns/cream-paper.png')]"></div>
                                        <img src={signature} alt="Signature" className="h-24 object-contain relative z-10" />
                                    </div>
                                </div>
                            </div>
                            <div className="pt-2">
                                <button onClick={onClose} className="w-full py-4 bg-[#736357] text-white rounded-2xl font-bold shadow-lg hover:bg-[#5e5046] active:scale-[0.98] transition-all flex items-center justify-center gap-2 group">
                                    <div className="bg-white/20 p-1 rounded-full group-hover:rotate-90 transition-transform">
                                        <Icon name="x" size={16} /> 
                                    </div>
                                    關閉並重新整理
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            )
        }

        const App = () => {
            const [view, setView] = useState('entry'); 
            const [isBoarding, setIsBoarding] = useState(false);
            const [showFullSig, setShowFullSig] = useState(false);
            const [realtimeSig, setRealtimeSig] = useState(null);
            const [boardingOpen, setBoardingOpen] = useState(false);
            const [groomingOpen, setGroomingOpen] = useState(false);
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [showSuccess, setShowSuccess] = useState(false); 
            const [toast, setToast] = useState(null);
            const [errors, setErrors] = useState({});
            const [isProcessingImg, setIsProcessingImg] = useState(false);

            // 新增：舊客查詢相關狀態
            const [isSearching, setIsSearching] = useState(false);
            const [showHistoryModal, setShowHistoryModal] = useState(false);
            const [historyRecords, setHistoryRecords] = useState([]);

            const [formData, setFormData] = useState({
                email: '', owner_name: '', owner_id: '', phone: '', address: '', 
                emergency_name: '', emergency_phone: '',
                // 移除 emergency2_name, emergency2_phone
                pet_name: '', breed: '', sex: '', age: '', weight: '', fix: '', 
                chip_status: '', chip_id: '', preferred_clinic: '',
                dog_traits: [], is_barking: '', barking_detail: '',
                medical_status: '', medical_history: [], medical_history_other: '',
                checkin_date: '', checkout_date: '', stay_exp: '',
                crate_status: [], food_aggr: '', pad_toilet: '',
                vaccine: '', deworm: '', deworm_brand: '', vaccine_file: null,
                allergy: '', personality: '', special_notes: '', boarding_notice_agree: false,
                service_type: '', service_type_other: '', 
                pickup_time: '', service_price: '',
                legal_agree: false
            });

            const fullSigCanvasRef = useRef(null);
            const padInstance = useRef(null);

            const showToast = (message, type = 'error') => {
                setToast({ message, type });
            };

            const compressImage = (file) => {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.readAsDataURL(file);
                    reader.onload = (event) => {
                        const img = new Image();
                        img.src = event.target.result;
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            let width = img.width;
                            let height = img.height;
                            const max_size = 1200; 
                            if (width > height) {
                                if (width > max_size) {
                                    height *= max_size / width;
                                    width = max_size;
                                }
                            } else {
                                if (height > max_size) {
                                    width *= max_size / height;
                                    height = max_size;
                                }
                            }
                            canvas.width = width;
                            canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);
                            const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
                            resolve(dataUrl);
                        };
                    };
                });
            };

            const handleChange = (field, value) => {
                let finalVal = value;
                if (field === 'email') finalVal = value.toLowerCase();
                if (field === 'owner_id') finalVal = value.toUpperCase();
                setFormData(prev => ({ ...prev, [field]: finalVal }));
                if (errors[field]) setErrors(prev => ({ ...prev, [field]: false }));
            };

            // --- 新增：搜尋舊客資料邏輯 ---
            const handleSearchHistory = async () => {
                const phone = formData.phone;
                if (!phone || phone.length < 9) {
                    showToast("⚠️ 請先輸入完整的連絡電話", "error");
                    return;
                }

                setIsSearching(true);
                try {
                    // 查詢該電話的所有訂單，按時間倒序排列
                    const { data, error } = await supabase
                        .rpc('search_guest_history', { phone_input: phone });
                    if (error) throw error;

                    if (!data || data.length === 0) {
                        showToast("🔍 查無此電話的過往紀錄", "error");
                    } else {
                        // 篩選出不重複的寵物 (取每隻寵物最近一次的紀錄)
                        const uniquePets = new Map();
                        data.forEach(record => {
                            if (record.raw_data && record.raw_data.pet_name) {
                                if (!uniquePets.has(record.raw_data.pet_name)) {
                                    uniquePets.set(record.raw_data.pet_name, record);
                                }
                            }
                        });
                        
                        const records = Array.from(uniquePets.values());
                        setHistoryRecords(records);
                        setShowHistoryModal(true);
                    }
                } catch (err) {
                    console.error("Search Error:", err);
                    showToast("❌ 查詢失敗，請檢查網路", "error");
                } finally {
                    setIsSearching(false);
                }
            };

            // --- 新增：帶入舊資料邏輯 ---
            const handleApplyHistory = (record) => {
                const oldData = record.raw_data;
                
                // 排除本次服務需要重新填寫的欄位
                const { 
                    checkin_date, checkout_date, pickup_time, service_price, 
                    signature, legal_agree, boarding_notice_agree, vaccine_file,
                    emergency2_name, emergency2_phone, // 排除舊資料的第二聯絡人
                    ...reusableData 
                } = oldData;

                // 合併資料
                setFormData(prev => ({
                    ...prev,
                    ...reusableData,
                    // 確保電話號碼是當前輸入的 (雖然應該一樣)
                    phone: formData.phone 
                }));

                // 重置簽名
                setRealtimeSig(null);
                
                setShowHistoryModal(false);
                showToast(`✅ 已帶入 ${oldData.pet_name} 的過往資料`, "success");
            };

            const toggleArrayField = (field, value) => {
                setFormData(prev => {
                    const currentArr = Array.isArray(prev[field]) ? prev[field] : [];
                    let updatedArr = currentArr.includes(value) ? currentArr.filter(i => i !== value) : [...currentArr, value];
                    if (updatedArr.length > 0 && errors[field]) setErrors(prev => ({ ...prev, [field]: false }));
                    return { ...prev, [field]: updatedArr };
                });
            };

            const validateEmail = (email) => /\S+@\S+\.com/.test(email);
            const validatePhone = (phone) => /^09\d{8}$/.test(phone);
            const validateTwID = (id) => {
                if (!/^[A-Z][12]\d{8}$/.test(id)) return false;
                const letters = "ABCDEFGHJKLMNPQRSTUVXYWZIO";
                const letterVal = letters.indexOf(id[0]) + 10;
                const n1 = Math.floor(letterVal / 10);
                const n2 = letterVal % 10;
                const numbers = [n1, n2, ...id.slice(1).split('').map(Number)];
                const weights = [1, 9, 8, 7, 6, 5, 4, 3, 2, 1, 1];
                let sum = 0;
                for (let i = 0; i < 11; i++) sum += numbers[i] * weights[i];
                return sum % 10 === 0;
            };

            const handleSubmit = async () => {
                const newErrors = {};
                const requiredText = ['email', 'owner_name', 'phone', 'owner_id', 'address', 'emergency_name', 'emergency_phone', 'pet_name', 'breed', 'weight', 'age', 'preferred_clinic'];
                requiredText.forEach(f => { if (!formData[f] || formData[f].toString().trim() === '') newErrors[f] = true; });
                
                if (formData.email && !validateEmail(formData.email)) newErrors.email = true;
                if (formData.phone && !validatePhone(formData.phone)) newErrors.phone = true;
                if (formData.emergency_phone && !validatePhone(formData.emergency_phone)) newErrors.emergency_phone = true;
                if (formData.owner_id && !validateTwID(formData.owner_id)) newErrors.owner_id = true;
                
                // 驗證體重必須大於 0
                if (!formData.weight || parseFloat(formData.weight) <= 0) {
                     newErrors.weight = true;
                     showToast("⚠️ 體重必須大於 0", "error");
                }

                if (!formData.sex) newErrors.sex = true;
                if (!formData.fix) newErrors.fix = true;
                if (!formData.chip_status) newErrors.chip_status = true;
                if (formData.dog_traits.length === 0) newErrors.dog_traits = true;
                if (!formData.medical_status) newErrors.medical_status = true;
                else if (formData.medical_status === '有' && formData.medical_history.length === 0) newErrors.medical_history = true; 

                if (isBoarding) {
                    if (!formData.checkin_date) newErrors.checkin_date = true;
                    if (!formData.checkout_date) newErrors.checkout_date = true;
                    
                    // 移除住宿時第二緊急聯絡人的驗證

                    if (formData.checkin_date && formData.checkout_date) {
                        const start = new Date(formData.checkin_date);
                        const end = new Date(formData.checkout_date);
                        if (end <= start) {
                            showToast("⚠️ 日期錯誤：退房日期必須晚於入住日期");
                            setErrors(prev => ({...prev, checkout_date: true}));
                            const dateEl = document.getElementsByName('checkout_date')[0];
                            if(dateEl) dateEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                            return; 
                        }
                    }
                    if (!formData.is_barking) newErrors.is_barking = true;
                    if (formData.is_barking === '會' && (!formData.barking_detail || formData.barking_detail.trim() === '')) newErrors.barking_detail = true;
                    if (!formData.stay_exp) newErrors.stay_exp = true;
                    if (!formData.food_aggr) newErrors.food_aggr = true;
                    if (!formData.pad_toilet) newErrors.pad_toilet = true;
                    if (!formData.vaccine) newErrors.vaccine = true;
                    if (formData.vaccine === '有' && !formData.vaccine_file) newErrors.vaccine_file = true;
                    if (!formData.deworm) newErrors.deworm = true;
                    if (formData.deworm === '有' && (!formData.deworm_brand || formData.deworm_brand.trim() === '')) newErrors.deworm_brand = true;
                    if (formData.crate_status.length === 0) newErrors.crate_status = true;
                    if (!formData.allergy) newErrors.allergy = true;
                    if (!formData.personality) newErrors.personality = true;
                    if (!formData.special_notes) newErrors.special_notes = true;
                    if (!formData.boarding_notice_agree) newErrors.boarding_notice_agree = true;
                    
                    // 住宿時不需要驗證 service_price (因為移除了輸入框)
                } else {
                    if (!formData.service_type) newErrors.service_type = true;
                    if (formData.service_type === '其他項目' && (!formData.service_type_other || formData.service_type_other.trim() === '')) newErrors.service_type_other = true;
                     // 驗證金額必須大於 0 (非住宿模式)
                    if (!formData.service_price || parseInt(formData.service_price) <= 0) newErrors.service_price = true;
                }

                if (!formData.legal_agree) newErrors.legal_agree = true;
                if (!realtimeSig) newErrors.signature = true;

                setErrors(newErrors);
                const errorKeys = Object.keys(newErrors);
                if (errorKeys.length > 0) {
                    const firstError = errorKeys[0];
                    let el = document.getElementById(firstError) || document.getElementsByName(firstError)[0];
                    if (firstError === 'vaccine_file') el = document.getElementById('vaccine-label');
                    if (firstError === 'signature') el = document.getElementById('signature');
                    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    
                    if (newErrors.email && formData.email) showToast("⚠️ 電子郵件格式錯誤");
                    else if ((newErrors.phone && formData.phone) || (newErrors.emergency_phone && formData.emergency_phone)) showToast("⚠️ 電話號碼格式錯誤");
                    else if (newErrors.owner_id && formData.owner_id) showToast("⚠️ 身分證字號無效 (請檢查格式或數字)");
                    else if (newErrors.weight) showToast("⚠️ 體重必須大於 0");
                    else if (newErrors.service_price) showToast("⚠️ 金額必須大於 0");
                    else showToast("⚠️ 請填寫所有必填欄位 (紅色標示處)");
                    return;
                }

                setIsSubmitting(true);

                try {
                    let signatureUrl = null;
                    let vaccineUrl = null;
                    const timestamp = Date.now();

                    if (realtimeSig) {
                        const sigBlob = dataURLtoBlob(realtimeSig);
                        const fileName = `sig_${timestamp}_${Math.random().toString(36).substring(7)}.jpg`;
                        const { data: sigData, error: sigError } = await supabase.storage.from('signatures').upload(fileName, sigBlob, { contentType: 'image/jpeg' });
                        if (sigError) throw sigError;
                        const { data: { publicUrl } } = supabase.storage.from('signatures').getPublicUrl(fileName);
                        signatureUrl = publicUrl;
                    }

                    if (formData.vaccine_file) {
                        const vacBlob = dataURLtoBlob(formData.vaccine_file);
                        const fileName = `vac_${timestamp}_${Math.random().toString(36).substring(7)}.jpg`;
                        const { data: vacData, error: vacError } = await supabase.storage.from('vaccines').upload(fileName, vacBlob, { contentType: 'image/jpeg' });
                        if (vacError) throw vacError;
                        const { data: { publicUrl } } = supabase.storage.from('vaccines').getPublicUrl(fileName);
                        vaccineUrl = publicUrl;
                    }

                    const { error: insertError } = await supabase
                        .from('bookings')
                        .insert({
                            owner_name: formData.owner_name,
                            phone: formData.phone,
                            pet_name: formData.pet_name,
                            service_type: isBoarding ? '住宿＋美容' : formData.service_type,
                            checkin_date: isBoarding ? formData.checkin_date : null,
                            checkout_date: isBoarding ? formData.checkout_date : null,
                            pickup_time: formData.pickup_time,
                            service_price: isBoarding ? 0 : formData.service_price, // 住宿時金額設為 0
                            signature_url: signatureUrl,
                            vaccine_url: vaccineUrl,
                            status: 'pending', 
                            raw_data: formData,
                            // 移除 emergency2 相關欄位
                        });

                    if (insertError) throw insertError;
                    localStorage.removeItem('wangwang_form_draft');
                    setShowSuccess(true);

                } catch (error) {
                    console.error('Submission Error:', error);
                    showToast(`❌ 提交失敗: ${error.message || '請檢查網路連線'}`);
                } finally {
                    setIsSubmitting(false);
                }
            };

            const handleSuccessClose = () => {
                setShowSuccess(false);
                window.location.reload();
            }

            const selectServiceFlow = (type) => {
                setIsBoarding(type === 'both');
                setView('client');
                setTimeout(() => { window.scrollTo({top: 0, behavior: 'smooth'}); }, 100);
            };

            // 儲存當前滾動位置
            const scrollPositionRef = useRef(0);
            // 儲存初始方向
            const initialOrientationRef = useRef(null);
            // 儲存初始化時的畫布尺寸
            const canvasSizeRef = useRef({ width: 0, height: 0 });

            useEffect(() => {
                let timer;
                let orientationLocked = false;
                
                // 嘗試鎖定螢幕方向
                const lockOrientation = async () => {
                    try {
                        initialOrientationRef.current = window.screen?.orientation?.type || 'portrait-primary';
                        if (window.screen?.orientation?.lock) {
                            await window.screen.orientation.lock(initialOrientationRef.current);
                            orientationLocked = true;
                        }
                    } catch (e) {
                        console.log('Screen orientation lock not supported:', e.message);
                    }
                };

                // 解鎖螢幕方向
                const unlockOrientation = () => {
                    try {
                        if (orientationLocked && window.screen?.orientation?.unlock) {
                            window.screen.orientation.unlock();
                        }
                    } catch (e) {
                        console.log('Screen orientation unlock failed:', e.message);
                    }
                };

                // 阻止觸控事件導致頁面滾動
                const preventTouchMove = (e) => {
                    if (showFullSig) {
                        e.preventDefault();
                    }
                };

                // 阻止雙指縮放
                const preventGesture = (e) => {
                    if (showFullSig) {
                        e.preventDefault();
                    }
                };

                // 初始化畫布
                const initCanvas = () => {
                    const canvas = fullSigCanvasRef.current;
                    if (!canvas) return;
                    
                    // 獲取畫布容器的實際顯示尺寸
                    const container = canvas.parentElement;
                    const rect = container.getBoundingClientRect();
                    const displayWidth = rect.width;
                    const displayHeight = rect.height;
                    
                    // 儲存初始化時的尺寸
                    canvasSizeRef.current = { width: displayWidth, height: displayHeight };
                    
                    // 設定 Canvas 的實際尺寸（考慮 devicePixelRatio 以獲得高清顯示）
                    const ratio = Math.max(window.devicePixelRatio || 1, 1);
                    canvas.width = displayWidth * ratio;
                    canvas.height = displayHeight * ratio;
                    
                    // 設定 Canvas 的 CSS 顯示尺寸（必須與容器一致）
                    canvas.style.width = displayWidth + 'px';
                    canvas.style.height = displayHeight + 'px';
                    
                    const ctx = canvas.getContext("2d");
                    ctx.scale(ratio, ratio);
                    
                    // 填充白色背景
                    ctx.fillStyle = "rgb(255, 255, 255)";
                    ctx.fillRect(0, 0, displayWidth, displayHeight);
                    
                    // 銷毀舊的 SignaturePad 實例
                    if (padInstance.current) {
                        padInstance.current.off();
                    }
                    
                    padInstance.current = new SignaturePad(canvas, { 
                        penColor: "rgb(115, 99, 87)",
                        backgroundColor: "rgb(255, 255, 255)", 
                        minWidth: 1.5,
                        maxWidth: 4.0,
                        throttle: 16, 
                        minDistance: 3, 
                        velocityFilterWeight: 0.7,
                    });
                };

                if (showFullSig && fullSigCanvasRef.current) {
                    // 儲存當前滾動位置
                    scrollPositionRef.current = window.scrollY;
                    
                    // 添加 signing-mode class 禁止頁面滾動
                    document.body.classList.add('signing-mode');
                    document.body.style.top = `-${scrollPositionRef.current}px`;
                    
                    // 嘗試鎖定螢幕方向
                    lockOrientation();
                    
                    // 阻止觸控滾動和手勢
                    document.addEventListener('touchmove', preventTouchMove, { passive: false });
                    document.addEventListener('gesturestart', preventGesture, { passive: false });
                    document.addEventListener('gesturechange', preventGesture, { passive: false });
                    document.addEventListener('gestureend', preventGesture, { passive: false });
                    
                    // 延遲初始化，確保 DOM 已完全渲染
                    timer = setTimeout(initCanvas, 150);
                }
                
                return () => { 
                    if (timer) clearTimeout(timer);
                    if (padInstance.current) padInstance.current.off(); 
                    
                    // 解鎖螢幕方向
                    unlockOrientation();
                    
                    // 移除 signing-mode class 並恢復滾動位置
                    document.body.classList.remove('signing-mode');
                    document.body.style.top = '';
                    window.scrollTo(0, scrollPositionRef.current);
                    
                    // 移除事件監聽器
                    document.removeEventListener('touchmove', preventTouchMove);
                    document.removeEventListener('gesturestart', preventGesture);
                    document.removeEventListener('gesturechange', preventGesture);
                    document.removeEventListener('gestureend', preventGesture);
                };
            }, [showFullSig]);

            const pillBtn = (field, val, active) => (
                <button type="button" onClick={() => handleChange(field, val)} 
                    className={`pill-button flex-1 py-3.5 rounded-xl font-bold text-sm border transition-all duration-300 transform ${active ? 'bg-[#736357] text-white border-[#736357] shadow-lg shadow-[#736357]/20' : 'bg-white text-slate-400 border-slate-200 hover:border-[#F7E7B5] hover:text-[#736357] hover:bg-[#F7E7B5]/5'}`}>
                    {val}
                </button>
            );

            const getTodayDate = () => new Date().toISOString().split('T')[0];
            const getMinCheckoutDate = () => {
                if (!formData.checkin_date) return getTodayDate();
                const d = new Date(formData.checkin_date);
                d.setDate(d.getDate() + 1);
                return d.toISOString().split('T')[0];
            };

            const UnifiedLineSection = ({ formData, setFormData }) => {
                const [lineConfirmed, setLineConfirmed] = useState(false);
                return (
                    <div className="glass-card section-highlight overflow-hidden border-none bg-gradient-to-br from-white via-[#fefcf9] to-[#F7E7B5]/20 p-8 shadow-sm relative">
                        <div className="absolute top-0 right-0 w-64 h-64 bg-[#F7E7B5]/20 rounded-full blur-3xl -translate-y-1/2 translate-x-1/3"></div>
                        
                        <div className="flex flex-col lg:flex-row items-center gap-8 relative z-10">
                            <div className="flex-1 space-y-4 text-center lg:text-left">
                                <div className="flex items-center justify-center lg:justify-start gap-3">
                                    <div className="w-14 h-14 bg-[#06C755] text-white rounded-2xl flex items-center justify-center shadow-lg shadow-green-200 transform -rotate-3 transition-transform hover:rotate-0">
                                        <Icon name="message-circle" size={30} />
                                    </div>
                                    <h3 className="text-2xl font-black text-[#736357] tracking-tight">官方 LINE 諮詢服務</h3>
                                </div>
                                <div className="space-y-2 text-[#736357] font-medium text-sm leading-relaxed opacity-90">
                                    <p>為了更了解您的小寶貝，請先加 LINE 並 <span className="text-red-500 font-bold underline decoration-wavy underline-offset-4 decoration-2">丟個貼圖</span> 我們才看得到您哦！😊</p>
                                    <p className="inline-flex items-center gap-1 text-[#06C755] text-xs font-bold bg-[#06C755]/10 px-3 py-1 rounded-full">
                                        <Icon name="hash" size={12}/> LINE ID: @cik3330f
                                    </p>
                                </div>
                            </div>
                            <div className="flex flex-col items-center gap-3 min-w-[240px]">
                                <a href="https://line.me/R/ti/p/@cik3330f" target="_blank" className="line-btn-animated w-full text-center py-4 rounded-2xl text-white font-black text-lg shadow-xl shadow-green-200 hover:shadow-2xl transition-all active:scale-95 flex items-center justify-center gap-2">
                                    <Icon name="message-circle" size={20}/> 立即加 LINE
                                </a>
                                <button type="button" onClick={() => setLineConfirmed(!lineConfirmed)} 
                                    className={`w-full flex items-center justify-center gap-2 px-6 py-3 rounded-xl font-bold text-xs transition-all duration-500 border-2 ${lineConfirmed ? 'bg-[#06C755] text-white border-[#06C755] shadow-inner' : 'bg-white text-[#06C755] border-[#06C755] hover:bg-[#06C755]/5'}`}>
                                    <Icon name="check-circle" size={14} className={lineConfirmed ? "" : "opacity-50"} />
                                    {lineConfirmed ? "已加 LINE 並丟貼圖" : "確認：已加 LINE 丟貼圖"}
                                </button>
                            </div>
                        </div>
                    </div>
                );
            };

            if (view === 'entry') {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-8 bg-[#fefcf9] relative overflow-hidden">
                        {/* 修正背景光暈遮擋問題：加入 pointer-events-none */}
                        <div className="absolute top-[-10%] right-[-10%] w-[500px] h-[500px] bg-[#F7E7B5]/30 rounded-full blur-[100px] mix-blend-multiply animate-pulse pointer-events-none"></div>
                        <div className="absolute bottom-[-10%] left-[-10%] w-[500px] h-[500px] bg-[#736357]/10 rounded-full blur-[100px] mix-blend-multiply pointer-events-none"></div>
                        
                        <div className="w-48 h-48 md:w-64 md:h-64 mx-auto mb-10 relative transform hover:scale-105 transition-transform duration-500">
                            <img src="./logo.png" alt="汪汪犬旅 Logo" className="w-full h-full object-contain drop-shadow-2xl" />
                        </div>
                        
                        <div className="grid md:grid-cols-2 gap-8 w-full max-w-4xl px-4 relative z-10">
                            <button onClick={() => selectServiceFlow('grooming')} className="glass-card p-10 text-left group hover:translate-y-[-5px] hover:shadow-[0_20px_40px_-15px_rgba(115,99,87,0.15)] bg-white border-b-8 section-highlight relative overflow-hidden">
                                <div className="absolute top-0 right-0 w-32 h-32 bg-[#736357]/5 rounded-full blur-2xl transform translate-x-1/2 -translate-y-1/2"></div>
                                <div className="w-16 h-16 bg-[#736357]/5 text-[#736357] rounded-2xl flex items-center justify-center mb-6 group-hover:bg-[#736357] group-hover:text-white transition-all duration-300 shadow-sm">
                                    <Icon name="scissors" size={32} />
                                </div>
                                <h3 className="text-3xl font-black mb-3 text-[#736357]">美容洗澡</h3>
                                <p className="text-slate-400 font-medium text-sm mb-8 leading-relaxed">細心呵護，讓毛孩煥然一新</p>
                                <div className="text-[#736357] font-bold flex items-center gap-2 text-sm uppercase tracking-wider group-hover:translate-x-2 transition-transform">
                                    開始填寫 <div className="bg-[#736357]/10 p-1.5 rounded-full group-hover:bg-[#736357] group-hover:text-white transition-colors"><Icon name="arrow-right" size={16}/></div>
                                </div>
                            </button>
                            
                            <button onClick={() => selectServiceFlow('both')} className="glass-card p-10 text-left group hover:translate-y-[-5px] hover:shadow-[0_20px_40px_-15px_rgba(247,231,181,0.4)] bg-white border-b-8 border-[#F7E7B5] relative overflow-hidden">
                                <div className="absolute top-0 right-0 w-32 h-32 bg-[#F7E7B5]/30 rounded-full blur-2xl transform translate-x-1/2 -translate-y-1/2"></div>
                                <div className="w-16 h-16 bg-[#F7E7B5]/30 text-[#736357] rounded-2xl flex items-center justify-center mb-6 group-hover:bg-[#F7E7B5] transition-all duration-300 shadow-sm">
                                    <Icon name="home" size={32} />
                                </div>
                                <h3 className="text-3xl font-black mb-3 text-[#736357]">住宿 ＋ 洗澡</h3>
                                <p className="text-slate-400 font-medium text-sm mb-8 leading-relaxed">不關籠旅館，像家一樣的溫暖</p>
                                <div className="text-[#736357] font-bold flex items-center gap-2 text-sm uppercase tracking-wider group-hover:translate-x-2 transition-transform">
                                    開始填寫 <div className="bg-[#F7E7B5]/30 p-1.5 rounded-full group-hover:bg-[#736357] group-hover:text-white transition-colors"><Icon name="arrow-right" size={16}/></div>
                                </div>
                            </button>
                        </div>

                        {/* --- 修正後的管理員入口：加上 relative 和 z-index 確保在背景之上 --- */}
                        <footer className="py-8 text-center relative z-20">
                            <a href="admin.html" className="inline-flex items-center justify-center p-4 text-slate-300 hover:text-[#736357]" title="Staff Only">
                                <Icon name="lock" size={28} />
                            </a>
                        </footer>

                    </div>
                );
            }

            return (
                <div className="min-h-screen pb-32">
                    {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                    {showSuccess && <SuccessReceipt data={formData} signature={realtimeSig} onClose={handleSuccessClose} />}
                    {showHistoryModal && <HistoryModal records={historyRecords} onClose={() => setShowHistoryModal(false)} onSelect={handleApplyHistory} />}

                    <nav className="fixed top-0 w-full z-40 bg-white/80 backdrop-blur-xl border-b border-[#736357]/5 shadow-sm">
                        <div className="px-6 py-4 flex justify-between items-center max-w-7xl mx-auto">
                            <div className="flex items-center gap-3 cursor-pointer group" onClick={() => setView('entry')}>
                                <img src="./logo.png" alt="Logo" className="w-8 h-8 object-contain group-hover:rotate-12 transition-transform" />
                                <div className="font-black text-xl text-[#736357] tracking-tight">汪汪犬旅</div>
                            </div>
                            <button onClick={() => setView('entry')} className="text-xs font-bold text-[#736357]/60 hover:text-[#736357] hover:bg-[#736357]/5 px-4 py-2 border border-[#736357]/10 rounded-full transition-all flex items-center gap-2">
                                <Icon name="arrow-left" size={14}/> 返回首頁
                            </button>
                        </div>
                    </nav>

                    <main className="pt-32 px-4 max-w-4xl mx-auto space-y-8">
                        {/* ... (其他內容保持不變) ... */}
                        
                        <div className="text-center space-y-3 pb-4">
                            <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-[#736357]/5 text-[#736357] text-xs font-bold uppercase tracking-wider">
                                {isBoarding ? "Boarding & Grooming" : "Grooming Service"}
                            </div>
                            <h2 className="text-3xl md:text-4xl font-black text-[#736357] tracking-tight">
                                {isBoarding ? "住宿與美容服務填寫" : "美容服務填寫資料"}
                            </h2>
                        </div>

                        <UnifiedLineSection formData={formData} setFormData={setFormData} />
                        
                        <div className="space-y-10">
                            {/* 1. 飼主基本資料 */}
                            <section className="glass-card p-8 md:p-10 space-y-8 section-highlight">
                                <div className="flex items-center gap-4 border-b border-[#736357]/10 pb-6">
                                    <div className="w-10 h-10 rounded-full bg-[#736357]/5 flex items-center justify-center text-[#736357]">
                                        <Icon name="user" size={20}/>
                                    </div>
                                    <h3 className="text-xl font-bold text-[#736357]">飼主基本資料</h3>
                                </div>
                                <div className="grid md:grid-cols-2 gap-6">
                                    <div className="space-y-1.5"><label className="text-xs font-bold text-slate-400 ml-1">電子郵件 *(寄送契約副本用)</label><input name="email" type="email" value={formData.email} onChange={e=>handleChange('email', e.target.value)} className={`w-full cute-input rounded-xl px-5 py-3.5 font-bold text-[#736357] ${errors.email ? 'shake-error' : ''}`} placeholder="example@email.com" /></div>
                                    <div className="space-y-1.5"><label className="text-xs font-bold text-slate-400 ml-1">主人姓名 *</label><input name="owner_name" value={formData.owner_name} onChange={e=>handleChange('owner_name', e.target.value)} className={`w-full cute-input rounded-xl px-5 py-3.5 font-bold text-[#736357] ${errors.owner_name ? 'shake-error' : ''}`} placeholder="請輸入全名" /></div>
                                    <div className="space-y-1.5">
                                        <label className="text-xs font-bold text-slate-400 ml-1">連絡電話 *</label>
                                        <div className="flex gap-2">
                                            <input name="phone" type="tel" inputMode="numeric" value={formData.phone} 
                                                onChange={e=>handleChange('phone', e.target.value.replace(/\D/g, ''))} 
                                                className={`flex-1 cute-input rounded-xl px-5 py-3.5 font-bold text-[#736357] ${errors.phone ? 'shake-error' : ''}`} 
                                                placeholder="0912345678"
                                            />
                                            {/* 新增的搜尋按鈕 */}
                                            <button 
                                                onClick={handleSearchHistory} 
                                                disabled={isSearching}
                                                className="px-4 bg-[#736357] text-white rounded-xl font-bold text-sm shadow-md hover:bg-[#5D4D41] transition-all flex items-center gap-1 disabled:opacity-50"
                                            >
                                                {isSearching ? <Icon name="loader-2" size={16} className="animate-spin" /> : <Icon name="search" size={16} />}
                                                舊客
                                            </button>
                                        </div>
                                    </div>
                                    <div className="space-y-1.5">
                                        <label className="text-xs font-bold text-slate-400 ml-1 flex items-center gap-1">
                                            身分證字號 <span className="text-red-500 font-black text-[10px] bg-red-50 px-1.5 py-0.5 rounded-md ml-1">入住時請攜帶正本核對</span> *
                                        </label>
                                        <input name="owner_id" value={formData.owner_id} onChange={e=>handleChange('owner_id', e.target.value)} className={`w-full cute-input rounded-xl px-5 py-3.5 font-bold text-[#736357] ${errors.owner_id ? 'shake-error' : ''}`} placeholder="例如: A123456789" />
                                    </div>
                                    <div className="md:col-span-2 space-y-1.5"><label className="text-xs font-bold text-slate-400 ml-1">通訊地址 *</label><input name="address" value={formData.address} onChange={e=>handleChange('address', e.target.value)} className={`w-full cute-input rounded-xl px-5 py-3.5 font-bold text-[#736357] ${errors.address ? 'shake-error' : ''}`} placeholder="請輸入完整地址" /></div>
                                    
                                    {/* 第一緊急聯絡人 (紅色系) */}
                                    <div className="space-y-1.5"><label className="text-xs font-bold text-red-400 ml-1">緊急聯絡人姓名 *</label><input name="emergency_name" value={formData.emergency_name} onChange={e=>handleChange('emergency_name', e.target.value)} className={`w-full cute-input rounded-xl px-5 py-3.5 font-bold text-[#736357] border-red-50 bg-red-50/10 focus:border-red-200 ${errors.emergency_name ? 'shake-error' : ''}`} /></div>
                                    <div className="space-y-1.5">
                                        <label className="text-xs font-bold text-red-400 ml-1">緊急連絡電話 *</label>
                                        <input name="emergency_phone" type="tel" inputMode="numeric" value={formData.emergency_phone} 
                                            onChange={e=>handleChange('emergency_phone', e.target.value.replace(/\D/g, ''))} // 僅數字
                                            className={`w-full cute-input rounded-xl px-5 py-3.5 font-bold text-[#736357] border-red-50 bg-red-50/10 focus:border-red-200 ${errors.emergency_phone ? 'shake-error' : ''}`} 
                                        />
                                    </div>

                                    {/* 已移除住宿模式下的第二緊急聯絡人 */}

                                </div>
                            </section>

                            {/* 2. 寵物資料與住宿問卷 */}
                            <section className={`glass-card p-8 md:p-10 space-y-8 section-highlight ${isBoarding ? 'bg-gradient-to-b from-white to-[#F7E7B5]/10' : 'bg-white'}`}>
                                <div className="flex items-center gap-4 border-b border-[#736357]/10 pb-6">
                                    <div className="w-10 h-10 rounded-full bg-[#736357]/5 flex items-center justify-center text-[#736357]">
                                        <Icon name="calendar" size={20}/>
                                    </div>
                                    <h3 className="text-xl font-bold text-[#736357]">
                                        {isBoarding ? "住宿行為與健康問卷" : "寵物詳細資料"}
                                    </h3>
                                </div>
                                
                                <div className="grid md:grid-cols-2 gap-6">
                                    {isBoarding && (
                                        <>
                                            <div className="space-y-1.5">
                                                <label className="text-xs font-bold text-slate-400 ml-1">入住日期 *</label>
                                                <input name="checkin_date" type="date" min={getTodayDate()} value={formData.checkin_date} onChange={e=>handleChange('checkin_date', e.target.value)} className={`w-full cute-input rounded-xl px-5 py-3.5 font-bold text-[#736357] ${errors.checkin_date ? 'shake-error' : ''}`} />
                                            </div>
                                            <div className="space-y-1.5">
                                                <label className="text-xs font-bold text-slate-400 ml-1">退房日期 *</label>
                                                <input name="checkout_date" type="date" min={getMinCheckoutDate()} value={formData.checkout_date} onChange={e=>handleChange('checkout_date', e.target.value)} className={`w-full cute-input rounded-xl px-5 py-3.5 font-bold text-[#736357] ${errors.checkout_date ? 'shake-error' : ''}`} />
                                            </div>
                                        </>
                                    )}
                                    
                                    <div className="md:col-span-2 grid md:grid-cols-2 lg:grid-cols-3 gap-6 pt-4 border-t border-[#736357]/10 mt-2">
                                        <div className="space-y-1.5"><label className="text-xs font-bold text-slate-400 ml-1">寵物名字 *</label><input name="pet_name" value={formData.pet_name} onChange={e=>handleChange('pet_name', e.target.value)} className={`w-full cute-input rounded-xl px-5 py-3.5 font-bold text-[#736357] ${errors.pet_name ? 'shake-error' : ''}`} /></div>
                                        <div className="space-y-1.5"><label className="text-xs font-bold text-slate-400 ml-1">品種 *</label><input name="breed" value={formData.breed} onChange={e=>handleChange('breed', e.target.value)} className={`w-full cute-input rounded-xl px-5 py-3.5 font-bold text-[#736357] ${errors.breed ? 'shake-error' : ''}`} /></div>
                                        <div className="space-y-1.5"><label className="text-xs font-bold text-slate-400 ml-1">體重 * (kg)</label><input name="weight" type="number" step="0.1" value={formData.weight} onChange={e=>handleChange('weight', e.target.value)} className={`w-full cute-input rounded-xl px-5 py-3.5 font-bold text-[#736357] ${errors.weight ? 'shake-error' : ''}`} /></div>
                                        <div className="space-y-1.5"><label className="text-xs font-bold text-slate-400 ml-1">年齡 *</label><input name="age" value={formData.age} onChange={e=>handleChange('age', e.target.value)} className={`w-full cute-input rounded-xl px-5 py-3.5 font-bold text-[#736357] ${errors.age ? 'shake-error' : ''}`} /></div>
                                        <div className="space-y-2" id="sex"><label className="text-xs font-bold text-slate-400 ml-1">性別 *</label><div className={`flex gap-2 ${errors.sex ? 'group-error' : ''}`}>{pillBtn('sex', '公', formData.sex==='公')}{pillBtn('sex', '母', formData.sex==='母')}</div></div>
                                        <div className="space-y-2" id="fix"><label className="text-xs font-bold text-slate-400 ml-1">結紮 *</label><div className={`flex gap-2 ${errors.fix ? 'group-error' : ''}`}>{pillBtn('fix', '是', formData.fix==='是')}{pillBtn('fix', '否', formData.fix==='否')}</div></div>
                                    </div>

                                    <div className="md:col-span-2 space-y-8 pt-4 border-t border-[#736357]/10 mt-4">
                                        <div className="grid md:grid-cols-2 gap-8">
                                            <div className="space-y-3" id="dog_traits">
                                                <label className="text-xs font-bold text-slate-400 ml-1 tracking-wider">親狗程度 (可複選) *</label>
                                                <div className={`flex flex-wrap gap-2 ${errors.dog_traits ? 'group-error' : ''}`}>
                                                    {['有攻擊性','無攻擊性','可與狗朋友們一起玩耍','不能與狗朋友們一起玩耍'].map(v => (
                                                        <button type="button" key={v} onClick={()=>toggleArrayField('dog_traits', v)} className={`pill-button px-4 py-2.5 rounded-xl text-xs font-bold border transition-all ${formData.dog_traits.includes(v) ? 'bg-[#736357] text-white border-[#736357] shadow-md' : 'bg-white text-slate-400 border-slate-200 hover:border-[#F7E7B5] hover:text-[#736357]'}`}>{v}</button>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>

                                        <div className="space-y-4" id="chip_status">
                                            <label className="text-xs font-bold text-slate-400 ml-1 tracking-wider">晶片 *</label>
                                            <div className={`flex flex-wrap gap-4 ${errors.chip_status ? 'group-error' : ''}`}>
                                                {['有晶片', '有晶片(號碼不詳)', '無晶片'].map(s => (
                                                    <button key={s} type="button" onClick={()=>handleChange('chip_status', s)} className={`pill-button px-5 py-3 rounded-xl font-bold text-sm border transition-all ${formData.chip_status === s ? 'bg-[#736357] text-white border-[#736357] shadow-md' : 'bg-white text-slate-400 border-slate-200 hover:border-[#F7E7B5] hover:text-[#736357]'}`}>{s}</button>
                                                ))}
                                            </div>
                                            {formData.chip_status === '有晶片' && <input placeholder="輸入 10 或 15 碼晶片號碼" value={formData.chip_id} onChange={e=>setFormData({...formData, chip_id:e.target.value})} className="w-full cute-input rounded-xl px-5 py-3.5 font-bold text-[#736357] mt-3 animate-in fade-in" />}
                                        </div>

                                        <div className="space-y-1.5">
                                            <label className="text-xs font-bold text-slate-400 ml-1 tracking-wider">指定就醫診療機構(若未填寫，則送往特約醫院) *</label>
                                            <input name="preferred_clinic" value={formData.preferred_clinic} onChange={e=>handleChange('preferred_clinic', e.target.value)} className={`w-full cute-input rounded-xl px-5 py-3.5 font-bold text-[#736357] ${errors.preferred_clinic ? 'shake-error' : ''}`} placeholder="(若無請填無)" />
                                        </div>

                                        <div className="space-y-4" id="medical_status">
                                            <label className="text-xs font-bold text-slate-400 ml-1 tracking-wider">過往病史 (可複選) *</label>
                                            <div className={`flex gap-3 mb-4 ${errors.medical_status ? 'group-error' : ''}`}>
                                                {/* 修改：有跟無順序交換 */}
                                                {pillBtn('medical_status', '有', formData.medical_status === '有')}
                                                {pillBtn('medical_status', '無', formData.medical_status === '無')}
                                            </div>
                                            
                                            {formData.medical_status === '有' && (
                                                <div className={`space-y-4 animate-in fade-in slide-in-from-top-2 duration-400 ${errors.medical_history ? 'group-error' : ''}`}>
                                                    <div className="flex flex-wrap gap-2">
                                                        {['心臟病','氣喘','氣管塌陷','白內障','癲癇','心絲蟲','艾利希體','腹膜炎','腹積水','手術外傷未癒合','髖關節問題','骨折','腸炎','血便','血尿','懷孕','傳診性疾病'].map(v => (
                                                            <button type="button" key={v} onClick={() => toggleArrayField('medical_history', v)} className={`pill-button px-4 py-2.5 rounded-xl text-xs font-bold border transition-all ${formData.medical_history.includes(v) ? 'bg-[#736357] text-white shadow-md' : 'bg-white text-slate-400 border-slate-200 hover:border-[#F7E7B5] hover:text-[#736357]'}`}>{v}</button>
                                                        ))}
                                                        <button type="button" onClick={() => toggleArrayField('medical_history', '其他')} className={`pill-button px-4 py-2.5 rounded-xl text-xs font-bold border transition-all ${formData.medical_history.includes('其他') ? 'bg-[#06C755] text-white border-[#06C755] shadow-md' : 'bg-white text-slate-400 border-dashed border-slate-300 hover:border-[#06C755] hover:text-[#06C755]'}`}>＋ 其他</button>
                                                    </div>
                                                    {formData.medical_history.includes('其他') && <textarea value={formData.medical_history_other || ''} onChange={e => setFormData({...formData, medical_history_other: e.target.value})} className="w-full cute-input rounded-xl px-5 py-3.5 font-bold text-[#736357] min-h-[80px] text-sm shadow-inner animate-in fade-in" placeholder="請詳細說明其他病史..." />}
                                                </div>
                                            )}
                                        </div>
                                    </div>

                                    {/* 住宿專用區塊：包含行為、疫苗、籠內訓練、過敏、個性、注意事項 */}
                                    {isBoarding && (
                                        <div className="md:col-span-2 space-y-8 pt-4 border-t border-[#736357]/10 mt-4 animate-in fade-in">
                                            <div className="grid md:grid-cols-2 gap-8">
                                                <div className="space-y-3" id="is_barking">
                                                    <label className="text-xs font-bold text-slate-400 ml-1">會容易吠叫嗎 *</label>
                                                    <div className={`flex gap-2 ${errors.is_barking ? 'group-error' : ''}`}>{pillBtn('is_barking', '會', formData.is_barking === '會')}{pillBtn('is_barking', '不會', formData.is_barking === '不會')}</div>
                                                    {formData.is_barking === '會' && <textarea name="barking_detail" value={formData.barking_detail || ''} onChange={e => handleChange('barking_detail', e.target.value)} className={`w-full cute-input rounded-xl px-5 py-3.5 font-bold text-[#736357] mt-2 min-h-[80px] text-sm ${errors.barking_detail ? 'shake-error' : ''}`} placeholder="什麼情況下會吠叫？" />}
                                                </div>
                                                <div className="space-y-3" id="stay_exp"><label className="text-xs font-bold text-slate-400 ml-1">有住宿過的經驗嗎 *</label><div className={`flex gap-2 ${errors.stay_exp ? 'group-error' : ''}`}>{pillBtn('stay_exp', '有', formData.stay_exp==='有')}{pillBtn('stay_exp', '沒有', formData.stay_exp==='沒有')}</div></div>
                                                <div className="space-y-3" id="food_aggr"><label className="text-xs font-bold text-slate-400 ml-1">會護食嗎 *</label><div className={`flex gap-2 ${errors.food_aggr ? 'group-error' : ''}`}>{pillBtn('food_aggr', '會', formData.food_aggr==='會')}{pillBtn('food_aggr', '不會', formData.food_aggr==='不會')}</div></div>
                                                <div className="space-y-3" id="pad_toilet"><label className="text-xs font-bold text-slate-400 ml-1">會在尿布墊上上廁所嗎 *</label><div className={`flex gap-2 ${errors.pad_toilet ? 'group-error' : ''}`}>{pillBtn('pad_toilet', '會', formData.pad_toilet==='會')}{pillBtn('pad_toilet', '不會', formData.pad_toilet==='不會')}</div></div>
                                                <div className="space-y-3" id="vaccine">
                                                    <label className="text-xs font-bold text-slate-400 ml-1">每年定期施打疫苗 (請提供疫苗手冊) *</label>
                                                    <div className={`flex gap-2 ${errors.vaccine ? 'group-error' : ''}`}>{pillBtn('vaccine', '有', formData.vaccine==='有')}{pillBtn('vaccine', '沒有', formData.vaccine==='沒有')}</div>
                                                    
                                                    {formData.vaccine === '有' && (
                                                        <div className="mt-3 space-y-3 animate-in fade-in slide-in-from-top-1">
                                                            <input type="file" accept="image/*" id="vaccine-upload" className="hidden"
                                                                onChange={async (e) => {
                                                                    const file = e.target.files[0];
                                                                    if (file) {
                                                                        setIsProcessingImg(true); 
                                                                        showToast("📸 正在壓縮圖片中，請稍候...", "success");
                                                                        
                                                                        try {
                                                                            const compressedDataUrl = await compressImage(file);
                                                                            setFormData(prev => ({...prev, vaccine_file: compressedDataUrl}));
                                                                            if(errors.vaccine_file) setErrors(prev=>({...prev, vaccine_file:false}));
                                                                            showToast("✅ 圖片上傳並壓縮成功！", "success");
                                                                        } catch (error) {
                                                                            console.error(error);
                                                                            showToast("❌ 圖片處理失敗，請重試");
                                                                        } finally {
                                                                            setIsProcessingImg(false);
                                                                        }
                                                                    }
                                                                }}
                                                            />
                                                            <label id="vaccine-label" htmlFor="vaccine-upload" 
                                                                className={`w-full flex items-center justify-center gap-2 py-6 border-2 border-dashed border-[#F7E7B5] bg-[#F7E7B5]/5 rounded-2xl cursor-pointer hover:bg-[#F7E7B5]/20 transition-all ${errors.vaccine_file ? 'shake-error' : ''} ${isProcessingImg ? 'opacity-50 cursor-not-allowed' : ''}`}
                                                            >
                                                                {isProcessingImg ? (
                                                                    <>
                                                                        <Icon name="loader-2" size={20} className="text-[#736357] animate-spin" />
                                                                        <span className="text-sm font-bold text-[#736357]">圖片處理中...</span>
                                                                    </>
                                                                ) : (
                                                                    <>
                                                                        <Icon name="image" size={20} className="text-[#736357]" />
                                                                        <span className="text-sm font-bold text-[#736357]">
                                                                            {formData.vaccine_file ? "更換疫苗手冊照片" : "選擇照片或開啟相機"}
                                                                        </span>
                                                                    </>
                                                                )}
                                                            </label>

                                                            {formData.vaccine_file && !isProcessingImg && (
                                                                <div className="relative w-full aspect-video rounded-2xl overflow-hidden border-2 border-[#736357]/10 shadow-sm">
                                                                        <img src={formData.vaccine_file} className="w-full h-full object-cover" />

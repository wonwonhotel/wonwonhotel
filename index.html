                                            <label className="text-xs font-bold text-slate-400 ml-1">寵物名字 *</label>
                                            <InputWithError 
                                                name="pet_name" 
                                                value={formData.pet_name} 
                                                onChange={e=>handleChange('pet_name', e.target.value)} 
                                                error={errors.pet_name}
                                            />
                                        </div>
                                        <div className="space-y-1.5">
                                            <label className="text-xs font-bold text-slate-400 ml-1">品種 *</label>
                                            <InputWithError 
                                                name="breed" 
                                                value={formData.breed} 
                                                onChange={e=>handleChange('breed', e.target.value)} 
                                                error={errors.breed}
                                            />
                                        </div>
                                        <div className="space-y-1.5">
                                            <label className="text-xs font-bold text-slate-400 ml-1">體重 * (kg)</label>
                                            <InputWithError 
                                                name="weight" 
                                                type="number" 
                                                step="0.1" 
                                                value={formData.weight} 
                                                onChange={e=>handleChange('weight', e.target.value)} 
                                                error={errors.weight}
                                            />
                                        </div>
                                        <div className="space-y-1.5">
                                            <label className="text-xs font-bold text-slate-400 ml-1">年齡 *</label>
                                            <InputWithError 
                                                name="age" 
                                                type="number"   
                                                step="0.1"      
                                                min="0.1"       
                                                value={formData.age} 
                                                onChange={e=>handleChange('age', e.target.value)} 
                                                error={errors.age}
                                            />
                                        </div>
                                        <div className="space-y-2" id="sex">
                                            <label className="text-xs font-bold text-slate-400 ml-1">性別 *</label>
                                            <div className={`flex gap-2 ${errors.sex ? 'group-error' : ''}`}>
                                                {pillBtn('sex', '公', formData.sex==='公')}
                                                {pillBtn('sex', '母', formData.sex==='母')}
                                            </div>
                                            <FieldError message={errors.sex} />
                                        </div>
                                        <div className="space-y-2" id="fix">
                                            <label className="text-xs font-bold text-slate-400 ml-1">結紮 *</label>
                                            <div className={`flex gap-2 ${errors.fix ? 'group-error' : ''}`}>
                                                {pillBtn('fix', '是', formData.fix==='是')}
                                                {pillBtn('fix', '否', formData.fix==='否')}
                                            </div>
                                            <FieldError message={errors.fix} />
                                        </div>
                                    </div>

                                    <div className="md:col-span-2 space-y-8 pt-4 border-t border-[#736357]/10 dark:border-gray-600 mt-4">
                                        <div className="grid md:grid-cols-2 gap-8">
                                            <div className="space-y-3" id="dog_traits">
                                                <label className="text-xs font-bold text-slate-400 ml-1 tracking-wider">親狗程度 (可複選) *</label>
                                                <div className={`flex flex-wrap gap-2 ${errors.dog_traits ? 'group-error' : ''}`}>
                                                    {['有攻擊性','無攻擊性','可與狗朋友們一起玩耍','不能與狗朋友們一起玩耍'].map(v => (
                                                        <button type="button" key={v} onClick={()=>toggleArrayField('dog_traits', v)} className={`pill-button px-4 py-2.5 rounded-xl text-xs font-bold border transition-all ${formData.dog_traits.includes(v) ? 'bg-[#736357] text-white border-[#736357] shadow-md' : 'bg-white dark:bg-gray-700 text-slate-400 border-slate-200 dark:border-gray-600 hover:border-[#F7E7B5] hover:text-[#736357] dark:hover:text-[#F7E7B5]'}`}>{v}</button>
                                                    ))}
                                                </div>
                                                <FieldError message={errors.dog_traits} />
                                            </div>
                                        </div>

                                        <div className="space-y-4" id="chip_status">
                                            <label className="text-xs font-bold text-slate-400 ml-1 tracking-wider">晶片 *</label>
                                            <div className={`flex flex-wrap gap-4 ${errors.chip_status ? 'group-error' : ''}`}>

                                    {isBoarding && (

                                                            <textarea name="barking_detail" value={formData.barking_detail || ''} onChange={e => handleChange('barking_detail', e.target.value)} className={`w-full cute-input rounded-xl px-5 py-3.5 font-bold text-[#736357] dark:text-[#F7E7B5] mt-2 min-h-[80px] text-sm ${errors.barking_detail ? 'input-error' : ''}`} placeholder="什麼情況下會吠叫？" />

                                                        {pillBtn('food_aggr', '會', formData.food_aggr==='會')}
                                                        {pillBtn('food_aggr', '不會', formData.food_aggr==='不會')}

                                                    <FieldError message={errors.food_aggr} />

                                                    <FieldError message={errors.pad_toilet} />
                                                </div>

                                                    <FieldError message={errors.vaccine} />

                                                                        setIsProcessingImg(true);

                                                                        try {
                                                                            const compressedDataUrl = await compressImage(file);
                                                                            setFormData(prev => ({...prev, vaccine_file: compressedDataUrl}));
                                                                            if(errors.vaccine_file) setErrors(prev=>({...prev, vaccine_file:null}));
                                                                            showToast("✅ 圖片上傳並壓縮成功！", "success");
                                                                        } catch (error) {
                                                                            console.error(error);
                                                                            showToast("❌ 圖片處理失敗，請重試");

                                                            <FieldError message={errors.deworm_brand} />
                                                        </div>
                                                    )}
                                                </div>
                                            </div>

                                                <div className={`flex flex-col gap-2.5 pt-1 ${errors.crate_status ? 'group-error' : ''}`}>

                                                    <FieldError message={errors.allergy} />
                                                </div>

                                                            <div className="absolute inset-0 bg-red-100 dark:bg-red-900/30 rounded-lg scale-75 blur-sm group-hover:scale-110 transition-transform"></div>

                                                    </label>

                                                        className={`w-full cute-input rounded-xl px-5 py-3.5 font-bold text-[#736357] dark:text-[#F7E7B5] ${errors.service_type_other ? 'input-error' : ''}`} placeholder="請填寫其他服務項目內容..."
                                                    />
                                                    <FieldError message={errors.service_type_other} />
                                                </div>
                                            )}
                                        </div>
                                        
                                        <div className="space-y-2">

                                                onFocus={(e) => e.target.type = 'time'}

                                            />

                                                    className="text-xs font-bold text-slate-400 underline decoration-dashed ml-1 hover:text-[#736357] dark:hover:text-[#F7E7B5] transition-colors">
                                                    清除時間 (改為另行通知)
                                                </button>
                                            )}
                                            <p className="text-[10px] text-red-500 font-bold italic mt-2.5 ml-1">※ 逾時 30 分鐘以上，將依每小時 $200 加收安親費。</p>
                                        </div>

                                                />
                                            </div>
                                            <FieldError message={errors.service_price} />
                                            <p className="text-[10px] text-slate-400 font-bold italic mt-2.5 ml-1">※ 此金額為基礎報價，若有特殊狀況將另行告知加價。</p>
                                        </div>
                                    </div>
                                </section>
                            )}

                            {/* 4. 法律條款與數位簽署 */}
                            <section className="glass-card p-8 md:p-10 space-y-10 section-highlight">
                                <div className="flex items-center gap-4 border-b border-[#736357]/10 dark:border-gray-600 pb-6">
                                    <div className="w-10 h-10 rounded-full bg-[#736357]/5 dark:bg-gray-700 flex items-center justify-center text-[#736357] dark:text-[#F7E7B5]">
                                        <Icon name="edit-3" size={20}/>
                                    </div>
                                    <h3 className="text-xl font-bold text-[#736357] dark:text-[#F7E7B5]">法律條款與數位簽署</h3>
                                </div>
                                
                                <div className="bg-[#fefcf9] dark:bg-gray-900 rounded-[2.5rem] p-8 md:p-10 space-y-6 border border-slate-100 dark:border-gray-700 shadow-inner">
                                    {isBoarding && (
                                        <div className="space-y-4">
                                            <button type="button" onClick={() => setBoardingOpen(!boardingOpen)} 
                                                className="w-full flex items-center justify-between p-5 bg-white dark:bg-gray-800 rounded-2xl border border-slate-100 dark:border-gray-700 hover:border-[#F7E7B5] transition-all group shadow-sm">
                                                <div className="flex items-center gap-3">
                                                    <div className="w-10 h-10 rounded-xl bg-orange-50 dark:bg-orange-900/30 text-orange-500 flex items-center justify-center group-hover:scale-110 transition-transform">
                                                        <Icon name="file-text" size={20}/>
                                                    </div>
                                                    <span className="font-bold text-[#736357] dark:text-[#F7E7B5]">閱讀完整犬、貓寄養契約條款</span>
                                                </div>
                                                <Icon name={boardingOpen ? "chevron-up" : "chevron-down"} size={20} className="text-slate-400"/>
                                            </button>
                                            {boardingOpen && (
                                                <div className="animate-in fade-in slide-in-from-top-2 duration-300 bg-white dark:bg-gray-800 rounded-2xl border-2 border-[#736357]/10 dark:border-gray-600 shadow-inner p-6 space-y-4">
                                                    <div className="space-y-3 text-sm text-[#736357] dark:text-gray-300 leading-relaxed">
                                                        <p className="font-bold text-base text-[#736357] dark:text-[#F7E7B5] border-b border-[#736357]/10 dark:border-gray-600 pb-3">一、飼主誠實告知義務：</p>
                                                        <p className="pl-2">甲方須於三天前預約住宿。本旅館採不關籠方式，入住前須在本館美容洗澡。須證明已施打疫苗並提供兩位緊急聯絡人。需自備飼料物品。逾時將加收安親費。損壞設施需照價賠償。</p>
                                                        <p className="text-xs text-slate-400 italic pt-2 border-t border-dashed border-slate-200 dark:border-gray-600 mt-4">
                                                            (此為範例條文並非最終版本)
                                                        </p>
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    )}
                                    
                                    <div className="space-y-4">
                                        <button type="button" onClick={() => setGroomingOpen(!groomingOpen)} 
                                            className="w-full flex items-center justify-between p-5 bg-white dark:bg-gray-800 rounded-2xl border border-slate-100 dark:border-gray-700 hover:border-[#F7E7B5] transition-all group shadow-sm">
                                            <div className="flex items-center gap-3">
                                                <div className="w-10 h-10 rounded-xl bg-blue-50 dark:bg-blue-900/30 text-blue-500 flex items-center justify-center group-hover:scale-110 transition-transform">
                                                    <Icon name="file-text" size={20}/>
                                                </div>
                                                <span className="font-bold text-[#736357] dark:text-[#F7E7B5]">閱讀完整犬、貓美容契約條款</span>
                                            </div>
                                            <Icon name={groomingOpen ? "chevron-up" : "chevron-down"} size={20} className="text-slate-400"/>
                                        </button>
                                        {groomingOpen && (
                                            <div className="animate-in fade-in slide-in-from-top-2 duration-300 bg-white dark:bg-gray-800 rounded-2xl border-2 border-[#736357]/10 dark:border-gray-600 shadow-inner p-6 space-y-4">
                                                <div className="space-y-3 text-sm text-[#736357] dark:text-gray-300 leading-relaxed">
                                                    <ul className="list-disc list-inside space-y-2 pl-2">
                                                        <li>特殊病史請事先告知。</li>
                                                        <li>寄生蟲將逕行除蟲，費用由飼主負擔。</li>
                                                        <li>逾時接回將酌收安親託管費。</li>
                                                    </ul>
                                                    <p className="text-xs text-slate-400 italic pt-2 border-t border-dashed border-slate-200 dark:border-gray-600 mt-4">
                                                        (此為範例條文並非最終版本)
                                                    </p>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                    
                                    {/* --- 高風險寵物風險告知 (僅在 8 歲以上顯示) --- */}
                                    {isSenior && (
                                        <div className="space-y-4 animate-in fade-in slide-in-from-top-4 duration-500">
                                            <button type="button" onClick={() => setSeniorOpen(!seniorOpen)} 
                                                className="w-full flex items-center justify-between p-5 bg-red-50 dark:bg-red-900/10 rounded-2xl border-2 border-red-100 dark:border-red-900 hover:border-red-300 transition-all group shadow-sm">
                                                <div className="flex items-center gap-3">
                                                    <div className="w-10 h-10 rounded-xl bg-red-100 dark:bg-red-900/30 text-red-500 flex items-center justify-center group-hover:scale-110 transition-transform">
                                                        <Icon name="alert-triangle" size={20}/>
                                                    </div>
                                                    <div className="flex flex-col text-left">
                                                        <span className="font-black text-red-600 dark:text-red-400">高風險寵物美容服務風險告知</span>
                                                        <span className="text-[10px] text-red-400 font-bold">檢測到毛孩已滿 8 歲，請務必詳閱</span>
                                                    </div>
                                                </div>
                                                <Icon name={seniorOpen ? "chevron-up" : "chevron-down"} size={20} className="text-red-300"/>
                                            </button>
                                            
                                            {seniorOpen && (
                                                <div className="animate-in fade-in slide-in-from-top-2 duration-300 bg-white dark:bg-gray-800 rounded-2xl border-2 border-red-100 dark:border-red-900/50 shadow-inner p-6">
                                                    <div className="h-64 overflow-y-auto pr-2 space-y-4 text-sm text-[#736357] dark:text-gray-300 leading-relaxed scrollbar-thin scrollbar-thumb-gray-300">
                                                        <h4 className="font-bold text-center text-lg mb-4 border-b pb-2 border-slate-100 dark:border-gray-700">【高風險寵物美容服務風險告知暨同意聲明】</h4>
                                                        
                                                        <div className="space-y-2">
                                                            <p className="font-bold text-[#736357] dark:text-[#F7E7B5]">一、飼主誠實告知義務</p>
                                                            <p className="text-xs opacity-80">本人（甲方）確認，已就本人所知悉之寵物年齡、過往病史（如心臟病、癲癇、氣喘、關節問題等）、近期手術或治療紀錄、懷孕狀況、過敏反應，以及行為特性（如咬人紀錄、特定部位敏感、抗拒保定等），向 貴店（乙方）為完整且真實之說明。</p>
                                                            <p className="text-xs opacity-80">如因甲方未告知、未完全告知或提供不實資訊，致乙方於已盡合理專業注意義務之情形下，仍難以預見或防範風險發生者，其相關責任歸屬，雙方同意依實際情形及相關法律規定另行認定。</p>
                                                        </div>

                                                        <div className="space-y-2">
                                                            <p className="font-bold text-[#736357] dark:text-[#F7E7B5]">二、高齡與特殊健康狀況之風險告知</p>
                                                            <p className="text-xs opacity-80">本人知悉，若寵物屬於高齡個體、幼齡犬貓，或患有慢性疾病、潛在或隱性疾病者，其體能、心肺功能及對壓力之耐受度，可能低於一般健康寵物。</p>
                                                            <p className="text-xs opacity-80">於美容過程中之洗澡、吹整、保定或操作，可能因緊張、興奮或身體負荷，誘發身體不適、休克、舊疾復發，甚或發生其他不可預期之風險。</p>
                                                            <p className="text-xs opacity-80">本人已充分理解上述情形，並同意：如經判定該不利結果係源於寵物自身健康狀況或生理反應，且非因乙方之故意或重大過失所致者，乙方不負損害賠償責任。</p>
                                                        </div>

                                                        <div className="space-y-2">
                                                            <p className="font-bold text-[#736357] dark:text-[#F7E7B5]">三、攻擊性與行為安全防護同意</p>
                                                            <p className="text-xs opacity-80">如寵物於服務過程中出現高度緊張、攻擊行為、過度躁動或其他影響人員及寵物安全之情形，本人同意並授權乙方，基於安全考量，採取必要之防護與保定措施（包含但不限於牽繩保定、伊莉莎白頸圈、嘴套或雙人協同作業）。</p>
                                                            <p className="text-xs opacity-80">若經專業判斷認為繼續服務恐危及寵物或人員安全，乙方得隨時中止服務，並依已完成之服務內容與進度計收費用。</p>
                                                        </div>

                                                        <div className="space-y-2">
                                                            <p className="font-bold text-[#736357] dark:text-[#F7E7B5]">四、緊急醫療處置同意</p>
                                                            <p className="text-xs opacity-80">服務期間如寵物發生身體不適或緊急狀況，本人同意乙方得優先將寵物送往本人指定或就近之合適動物醫院進行緊急處置，相關醫療及必要交通費用，由本人依法負擔。</p>
                                                        </div>

                                                        <div className="space-y-2">
                                                            <p className="font-bold text-[#736357] dark:text-[#F7E7B5]">五、飼主確認</p>
                                                            <p className="text-xs opacity-80">本人已詳閱並充分理解上述所有內容，確認已就相關風險獲得說明，並於審慎評估後，同意將寵物交付乙方進行美容服務。</p>
                                                        </div>
                                                    </div>
                                                    <div className="mt-4 pt-4 border-t border-red-100 dark:border-red-900/30 text-center">
                                                        <p className="text-xs text-red-500 font-bold">※ 繼續填寫即代表您已詳閱並同意上述高齡寵物風險條款</p>
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    )}
                                </div>

                                <div className="pt-4">
                                    <label id="legal_agree" className={`flex items-center gap-4 cursor-pointer group bg-white dark:bg-gray-800 p-7 rounded-[2rem] border-2 transition-all shadow-sm hover:shadow-md ${errors.legal_agree ? 'shake-error border-red-500' : 'border-[#736357]/20 dark:border-gray-600 hover:border-[#736357]'}`}>
                                        <div className="relative">
                                            <input type="checkbox" checked={formData.legal_agree} onChange={e=>handleChange('legal_agree', e.target.checked)} className="accent-[#736357] w-8 h-8 cursor-pointer relative z-10" />
                                            <div className="absolute inset-0 bg-[#F7E7B5]/50 rounded-lg scale-75 blur-sm group-hover:scale-110 transition-transform"></div>
                                        </div>
                                        <div className="flex flex-col">
                                            <span className="text-base font-black text-[#736357] dark:text-[#F7E7B5] underline decoration-2 underline-offset-4 tracking-tight">
本人已詳閱並同意以上契約內容。</span>
                                        </div>
                                    </label>
                                    <FieldError message={errors.legal_agree} />
                                </div>

                                {/* 簽名區塊 */}
                                <div className="space-y-4 pt-6 border-t border-[#736357]/10 dark:border-gray-600" id="signature">
                                    <div className="flex items-center justify-between">
                                        <label className="text-sm font-bold text-[#736357] dark:text-[#F7E7B5] flex items-center gap-2">
                                            <Icon name="pen-tool" size={18}/> 數位簽名 *
                                        </label>
                                        {realtimeSig && (
                                            <button type="button" onClick={() => setRealtimeSig(null)} className="text-xs font-bold text-red-400 hover:text-red-500 flex items-center gap-1 transition-colors">
                                                <Icon name="trash-2" size={14}/> 清除簽名
                                            </button>
                                        )}
                                    </div>
                                    
                                    {realtimeSig ? (
                                        <div className="space-y-3">
                                            <div className="bg-white dark:bg-gray-800 rounded-2xl border-2 border-[#736357]/20 dark:border-gray-600 p-6 flex justify-center items-center min-h-[180px] shadow-inner">
                                                <img src={realtimeSig} alt="您的簽名" className="max-h-[150px] object-contain" />
                                            </div>
                                            <div className="flex items-center justify-end gap-3">
                                                <div className="bg-green-100 dark:bg-green-900/30 text-green-600 dark:text-green-400 px-3 py-1.5 rounded-full text-xs font-bold flex items-center gap-1.5">
                                                    <Icon name="check-circle" size={14}/> 已簽署
                                                </div>
                                                <div className="text-xs text-slate-500 dark:text-gray-400 font-bold">
                                                    簽署日期：{new Date().toLocaleString('zh-TW', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: true })}
                                                </div>
                                            </div>
                                        </div>
                                    ) : (
                                        <button type="button" onClick={() => setShowFullSig(true)} 
                                            className={`w-full min-h-[180px] rounded-2xl border-2 border-dashed flex flex-col items-center justify-center gap-3 transition-all group ${errors.signature ? 'border-red-500 bg-red-50/50 dark:bg-red-900/20 shake-error' : 'border-[#736357]/30 dark:border-gray-600 bg-white dark:bg-gray-800 hover:border-[#736357] hover:bg-[#F7E7B5]/10'}`}>
                                            <div className="w-16 h-16 rounded-full bg-[#736357]/5 dark:bg-gray-700 flex items-center justify-center text-[#736357] dark:text-[#F7E7B5] group-hover:scale-110 group-hover:bg-[#F7E7B5]/30 transition-all">
                                                <Icon name="pen-tool" size={28}/>
                                            </div>
                                            <span className="text-sm font-bold text-[#736357] dark:text-[#F7E7B5]">點擊此處開始簽名</span>
                                            <span className="text-xs text-slate-400">將開啟全螢幕簽名板</span>
                                        </button>
                                    )}
                                    <FieldError message={errors.signature} />
                                </div>
                            </section>

                            {/* 提交按鈕 */}
                            <div className="pt-8 pb-16">
                                <button type="button" onClick={handleSubmit} disabled={isSubmitting}
                                    className="w-full py-6 bg-gradient-to-r from-[#736357] to-[#5D4D41] text-white rounded-[2rem] font-black text-xl shadow-2xl shadow-[#736357]/30 hover:shadow-[#736357]/50 hover:scale-[1.02] active:scale-[0.98] transition-all disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-3">
                                    {isSubmitting ? (
                                        <>
                                            <Icon name="loader-2" size={24} className="animate-spin"/>
                                            <span>提交中...</span>
                                        </>
                                    ) : (
                                        <>
                                            <Icon name="send" size={24}/>
                                            <span>確認並提交數位契約</span>
                                        </>
                                    )}
                                </button>
                            </div>
                        </div>
                    </main>

                    {/* 全螢幕簽名板 */}
                    {showFullSig && (
                        <div className="fullscreen-signature bg-white dark:bg-gray-900 flex flex-col">
                            <div className="flex items-center justify-between p-4 bg-[#736357] text-white">
                                <h3 className="font-bold text-base md:text-lg flex items-center gap-2">
                                    <Icon name="pen-tool" size={20}/> 請在下方簽名(建議您保持手機直立簽名即可，不需旋轉手機)
                                </h3>
                                <button type="button" onClick={() => setShowFullSig(false)} className="p-2 hover:bg-white/20 rounded-full transition-colors flex-shrink-0">
                                    <Icon name="x" size={24}/>
                                </button>
                            </div>
                            
                            {/* 按鈕移到畫布上方 - 避免手機底部按鈕被遮擋 */}
                            <div className="p-4 bg-white dark:bg-gray-900 border-b border-slate-200 dark:border-gray-700 flex gap-3">
                                <button type="button" 
                                    onClick={() => {
                                        if (padInstance.current) {
                                            padInstance.current.clear();
                                            const canvas = fullSigCanvasRef.current;
                                            if (canvas) {
                                                const ctx = canvas.getContext('2d');
                                                ctx.fillStyle = "rgb(255, 255, 255)";
                                                ctx.fillRect(0, 0, canvas.width, canvas.height);
                                            }
                                        }
                                    }}
                                    className="flex-1 py-4 bg-slate-100 dark:bg-gray-700 text-[#736357] dark:text-[#F7E7B5] rounded-xl font-bold flex items-center justify-center gap-2 hover:bg-slate-200 dark:hover:bg-gray-600 transition-colors">
                                    <Icon name="eraser" size={20}/> 清除重簽
                                </button>
                                <button type="button" 
                                    onClick={() => {
                                        if (padInstance.current && !padInstance.current.isEmpty()) {
                                            const dataUrl = padInstance.current.toDataURL('image/jpeg', 0.8);
                                            setRealtimeSig(dataUrl);
                                            if(errors.signature) setErrors(prev=>({...prev, signature:null}));
                                            setShowFullSig(false);
                                            showToast("✅ 簽名已儲存", "success");
                                            // 滾動回頁面底部（簽名區塊）
                                            setTimeout(() => {
                                                const signatureEl = document.getElementById('signature');
                                                if (signatureEl) signatureEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                                            }, 100);
                                        } else {
                                            showToast("⚠️ 請先完成簽名");
                                        }
                                    }}
                                    className="flex-[2] py-4 bg-[#736357] text-white rounded-xl font-bold flex items-center justify-center gap-2 hover:bg-[#5D4D41] transition-colors shadow-lg">
                                    <Icon name="check" size={20}/> 確認簽名
                                </button>
                            </div>
                            
                            <div className="flex-1 p-4 bg-slate-100 dark:bg-gray-800">
                                <div className="canvas-container w-full h-full bg-white dark:bg-gray-700 rounded-2xl shadow-inner border-2 border-[#736357]/20 dark:border-gray-600">
                                    <canvas ref={fullSigCanvasRef} className="w-full h-full"></canvas>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>

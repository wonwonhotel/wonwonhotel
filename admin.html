    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Noto+Sans+TC:wght@300;500;700&display=swap');
        
        :root {

<body>
    <div id="root"></div>

    <script type="text/babel">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

        // --- Error Boundary Component (防止白畫面) ---
        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }
            static getDerivedStateFromError(error) {
                return { hasError: true, error };
            }
            componentDidCatch(error, errorInfo) {
                console.error("React Error:", error, errorInfo);
            }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen flex flex-col items-center justify-center p-8 bg-[#f3f4f6] text-center">
                            <div className="bg-white p-8 rounded-2xl shadow-xl max-w-md">
                                <h2 className="text-2xl font-bold text-red-500 mb-4">系統發生錯誤</h2>
                                <p className="text-slate-500 mb-6">顯示畫面時發生預期外的錯誤，請嘗試重新整理。</p>
                                <button onClick={() => window.location.reload()} className="px-6 py-3 bg-[#736357] text-white rounded-xl font-bold shadow-lg">
                                    重新整理頁面
                                </button>
                                <details className="mt-4 text-left text-xs text-slate-400 bg-slate-100 p-2 rounded">
                                    {this.state.error && this.state.error.toString()}
                                </details>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }
        
                // --- Supabase 設定 ---
        const SUPABASE_URL = 'https://fpkzuotxxbsqisgwupix.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_VsAJfSi7Fb3zu_A5Ksm2wA_mAUkDLBs'; 
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // 管理者 Email（支援多管理員）
        const ADMIN_EMAILS = ["wonwonhotel@gmail.com"];
        const ADMIN_EMAIL = ADMIN_EMAILS[0]; // 主要管理員

        // 多管理員權限設定
        const ADMIN_ROLES = {
            'wonwonhotel@gmail.com': {
                role: 'super_admin',
                name: '超級管理員',
                permissions: ['view', 'edit', 'delete', 'export', 'settings', 'logs', 'manage_admins']
            }
            // 可新增更多管理員，例如：
            // 'staff@wonwonhotel.com': {
            //     role: 'staff',
            //     name: '一般員工',
            //     permissions: ['view', 'edit']
            // }
        };

        // 權限定義
        const PERMISSIONS = {
            view: '檢視訂單',
            edit: '編輯訂單',
            delete: '刪除訂單',
            export: '匯出報表',
            settings: '系統設定',
            logs: '查看日誌',
            manage_admins: '管理員管理'
        };

        // Session 過期時間（毫秒）- 30分鐘
        const SESSION_TIMEOUT = 30 * 60 * 1000;

        // Rate Limiting 設定
        const RATE_LIMIT = {
            maxAttempts: 5,
            windowMs: 15 * 60 * 1000 // 15分鐘
        };

        // 服務項目選項
        const SERVICE_OPTIONS = ['住宿＋洗澡', '包月洗澡', '基礎洗澡', '精緻美容', '局部修剪', '寵物安親', '其他項目'];
        const STATUS_OPTIONS = [
            { value: 'pending', label: '待處理', color: 'yellow', icon: '🟡' },
            { value: 'confirmed', label: '已確認', color: 'green', icon: '🟢' },
            { value: 'completed', label: '已完成', color: 'blue', icon: '🔵' },
            { value: 'cancelled', label: '已取消', color: 'red', icon: '🔴' }
        ];

        // --- Utility Functions ---
        const Icon = ({ name, size = 20, className = "" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (window.lucide && iconRef.current) {
                    window.lucide.createIcons({ root: iconRef.current, attrs: { "stroke-width": 2.5, class: className } });
                }
            }, [name, className]);
            return <span ref={iconRef} key={name} className="inline-flex items-center justify-center"><i data-lucide={name} style={{ width: size, height: size }}></i></span>;
        };

        const getServiceLabel = (serviceType) => {
            if (!serviceType) return '';
            if (serviceType.includes('住宿')) return '🏠 住宿＋洗澡';
            return `✂️ ${serviceType}`;
        };

        const formatDate = (dateStr) => {
            if (!dateStr) return '';
            return new Date(dateStr).toLocaleDateString('zh-TW');
        };

        const formatDateTime = (dateStr) => {
            if (!dateStr) return '';
            return new Date(dateStr).toLocaleString('zh-TW');
        };

        // --- Rate Limiting Hook ---
        const useRateLimiter = () => {
            const checkRateLimit = (key) => {
                const stored = localStorage.getItem(`rate_limit_${key}`);
                if (!stored) return { allowed: true, remaining: RATE_LIMIT.maxAttempts };
                
                const data = JSON.parse(stored);
                const now = Date.now();
                
                if (now - data.firstAttempt > RATE_LIMIT.windowMs) {
                    localStorage.removeItem(`rate_limit_${key}`);
                    return { allowed: true, remaining: RATE_LIMIT.maxAttempts };
                }
                
                return { 
                    allowed: data.attempts < RATE_LIMIT.maxAttempts,
                    remaining: RATE_LIMIT.maxAttempts - data.attempts
                };
            };

            const recordAttempt = (key) => {
                const stored = localStorage.getItem(`rate_limit_${key}`);
                const now = Date.now();
                
                if (!stored) {
                    localStorage.setItem(`rate_limit_${key}`, JSON.stringify({ firstAttempt: now, attempts: 1 }));
                } else {
                    const data = JSON.parse(stored);
                    data.attempts++;
                    localStorage.setItem(`rate_limit_${key}`, JSON.stringify(data));
                }
            };

            return { checkRateLimit, recordAttempt };
        };

        // --- Session Management Hook ---
        const useSessionTimeout = (onTimeout) => {
            const timeoutRef = useRef(null);
            const lastActivityRef = useRef(Date.now());

            const resetTimeout = useCallback(() => {
                lastActivityRef.current = Date.now();
                if (timeoutRef.current) clearTimeout(timeoutRef.current);
                timeoutRef.current = setTimeout(() => {
                    onTimeout();
                }, SESSION_TIMEOUT);
            }, [onTimeout]);

            useEffect(() => {
                const events = ['mousedown', 'keydown', 'scroll', 'touchstart'];
                events.forEach(event => window.addEventListener(event, resetTimeout));
                resetTimeout();

                return () => {
                    events.forEach(event => window.removeEventListener(event, resetTimeout));
                    if (timeoutRef.current) clearTimeout(timeoutRef.current);
                };
            }, [resetTimeout]);

            return { resetTimeout };
        };

        // --- Permission Check Hook ---
        const usePermissions = (userEmail) => {
            const adminConfig = ADMIN_ROLES[userEmail] || { role: 'viewer', permissions: ['view'] };
            
            const hasPermission = (permission) => {
                return adminConfig.permissions.includes(permission);
            };
            
            const canView = () => hasPermission('view');
            const canEdit = () => hasPermission('edit');
            const canDelete = () => hasPermission('delete');
            const canExport = () => hasPermission('export');
            const canAccessSettings = () => hasPermission('settings');
            const canViewLogs = () => hasPermission('logs');
            const canManageAdmins = () => hasPermission('manage_admins');
            
            return {
                role: adminConfig.role,
                roleName: adminConfig.name,
                permissions: adminConfig.permissions,
                hasPermission,
                canView,
                canEdit,
                canDelete,
                canExport,
                canAccessSettings,
                canViewLogs,
                canManageAdmins
            };
        };

        // --- Dark Mode Hook ---
        const useDarkMode = () => {
            const [isDark, setIsDark] = useState(() => {
                const saved = localStorage.getItem('darkMode');
                return saved ? JSON.parse(saved) : false;
            });

            useEffect(() => {
                localStorage.setItem('darkMode', JSON.stringify(isDark));
                document.body.classList.toggle('dark', isDark);
            }, [isDark]);

            return [isDark, setIsDark];
        };

        // --- Toast Notification Component ---
        const Toast = ({ message, type = 'info', onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 4000);
                return () => clearTimeout(timer);
            }, [onClose]);

            const bgColors = {
                success: 'bg-green-500',
                error: 'bg-red-500',
                warning: 'bg-yellow-500',
                info: 'bg-blue-500'
            };

            return (
                <div className={`toast-notification ${bgColors[type]} text-white px-6 py-4 rounded-xl shadow-2xl flex items-center gap-3`}>
                    <Icon name={type === 'success' ? 'check-circle' : type === 'error' ? 'x-circle' : type === 'warning' ? 'alert-triangle' : 'info'} size={20} />
                    <span className="font-bold">{message}</span>
                    <button onClick={onClose} className="ml-2 hover:opacity-70"><Icon name="x" size={16} /></button>
                </div>
            );
        };

        // --- Skeleton Loading Component ---
        const SkeletonCard = () => (
            <div className="bg-white dark:bg-gray-700 p-4 rounded-2xl shadow-sm border border-slate-100 dark:border-gray-600 space-y-3">
                <div className="skeleton h-4 w-3/4 rounded"></div>
                <div className="skeleton h-3 w-1/2 rounded"></div>
                <div className="skeleton h-3 w-2/3 rounded"></div>
            </div>
        );

        const SkeletonTable = () => (
            <div className="space-y-3 p-4">
                {[1,2,3,4,5].map(i => (
                    <div key={i} className="flex gap-4">
                        <div className="skeleton h-12 w-24 rounded"></div>
                        <div className="skeleton h-12 flex-1 rounded"></div>
                        <div className="skeleton h-12 w-32 rounded"></div>
                        <div className="skeleton h-12 w-20 rounded"></div>
                    </div>
                ))}
            </div>
        );

        // --- Change Password Modal ---
        const ChangePasswordModal = ({ isOpen, onClose, showToast }) => {
            const [oldPassword, setOldPassword] = useState('');
            const [newPassword, setNewPassword] = useState('');
            const [confirmPassword, setConfirmPassword] = useState('');
            const [isLoading, setIsLoading] = useState(false);

            useEffect(() => {
                if (!isOpen) {
                    setOldPassword(''); setNewPassword(''); setConfirmPassword('');
                }
            }, [isOpen]);

            const handleUpdatePassword = async () => {
                if (!oldPassword) { showToast('請輸入目前的舊密碼', 'error'); return; }
                if (newPassword.length < 6) { showToast('新密碼長度至少需 6 個字元', 'error'); return; }
                if (newPassword !== confirmPassword) { showToast('兩次輸入的新密碼不相符', 'error'); return; }
                
                setIsLoading(true);
                try {
                    const { error: signInError } = await supabase.auth.signInWithPassword({ email: ADMIN_EMAIL, password: oldPassword });
                    if (signInError) throw new Error("舊密碼輸入錯誤");

                    const { error: updateError } = await supabase.auth.updateUser({ password: newPassword });
                    if (updateError) throw updateError;
                    
                    showToast('密碼修改成功！', 'success');
                    setTimeout(onClose, 1500);
                } catch (error) {
                    showToast(error.message || '修改失敗', 'error');
                } finally {
                    setIsLoading(false);
                }
            };

            if (!isOpen) return null;

            return (
                <div className="fixed inset-0 z-[70] flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm fade-in">
                    <div className="bg-white dark:bg-gray-800 w-full max-w-sm rounded-2xl shadow-2xl p-6 space-y-4">
                        <div className="text-center">
                            <h3 className="text-lg font-black text-slate-700 dark:text-white">變更管理密碼</h3>
                        </div>
                        <div className="space-y-4">
                            <input type="password" value={oldPassword} onChange={(e) => setOldPassword(e.target.value)} className="w-full edit-input py-3" placeholder="輸入舊密碼" />
                            <hr className="border-dashed border-slate-200 dark:border-gray-600" />
                            <input type="password" value={newPassword} onChange={(e) => setNewPassword(e.target.value)} className="w-full edit-input py-3" placeholder="新密碼 (至少6位)" />
                            <input type="password" value={confirmPassword} onChange={(e) => setConfirmPassword(e.target.value)} className="w-full edit-input py-3" placeholder="確認新密碼" />
                        </div>
                        <div className="flex gap-3 pt-2">
                            <button onClick={onClose} className="flex-1 py-3 rounded-xl bg-slate-100 dark:bg-gray-700 text-slate-600 dark:text-gray-300 font-bold hover:bg-slate-200 dark:hover:bg-gray-600 transition-all">取消</button>
                            <button onClick={handleUpdatePassword} disabled={isLoading} className="flex-1 py-3 rounded-xl bg-brand-brown text-white font-bold hover:bg-brand-dark-brown disabled:opacity-50 transition-all flex items-center justify-center gap-2">
                                {isLoading ? <Icon name="loader-2" className="animate-spin" /> : '確認修改'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- Confirm Modal ---
        const ConfirmModal = ({ isOpen, onClose, onConfirm, title, loading }) => {
            const [confirmPassword, setConfirmPassword] = useState('');
            useEffect(() => { if (!isOpen) setConfirmPassword(''); }, [isOpen]);
            if (!isOpen) return null;

            return (
                <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm fade-in">
                    <div className="bg-white dark:bg-gray-800 w-full max-w-sm rounded-2xl shadow-2xl p-6 space-y-4">
                        <div className="text-center">
                            <div className="w-12 h-12 bg-yellow-100 dark:bg-yellow-900 text-yellow-600 rounded-full flex items-center justify-center mx-auto mb-3"><Icon name="lock" size={24} /></div>
                            <h3 className="text-lg font-black text-slate-700 dark:text-white">{title}</h3>
                            <p className="text-sm text-slate-500 dark:text-gray-400 mt-1">此為敏感操作，請輸入管理密碼以確認。</p>
                        </div>
                        <input type="password" placeholder="請輸入密碼" value={confirmPassword} onChange={(e) => setConfirmPassword(e.target.value)} className="w-full text-center py-3 border-2 border-slate-200 dark:border-gray-600 rounded-xl focus:border-brand-brown outline-none font-bold bg-white dark:bg-gray-700 dark:text-white" autoFocus />
                        <div className="flex gap-3 pt-2">
                            <button onClick={onClose} className="flex-1 py-3 rounded-xl bg-slate-100 dark:bg-gray-700 text-slate-600 dark:text-gray-300 font-bold hover:bg-slate-200 dark:hover:bg-gray-600 transition-all">取消</button>
                            <button onClick={() => onConfirm(confirmPassword)} disabled={loading || !confirmPassword} className="flex-1 py-3 rounded-xl bg-brand-brown text-white font-bold hover:bg-brand-dark-brown disabled:opacity-50 transition-all flex items-center justify-center gap-2">
                                {loading ? <Icon name="loader-2" className="animate-spin" /> : '確認執行'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- Calendar View Component ---
        const CalendarView = ({ bookings, onSelectBooking }) => {
            const [currentDate, setCurrentDate] = useState(new Date());
            
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const startDay = firstDay.getDay();
            const daysInMonth = lastDay.getDate();
            
            const days = [];
            for (let i = 0; i < startDay; i++) days.push(null);
            for (let i = 1; i <= daysInMonth; i++) days.push(i);
            
            const getBookingsForDay = (day) => {
                if (!day) return [];
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                return bookings.filter(b => {
                    if (b.checkin_date && b.checkout_date) {
                        return dateStr >= b.checkin_date && dateStr <= b.checkout_date;
                    }
                    return b.created_at?.startsWith(dateStr);
                });
            };

            const prevMonth = () => setCurrentDate(new Date(year, month - 1, 1));
            const nextMonth = () => setCurrentDate(new Date(year, month + 1, 1));
            const goToday = () => setCurrentDate(new Date());

            return (

                    <div className="grid grid-cols-7 border-b border-slate-100 dark:border-gray-700">

        // --- Dashboard Charts Component ---
        const DashboardCharts = ({ bookings }) => {
            const chartRef1 = useRef(null);
            const chartRef2 = useRef(null);
            const chart1Instance = useRef(null);
            const chart2Instance = useRef(null);

useEffect(() => {
                // 安全檢查：確保 Canvas 存在且有資料才繪製
                if (!bookings || bookings.length === 0 || !chartRef1.current || !chartRef2.current) return;

                // Monthly trend chart
                const monthlyData = {};
                bookings.forEach(b => {
                    const month = b.created_at?.substring(0, 7);
                    if (month) {
                        monthlyData[month] = (monthlyData[month] || 0) + 1;
                    }
                });

                const sortedMonths = Object.keys(monthlyData).sort().slice(-6);
                
                if (chart1Instance.current) chart1Instance.current.destroy();
                if (chartRef1.current) {
                    chart1Instance.current = new Chart(chartRef1.current, {
                        type: 'line',
                        data: {
                            labels: sortedMonths.map(m => m.replace('-', '/')),
                            datasets: [{
                                label: '訂單數',
                                data: sortedMonths.map(m => monthlyData[m]),
                                borderColor: '#736357',
                                backgroundColor: 'rgba(115, 99, 87, 0.1)',
                                fill: true,
                                tension: 0.4
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: { legend: { display: false } }
                        }
                    });
                }

                // Service type distribution
                const serviceData = {};
                bookings.forEach(b => {
                    const type = b.service_type?.includes('住宿') ? '住宿' : (b.service_type || '其他');
                    serviceData[type] = (serviceData[type] || 0) + 1;
                });

                if (chart2Instance.current) chart2Instance.current.destroy();
                if (chartRef2.current) {
                    chart2Instance.current = new Chart(chartRef2.current, {
                        type: 'doughnut',
                        data: {
                            labels: Object.keys(serviceData),
                            datasets: [{
                                data: Object.values(serviceData),
                                backgroundColor: ['#F7E7B5', '#736357', '#06C755', '#3b82f6', '#ef4444', '#8b5cf6']

                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: { legend: { position: 'bottom' } }
                        }
                    });
                }

                return () => {
                    if (chart1Instance.current) chart1Instance.current.destroy();
                    if (chart2Instance.current) chart2Instance.current.destroy();
                };
            }, [bookings]);

return (

        // --- Customer CRM Component ---
        const CustomerCRM = ({ bookings, onSelectBooking }) => {

<div className="text-right">

        // --- Activity Log Component ---
        const ActivityLog = ({ logs }) => (
            <div className="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-slate-100 dark:border-gray-700 overflow-hidden">
                <div className="p-4 border-b border-slate-100 dark:border-gray-700 bg-slate-50 dark:bg-gray-900 flex items-center gap-3">
                    <Icon name="activity" size={20} className="text-brand-brown" />
                    <h3 className="font-bold text-slate-700 dark:text-white">操作日誌</h3>
                </div>
                <div className="max-h-64 overflow-y-auto">

                                <div className="flex justify-between">

                                    <span className="text-xs text-slate-400">{formatDateTime(log.timestamp)}</span>

                    )}
                </div>
            </div>
        );

// --- Export Functions ---
        const exportToExcel = (bookings, filename = 'bookings') => {
            const data = bookings.map(b => ({
                '訂單編號': b.id,
                '建立時間': formatDateTime(b.created_at),
                '飼主姓名': b.owner_name,

                '服務項目': b.service_type,

        const exportToPDF = (bookings) => {
            const { jsPDF } = window.jspdf;

            doc.setFont('helvetica', 'bold');
            doc.setFontSize(16);

            doc.setFontSize(10);
            doc.text(`匯出時間: ${formatDateTime(new Date())}`, 20, 30);
            doc.text(`總筆數: ${bookings.length}`, 20, 36);
            
            let y = 50;

            bookings.slice(0, 30).forEach((b, idx) => {
                if (y > 280) {

                doc.text(`#${b.id} | ${b.owner_name} | ${b.pet_name} | ${b.service_type} | $${b.service_price}`, 20, y);
                y += 6;
            });
            
            doc.save(`bookings_${new Date().toISOString().split('T')[0]}.pdf`);
        };

        // --- Detail Item Component (moved outside App) ---
        const DetailItem = ({ label, value, fieldName, fullWidth = false, isMultiline = false, isEditing, editForm, handleEditChange }) => {
            if (isEditing && fieldName) {
                const editVal = Array.isArray(editForm[fieldName]) ? editForm[fieldName].join(',') : (editForm[fieldName] || '');
                return (
                    <div className={`${fullWidth ? 'col-span-2' : ''} bg-white dark:bg-gray-700 p-3 rounded-xl border-2 border-brand-yellow/50`}>
                        <label className="text-[10px] font-bold text-slate-400 uppercase block mb-1">{label}</label>
                        {isMultiline ? (
                            <textarea className="edit-input h-24" value={editVal} onChange={e => handleEditChange(fieldName, e.target.value)} />
                        ) : (
                            <input type={fieldName.includes('date') ? 'date' : 'text'} className="edit-input" value={editVal} onChange={e => handleEditChange(fieldName, e.target.value)} />
                        )}
                    </div>
                );

                                            !hasMore
                                                ? 'bg-slate-100 dark:bg-gray-700 text-slate-300 dark:text-gray-500 cursor-not-allowed'
                                                : 'bg-white dark:bg-gray-700 text-slate-600 dark:text-gray-300 border border-slate-200 dark:border-gray-600 hover:bg-slate-50 dark:hover:bg-gray-600'
                                        }`}
                                    >
                                        ›
                                    </button>
                                    <button
                                        onClick={() => { if (hasMore) fetchBookings(totalPages - 1, false, pageSize); }}
                                        disabled={!hasMore}
                                        className={`px-2.5 py-1.5 rounded-lg text-xs font-bold transition-all ${
                                            !hasMore
                                                ? 'bg-slate-100 dark:bg-gray-700 text-slate-300 dark:text-gray-500 cursor-not-allowed'
                                                : 'bg-white dark:bg-gray-700 text-slate-600 dark:text-gray-300 border border-slate-200 dark:border-gray-600 hover:bg-slate-50 dark:hover:bg-gray-600'
                                        }`}
                                    >
                                        ⟫
                                    </button>
                                </div>

                                {/* 右側：每頁筆數 + 跳轉 */}
                                <div className="flex items-center gap-3">
                                    <select
                                        value={pageSize}
                                        onChange={(e) => {
                                            const newSize = parseInt(e.target.value);
                                            setPageSize(newSize);
                                            fetchBookings(0, true, newSize);
                                        }}
                                        className="px-3 py-1.5 rounded-lg border border-slate-200 dark:border-gray-600 bg-white dark:bg-gray-700 text-xs font-bold focus:outline-none focus:ring-2 focus:ring-brand-brown/30"
                                    >
                                        <option value="10">每頁 10 筆</option>
                                        <option value="20">每頁 20 筆</option>
                                        <option value="50">每頁 50 筆</option>
                                        <option value="100">每頁 100 筆</option>
                                    </select>

                                    <div className="flex items-center gap-1.5 bg-slate-50 dark:bg-gray-700/60 px-3 py-1.5 rounded-lg border border-slate-200 dark:border-gray-600">
                                        <span className="text-xs text-slate-500 font-medium whitespace-nowrap">跳至第</span>
                                        <input
                                            type="number"
                                            min="1"
                                            max={totalPages || 1}
                                            className="w-12 px-1 py-0.5 rounded bg-transparent text-xs font-bold text-center focus:outline-none"
                                            placeholder="頁"
                                            onKeyDown={(e) => {
                                                if (e.key === 'Enter') {
                                                    const val = parseInt(e.target.value);
                                                    if (val >= 1 && val <= (totalPages || 1)) {
                                                        fetchBookings(val - 1, false, pageSize);
                                                    }
                                                    e.target.value = '';
                                                }
                                            }}
                                        />
                                        <span className="text-xs text-slate-500 font-medium whitespace-nowrap">頁</span>
                                    </div>
                                    <span className="text-[10px] text-slate-400">(共 {totalPages || 1} 頁)</span>
                                </div>
                            </div>
                        </div>
                    );
                })()}
            </div>
        )}
    </>
)}

{activeTab === 'dashboard' && (

>
  <Icon name="x" size={18} />
</button>
                                            </>
                                        )}
                                    </div>
                                </div>
                                
                                {/* 內容區域省略，與原檔一致，僅確保權限控制正確 */}
<div className="flex-1 overflow-y-auto p-4 md:p-6 bg-[#fbf9f6]">

<div className="detail-card">

                                                    <DetailItem label="地址" value={selectedBooking.raw_data?.address} fieldName="address" fullWidth isEditing={isEditing} editForm={editForm} handleEditChange={handleEditChange} />
                                                    <DetailItem label="緊急聯絡人" value={selectedBooking.raw_data?.emergency_name} fieldName="emergency_name" isEditing={isEditing} editForm={editForm} handleEditChange={handleEditChange} />

    {/* ✅ 共用欄位 */}
                                         <div className="mt-4 space-y-3">

{selectedBooking.signature_url && (

)}
{/* Admin Notes - 店家內部備註 (開放員工編輯) - Desktop Only */}
<div className="hidden lg:block detail-card detail-note">

                                                        </button>

                                                    className="w-full edit-input h-24 text-sm focus:ring-2 focus:ring-purple-200"

                                                <p className="text-[10px] text-slate-300 mt-1 text-right">修改後請按上方按鈕儲存</p>

                                            {/* 狀態變更記錄 */}
<div className="detail-card detail-history">

                                                        selectedBooking.raw_data.status_history.map((h, idx) => (
                                                            <div key={idx} className="flex items-start gap-3 text-xs">
                                                                <div className="w-2 h-2 rounded-full bg-brand-brown mt-1.5 shrink-0"></div>
                                                                <div className="flex-1">
                                                                    <div className="font-bold text-slate-700 dark:text-white">
                                                                        {STATUS_OPTIONS.find(s => s.value === h.from)?.label || '新建'} → {STATUS_OPTIONS.find(s => s.value === h.to)?.label}
                                                                    </div>
                                                                    <div className="text-slate-400">{formatDateTime(h.changed_at)}</div>
                                                                </div>
                                                            </div>
                                                        ))
                                                    ) : (
                                                        <div className="text-center text-slate-400 text-xs py-4">
                                                            <div className="flex items-start gap-3">

                                                                <div className="flex-1 text-left">

                                                                    <div className="text-slate-400">{formatDateTime(selectedBooking.created_at)}</div>
                                                                </div>
                                                            </div>
                                                        </div>

                                            {/* Delete button - 只有擁有刪除權限才顯示 */}

                                                    <Icon name="trash-2" size={16}/> 刪除此訂單

                            <PrintContract data={selectedBooking} />

                    )}

<ChangePasswordModal isOpen={showPasswordModal} onClose={() => setShowPasswordModal(false)} showToast={showToast} currentUserEmail={session?.user?.email} />
                    <ConfirmModal isOpen={showConfirm} onClose={() => setShowConfirm(false)} onConfirm={executeAction} title={confirmAction === 'delete' ? '刪除確認' : '儲存變更確認'} loading={actionLoading} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <ErrorBoundary>
                <App />
            </ErrorBoundary>
        );
    </script>
<script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', async () => {
                try {
                    // ✅ 每次更新只改這個數字！
                    const VERSION = '7';  // ✅ 改成新版本號
                    
                    const registration = await navigator.serviceWorker.register(`./sw-admin.js?v=${VERSION}`);
                    console.log('Admin Service Worker 註冊成功');

                    let updateToast = null;

                    // ✅ 檢查是否有新版本
                    registration.addEventListener('updatefound', () => {
                        const newWorker = registration.installing;
                        newWorker.addEventListener('statechange', () => {
                            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                console.log(`📢 管理後台有新版本 (v${VERSION}) 可用`);

                                if (updateToast) return;

                                // ✅ 現代化更新提示（後台版本）
                                updateToast = document.createElement('div');
                                updateToast.style.cssText = `
                                    position: fixed;
                                    bottom: 28px;
                                    left: 50%;
                                    transform: translateX(-50%);
                                    background: #ffffff;
                                    border-radius: 16px;
                                    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15), 0 0 0 1px rgba(0, 0, 0, 0.03);
                                    z-index: 9999;
                                    padding: 0;
                                    animation: toastSlideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
                                    max-width: 440px;
                                    width: calc(100% - 32px);
                                    overflow: hidden;
                                `;
                                updateToast.innerHTML = `
                                    <div style="display:flex;align-items:stretch;gap:0;position:relative;">
                                        <!-- 左側彩色條 -->
                                        <div style="width:4px;background:linear-gradient(180deg,#F7E7B5,#736357);flex-shrink:0;"></div>
                                        
                                        <!-- 主要內容 -->
                                        <div style="flex:1;padding:16px 20px;display:flex;align-items:center;gap:14px;">
<!-- 圖示 -->
<div style="width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#F7E7B5,#e8d4a0);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 12px rgba(247,231,181,0.3);">
    <i data-lucide="cloud-download" style="width:22px;height:22px;stroke:#5D4D41;stroke-width:2.5;"></i>
</div>
                                            
                                            <!-- 文字 -->
                                            <div style="flex:1;min-width:0;">
                                                <div style="font-weight:700;font-size:15px;color:#1a1a1a;letter-spacing:-0.2px;line-height:1.3;">管理後台有新版本</div>
                                                <div style="font-size:13px;color:#8b8b8b;font-weight:400;line-height:1.4;">點擊按鈕立即更新體驗</div>
                                            </div>
                                            
                                            <!-- 按鈕組 -->
                                            <div style="display:flex;align-items:center;gap:6px;flex-shrink:0;">
                                                <button style="background:#736357;color:white;border:none;padding:8px 18px;border-radius:10px;font-weight:600;font-size:13px;cursor:pointer;transition:all 0.25s cubic-bezier(0.16, 1, 0.3, 1);box-shadow:0 4px 16px rgba(115,99,87,0.25);white-space:nowrap;">更新</button>
                                                <button style="background:transparent;color:#c5c5c5;border:none;width:32px;height:32px;border-radius:50%;cursor:pointer;transition:all 0.25s;display:flex;align-items:center;justify-content:center;font-size:18px;padding:0;">✕</button>
                                            </div>
                                        </div>
                                    </div>
                                `;
document.body.appendChild(updateToast);

// ✅ 手動觸發 Lucide 渲染圖示
if (window.lucide) {
    window.lucide.createIcons({
        root: updateToast,
        attrs: { "stroke-width": 2.5 }
    });
}

// ✅ 動畫樣式
const styleSheet = document.createElement('style');
styleSheet.textContent = `
    @keyframes toastSlideUp {
        from { opacity: 0; transform: translateX(-50%) translateY(30px) scale(0.92); }
        to { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
    }
    @keyframes toastSlideDown {
        from { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
        to { opacity: 0; transform: translateX(-50%) translateY(30px) scale(0.92); }
    }
    .admin-toast-btn:hover {
        transform: scale(1.04);
        background: #5D4D41 !important;
        box-shadow: 0 6px 24px rgba(115,99,87,0.35) !important;
    }
    .admin-toast-close:hover {
        background: #f3f4f6 !important;
        color: #6b7280 !important;
    }
    .admin-toast-close:active {
        transform: scale(0.9);
    }
    .admin-toast-btn:active {
        transform: scale(0.95);
    }
`;
document.head.appendChild(styleSheet);

                                // 設定按鈕樣式
                                const btns = updateToast.querySelectorAll('button');
                                btns[0].className = 'admin-toast-btn';
                                btns[1].className = 'admin-toast-close';

                                // 點擊「更新」按鈕
                                btns[0].addEventListener('click', () => {
                                    updateToast.style.animation = 'toastSlideDown 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards';
                                    setTimeout(() => {
                                        if (updateToast) {
                                            updateToast.remove();
                                            updateToast = null;
                                        }
                                    }, 400);
                                    newWorker.postMessage({ type: 'SKIP_WAITING' });
                                    setTimeout(() => window.location.reload(), 500);
                                });

                                // 點擊關閉按鈕
                                btns[1].addEventListener('click', () => {
                                    updateToast.style.animation = 'toastSlideDown 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards';
                                    setTimeout(() => {
                                        if (updateToast) {
                                            updateToast.remove();
                                            updateToast = null;
                                        }
                                    }, 350);
                                });

                                // 10分鐘後自動消失
                                setTimeout(() => {
                                    if (updateToast) {
                                        updateToast.style.animation = 'toastSlideDown 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards';
                                        setTimeout(() => {
                                            if (updateToast) {
                                                updateToast.remove();
                                                updateToast = null;
                                            }
                                        }, 400);
                                    }
                                }, 600000);
                            }
                        });
                    });

                    // ✅ 移除自動重整機制，讓用戶透過按鈕控制

                } catch (error) {
                    console.error('Admin Service Worker 註冊失敗:', error);
                }
            });
        }
    </script>
</body>

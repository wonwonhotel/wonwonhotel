            if (!value || value === '無' || (Array.isArray(value) && value.length === 0)) return null;
            return (
                <div className={`${fullWidth ? 'col-span-2' : ''} bg-slate-50 dark:bg-gray-700 p-3 rounded-xl border border-slate-100 dark:border-gray-600`}>
                    <label className="text-[10px] font-bold text-slate-400 uppercase block mb-1">{label}</label>
                    <div className="font-bold text-brand-brown dark:text-brand-yellow text-sm break-words">
                        {Array.isArray(value) ? value.join(', ') : value}
                    </div>
                </div>
            );
        };

        // --- Print Contract Component ---
        const PrintContract = ({ data }) => {
            if (!data) return null;
            const r = data.raw_data || {};
            const isBoarding = !!data.checkin_date || (data.service_type && data.service_type.includes('住宿'));
            
            return (
                <div id="print-area" className="hidden">
                    <div className="max-w-[210mm] mx-auto space-y-4 p-4">
                        <div className="flex justify-between items-center border-b-2 border-black pb-2 mb-4">
                            <h1 className="text-2xl font-black">汪汪犬旅 | 服務契約書</h1>
                            <div className="text-right text-xs">
                                <p>單號：#{data.id}</p>
                                <p>填表日期：{formatDate(data.created_at)}</p>
                            </div>
                        </div>
                        <div className="grid grid-cols-2 gap-4">
                            <div className="space-y-1 border p-2 rounded">
                                <h3 className="font-bold border-b pb-1 mb-1">甲方 (飼主資料)</h3>
                                <p><strong>姓名:</strong> {data.owner_name}</p>
                                <p><strong>電話:</strong> {data.phone}</p>
                                <p><strong>身分證:</strong> {r.owner_id}</p>
                                <p><strong>地址:</strong> {r.address}</p>
                                <p><strong>Email:</strong> {r.email}</p>
                                <p><strong>緊急聯絡:</strong> {r.emergency_name} ({r.emergency_phone})</p>
                            </div>
                            <div className="space-y-1 border p-2 rounded">
                                <h3 className="font-bold border-b pb-1 mb-1">乙方 (寵物資料)</h3>
                                <p><strong>名字:</strong> {data.pet_name}</p>
                                <p><strong>品種:</strong> {r.breed}</p>
                                <p><strong>性別/結紮:</strong> {r.sex} / {r.fix}</p>
                                <p><strong>年齡/體重:</strong> {r.age} / {r.weight} kg</p>
                                <p><strong>晶片:</strong> {r.chip_status} {r.chip_id ? `(${r.chip_id})` : ''}</p>
                            </div>
                        </div>
                        <div className="border-2 border-black p-3 rounded mt-2">
                            <h3 className="font-bold text-sm mb-2">服務內容確認</h3>
                            <p><strong>項目:</strong> {getServiceLabel(data.service_type)}</p>
                            <p><strong>金額:</strong> NT$ {data.service_price}</p>
                            {isBoarding && (
                                <>
                                    <p><strong>入住:</strong> {data.checkin_date}</p>
                                    <p><strong>退房:</strong> {data.checkout_date}</p>
                                </>
                            )}
                        </div>
                        <div className="mt-4 pt-2 border-t-2 border-black">
                            <p className="text-xs mb-2">本人已詳閱並同意本館之服務條款，確認上述填寫資料屬實無誤。</p>
                            <div className="flex justify-between items-end mt-4">
                                <div className="w-1/2">
                                    <p className="font-bold mb-1">飼主簽署：</p>
                                    {data.signature_url ? <img src={data.signature_url} className="h-16 object-contain border-b border-dashed border-gray-400 w-full" /> : <div className="h-16 border-b border-dashed border-gray-400 w-full"></div>}
                                </div>
                                <div className="text-right"><p className="text-xs">簽署時間：{formatDateTime(data.created_at)}</p></div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- Main App Component ---
        const App = () => {
            const [session, setSession] = useState(null);
            const [loading, setLoading] = useState(true);
            const [dataLoading, setDataLoading] = useState(false);
            const [password, setPassword] = useState('');
            const [loginError, setLoginError] = useState('');
            
            const [bookings, setBookings] = useState([]);
            const [selectedBooking, setSelectedBooking] = useState(null);
            const [selectedBookings, setSelectedBookings] = useState(new Set());
            
            // Filters
            const [searchFilter, setSearchFilter] = useState('');
            const [statusFilter, setStatusFilter] = useState('all');
            const [serviceFilter, setServiceFilter] = useState('all');
            const [dateFrom, setDateFrom] = useState('');
            const [dateTo, setDateTo] = useState('');
            
            // View mode
            const [viewMode, setViewMode] = useState('list'); // list, calendar, crm
            const [activeTab, setActiveTab] = useState('orders'); // orders, dashboard, logs
            
            // Edit mode
            const [isEditing, setIsEditing] = useState(false);
            const [editForm, setEditForm] = useState({});
            
            // Modals
            const [showConfirm, setShowConfirm] = useState(false);
            const [confirmAction, setConfirmAction] = useState(null);
            const [actionLoading, setActionLoading] = useState(false);
            const [showPasswordModal, setShowPasswordModal] = useState(false);
            
            // Toast
            const [toast, setToast] = useState(null);
            
            // Activity logs
            const [activityLogs, setActivityLogs] = useState([]);
            
            // Dark mode
            const [isDark, setIsDark] = useDarkMode();
            
            // Rate limiter
            const { checkRateLimit, recordAttempt } = useRateLimiter();

            // Show toast helper
            const showToast = (message, type = 'info') => setToast({ message, type });

            // Session timeout handler
            const handleSessionTimeout = useCallback(async () => {
                showToast('Session 已過期，請重新登入', 'warning');
                await supabase.auth.signOut();
                setSession(null);
            }, []);

            useSessionTimeout(session ? handleSessionTimeout : () => {});

            // Add activity log
            const addLog = (action, details) => {
                const newLog = { action, details, timestamp: new Date().toISOString() };
                setActivityLogs(prev => [newLog, ...prev].slice(0, 100));
                localStorage.setItem('activity_logs', JSON.stringify([newLog, ...activityLogs].slice(0, 100)));
            };

            // Load activity logs from localStorage
            useEffect(() => {
                const saved = localStorage.getItem('activity_logs');
                if (saved) setActivityLogs(JSON.parse(saved));
            }, []);

            // Auth effect
            useEffect(() => {
                supabase.auth.getSession().then(({ data: { session } }) => {
                    setSession(session);
                    if(session) fetchBookings();
                    setLoading(false);
                });
                const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
                    setSession(session);
                    if(session) fetchBookings();
                });
                return () => subscription.unsubscribe();
            }, []);

            // Realtime subscription
            useEffect(() => {
                if (!session) return;

                const channel = supabase
                    .channel('bookings-changes')
                    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'bookings' }, (payload) => {
                        setBookings(prev => [payload.new, ...prev]);
                        showToast(`🎉 新訂單！${payload.new.pet_name} - ${payload.new.owner_name}`, 'success');
                        addLog('新訂單', `#${payload.new.id} ${payload.new.pet_name}`);
                    })
                    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'bookings' }, (payload) => {
                        setBookings(prev => prev.map(b => b.id === payload.new.id ? payload.new : b));
                    })
                    .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'bookings' }, (payload) => {
                        setBookings(prev => prev.filter(b => b.id !== payload.old.id));
                    })
                    .subscribe();

                return () => { supabase.removeChannel(channel); };
            }, [session]);

            const handleLogin = async (e) => {
                e.preventDefault();
                
                const rateCheck = checkRateLimit('login');
                if (!rateCheck.allowed) {
                    setLoginError(`登入嘗試次數過多，請 15 分鐘後再試`);
                    return;
                }
                
                setLoading(true);
                setLoginError('');
                recordAttempt('login');
                
                const { error } = await supabase.auth.signInWithPassword({ email: ADMIN_EMAIL, password: password });
                if (error) { 
                    setLoginError(`密碼錯誤 (剩餘 ${rateCheck.remaining - 1} 次嘗試)`); 
                    setLoading(false); 
                } else {
                    addLog('登入', '管理員登入成功');
                }
            };

            const handleLogout = async () => {
                addLog('登出', '管理員登出');
                await supabase.auth.signOut();
                window.location.href = 'index.html';
            };

            const fetchBookings = async () => {
                setDataLoading(true);
                const { data, error } = await supabase.from('bookings').select('*').order('created_at', { ascending: false });
                if (!error) setBookings(data);
                setDataLoading(false);
            };

            // Stats calculation
            const stats = useMemo(() => {
                const today = new Date().toISOString().split('T')[0];
                return {
                    today: bookings.filter(b => b.created_at?.startsWith(today)).length,
                    pending: bookings.filter(b => b.status === 'pending').length,
                    boarding: bookings.filter(b => b.service_type?.includes('住宿')).length,
                    total: bookings.length,
                    revenue: bookings.reduce((sum, b) => sum + (parseInt(b.service_price) || 0), 0)
                };
            }, [bookings]);

            // Filtered bookings
            const filteredBookings = useMemo(() => {
                return bookings.filter(b => {
                    // Search filter
                    if (searchFilter && !(
                        b.owner_name?.includes(searchFilter) || 
                        b.pet_name?.includes(searchFilter) || 
                        b.phone?.includes(searchFilter)
                    )) return false;
                    
                    // Status filter
                    if (statusFilter !== 'all' && b.status !== statusFilter) return false;
                    
                    // Service filter
                    if (serviceFilter !== 'all') {
                        if (serviceFilter === 'boarding' && !b.service_type?.includes('住宿')) return false;
                        if (serviceFilter === 'grooming' && b.service_type?.includes('住宿')) return false;
                    }
                    
                    // Date filter
                    if (dateFrom && b.created_at < dateFrom) return false;
                    if (dateTo && b.created_at > dateTo + 'T23:59:59') return false;
                    
                    return true;
                });
            }, [bookings, searchFilter, statusFilter, serviceFilter, dateFrom, dateTo]);

            const updateStatus = async (id, newStatus) => {
                // 取得當前訂單資料
                const currentBooking = bookings.find(b => b.id === id);
                const oldStatus = currentBooking?.status || 'pending';
                
                // 如果狀態沒有變化，不執行更新
                if (oldStatus === newStatus) return;
                
                // 建立新的歷史記錄
                const newHistoryEntry = {
                    from: oldStatus,
                    to: newStatus,
                    changed_at: new Date().toISOString(),
                    changed_by: session?.user?.email || 'admin'
                };
                
                // 取得現有歷史記錄
                const existingHistory = currentBooking?.raw_data?.status_history || [];
                const updatedHistory = [...existingHistory, newHistoryEntry];
                
                // 更新 raw_data 中的 status_history
                const updatedRawData = {
                    ...currentBooking?.raw_data,
                    status_history: updatedHistory
                };
                
                const { data, error } = await supabase
                    .from('bookings')
                    .update({ 
                        status: newStatus,
                        raw_data: updatedRawData
                    })
                    .eq('id', id)
                    .select();
                
                if (!error && data) {
                    const updatedBooking = data[0];
                    setBookings(prev => prev.map(b => b.id === id ? updatedBooking : b));
                    if (selectedBooking?.id === id) setSelectedBooking(updatedBooking);
                    addLog('狀態更新', `#${id} ${oldStatus} → ${STATUS_OPTIONS.find(s => s.value === newStatus)?.label}`);
                    showToast('狀態已更新', 'success');
                } else if (error) {
                    showToast('狀態更新失敗', 'error');
                    console.error('Update status error:', error);
                }
            };

            // Batch operations
            const handleBatchStatusUpdate = async (newStatus) => {
                if (selectedBookings.size === 0) return;
                
                const ids = Array.from(selectedBookings);
                const { error } = await supabase.from('bookings').update({ status: newStatus }).in('id', ids);
                
                if (!error) {
                    setBookings(prev => prev.map(b => ids.includes(b.id) ? { ...b, status: newStatus } : b));
                    setSelectedBookings(new Set());
                    addLog('批次更新', `${ids.length} 筆訂單 → ${STATUS_OPTIONS.find(s => s.value === newStatus)?.label}`);
                    showToast(`已更新 ${ids.length} 筆訂單`, 'success');
                }
            };

            const toggleSelectBooking = (id) => {
                setSelectedBookings(prev => {
                    const newSet = new Set(prev);
                    if (newSet.has(id)) newSet.delete(id);
                    else newSet.add(id);
                    return newSet;
                });
            };

            const selectAllBookings = () => {
                if (selectedBookings.size === filteredBookings.length) {
                    setSelectedBookings(new Set());
                } else {
                    setSelectedBookings(new Set(filteredBookings.map(b => b.id)));
                }
            };

            const triggerAction = (action) => { setConfirmAction(action); setShowConfirm(true); };

            const executeAction = async (confirmPassword) => {
                setActionLoading(true);
                const { error: authError } = await supabase.auth.signInWithPassword({ email: ADMIN_EMAIL, password: confirmPassword });
                if (authError) { showToast("密碼錯誤", 'error'); setActionLoading(false); return; }

                if (confirmAction === 'save') await handleSaveLogic();
                else if (confirmAction === 'delete') await handleDeleteLogic();

                setActionLoading(false); setShowConfirm(false);
            };

            const handleDeleteLogic = async () => {
                const { error } = await supabase.from('bookings').delete().eq('id', selectedBooking.id);
                if (!error) {
                    setBookings(prev => prev.filter(b => b.id !== selectedBooking.id));
                    addLog('刪除訂單', `#${selectedBooking.id} ${selectedBooking.pet_name}`);
                    setSelectedBooking(null);
                    showToast('訂單已刪除', 'success');
                } else { showToast("刪除失敗", 'error'); }
            };

            const startEditing = () => {
                setEditForm({ ...selectedBooking, ...selectedBooking.raw_data });
                setIsEditing(true);
            };

            const handleEditChange = (field, value) => { setEditForm(prev => ({ ...prev, [field]: value })); };

            const handleSaveLogic = async () => {
                const sanitizeDate = (val) => (!val || val === '') ? null : val;
                const topLevelUpdates = {
                    owner_name: editForm.owner_name,
                    phone: editForm.phone,
                    pet_name: editForm.pet_name,
                    service_type: editForm.service_type,
                    checkin_date: sanitizeDate(editForm.checkin_date),
                    checkout_date: sanitizeDate(editForm.checkout_date),
                    pickup_time: editForm.pickup_time,
                    service_price: editForm.service_price
                };

                const newRawData = { ...selectedBooking.raw_data, ...editForm };
                ['id', 'created_at', 'status', 'raw_data', 'signature_url', 'vaccine_url'].forEach(k => delete newRawData[k]);

                const { data, error } = await supabase.from('bookings')
                    .update({ ...topLevelUpdates, raw_data: newRawData })
                    .eq('id', selectedBooking.id)
                    .select();

                if (!error && data) {
                    const updatedBooking = data[0];
                    setBookings(prev => prev.map(b => b.id === updatedBooking.id ? updatedBooking : b));
                    setSelectedBooking(updatedBooking);
                    setIsEditing(false);
                    addLog('編輯訂單', `#${updatedBooking.id} ${updatedBooking.pet_name}`);
                    showToast('儲存成功', 'success');
                } else {
                    showToast("儲存失敗", 'error');
                }
            };

            // Login screen
            if (!session) {
                return (
                    <div className="min-h-screen login-bg flex items-center justify-center p-4">
                        <div className="glass-card w-full max-w-md p-10 text-center fade-in">
                            <div className="w-32 h-32 mx-auto mb-8 rounded-full shadow-2xl overflow-hidden bg-white border-4 border-white">
                                <img src="./logo.png" className="w-full h-full object-cover" alt="Logo" />
                            </div>
                            <h1 className="text-2xl font-black text-brand-brown mb-2">汪汪犬旅 | 管理後台</h1>
                            <p className="text-slate-400 text-sm mb-8">請輸入管理密碼以存取資料</p>
                            <form onSubmit={handleLogin} className="space-y-4">
                                <div className="relative">
                                    <Icon name="lock" size={20} className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400" />
                                    <input type="password" placeholder="輸入密碼" value={password} onChange={(e) => setPassword(e.target.value)} className="w-full pl-12 pr-4 py-4 rounded-xl border-2 border-slate-100 bg-slate-50 focus:bg-white focus:border-brand-brown outline-none transition-all font-bold text-lg text-center tracking-widest placeholder:tracking-normal" autoFocus />
                                </div>
                                {loginError && <p className="text-red-500 text-sm font-bold animate-pulse">{loginError}</p>}
                                <button disabled={loading} className="w-full bg-brand-brown text-white py-4 rounded-xl font-bold text-lg shadow-lg hover:bg-brand-dark-brown active:scale-95 transition-all flex items-center justify-center gap-2">
                                    {loading ? <Icon name="loader-2" className="animate-spin" /> : <>登入系統 <Icon name="arrow-right" size={20} /></>}
                                </button>
                            </form>
                            <div className="mt-6 border-t border-slate-100 pt-4">
                                <a href="index.html" className="w-full py-3 rounded-xl font-bold text-slate-400 hover:text-brand-brown transition-all flex items-center justify-center gap-2 text-sm">
                                    <Icon name="arrow-left" size={16} /> 返回填寫首頁
                                </a>
                            </div>
                        </div>
                    </div>
                );
            }

            // Main dashboard
            return (
                <div className="min-h-screen flex flex-col no-print">
                    {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                    
                    {/* Navigation */}
                    <nav className="bg-white dark:bg-gray-800 border-b border-slate-200 dark:border-gray-700 sticky top-0 z-30 px-4 md:px-6 py-3 md:py-4 flex justify-between items-center shadow-sm">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 rounded-full overflow-hidden shadow-md shrink-0 bg-white border border-slate-100"><img src="./logo.png" className="w-full h-full object-cover" /></div>
                            <span className="font-black text-lg md:text-xl text-brand-brown dark:text-brand-yellow">後台管理</span>
                        </div>
                        <div className="flex items-center gap-2 md:gap-3">
                            <button onClick={fetchBookings} className="p-2 rounded-full hover:bg-slate-100 dark:hover:bg-gray-700 text-slate-500 transition-colors" title="重新整理">
                                <Icon name="rotate-cw" size={20} className={dataLoading ? "animate-spin" : ""} />
                            </button>
                            <button onClick={() => setIsDark(!isDark)} className="p-2 rounded-full hover:bg-slate-100 dark:hover:bg-gray-700 text-slate-500 transition-colors" title="切換深色模式">
                                <Icon name={isDark ? "sun" : "moon"} size={20} />
                            </button>
                            <button onClick={() => setShowPasswordModal(true)} className="p-2 rounded-full hover:bg-slate-100 dark:hover:bg-gray-700 text-slate-500 transition-colors" title="變更密碼">
                                <Icon name="key" size={20} />
                            </button>
                            <button onClick={handleLogout} className="p-2 rounded-full hover:bg-red-50 dark:hover:bg-red-900 text-slate-500 hover:text-red-500 transition-colors" title="登出">
                                <Icon name="log-out" size={20} />
                            </button>
                        </div>
                    </nav>

                    <main className="flex-1 p-4 md:p-8 max-w-7xl mx-auto w-full space-y-6">
                        {/* Stats Cards */}
                        <div className="grid grid-cols-2 md:grid-cols-5 gap-3 md:gap-4">
                            {[
                                { title: '今日新增', count: stats.today, icon: 'plus-circle', bgColor: 'bg-blue-50 dark:bg-blue-900', textColor: 'text-blue-500' },
                                { title: '待確認', count: stats.pending, icon: 'alert-circle', bgColor: 'bg-yellow-50 dark:bg-yellow-900', textColor: 'text-yellow-500' },
                                { title: '住宿預約', count: stats.boarding, icon: 'home', bgColor: 'bg-orange-50 dark:bg-orange-900', textColor: 'text-orange-500' },
{ title: '總訂單數', count: stats.total, icon: 'file-text', bgColor: 'bg-purple-50 dark:bg-purple-900', textColor: 'text-purple-500' }
                                // 移除總營收卡片
                            ].map((item, idx) => (
                                <div key={idx} className="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-slate-100 dark:border-gray-700 flex flex-col justify-between h-28">
                                    <div className="flex justify-between items-start">
                                        <div className="text-slate-400 text-xs font-bold uppercase tracking-wider">{item.title}</div>
                                        <div className={`${item.bgColor} ${item.textColor} p-1.5 rounded-lg`}><Icon name={item.icon} size={16}/></div>
                                    </div>
                                    <div className="text-2xl font-black text-slate-700 dark:text-white">{item.count}</div>
                                </div>
                            ))}
                        </div>

                        {/* Tabs */}
                        <div className="flex gap-1 border-b border-slate-200 dark:border-gray-700 overflow-x-auto">
                            {[
                                { id: 'orders', label: '訂單管理', icon: 'clipboard-list' },
                                { id: 'dashboard', label: '數據儀表板', icon: 'bar-chart-2' },
                                { id: 'logs', label: '操作日誌', icon: 'activity' }
                            ].map(tab => (
                                <button 
                                    key={tab.id}
                                    onClick={() => setActiveTab(tab.id)}
                                    className={`px-4 py-3 font-bold text-sm flex items-center gap-2 transition-colors ${activeTab === tab.id ? 'tab-active' : 'text-slate-400 hover:text-slate-600'}`}
                                >
                                    <Icon name={tab.icon} size={16} />
                                    {tab.label}
                                </button>
                            ))}
                        </div>

                        {/* Tab Content */}
                        {activeTab === 'orders' && (
                            <div className="space-y-4">
                                {/* Filters */}
                                <div className="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-slate-100 dark:border-gray-700 p-4">
                                    <div className="flex flex-wrap gap-3">
                                        <div className="relative flex-1 min-w-[200px]">
                                            <Icon name="search" size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
                                            <input type="text" placeholder="搜尋電話、寵物名、飼主..." value={searchFilter} onChange={e => setSearchFilter(e.target.value)} className="w-full pl-10 pr-4 py-2 rounded-lg border border-slate-200 dark:border-gray-600 bg-white dark:bg-gray-700 text-sm" />
                                        </div>
                                        <select value={statusFilter} onChange={e => setStatusFilter(e.target.value)} className="px-3 py-2 rounded-lg border border-slate-200 dark:border-gray-600 bg-white dark:bg-gray-700 text-sm font-bold">
                                            <option value="all">全部狀態</option>
                                            {STATUS_OPTIONS.map(s => <option key={s.value} value={s.value}>{s.icon} {s.label}</option>)}
                                        </select>
                                        <select value={serviceFilter} onChange={e => setServiceFilter(e.target.value)} className="px-3 py-2 rounded-lg border border-slate-200 dark:border-gray-600 bg-white dark:bg-gray-700 text-sm font-bold">
                                            <option value="all">全部服務</option>
                                            <option value="boarding">🏠 住宿</option>
                                            <option value="grooming">✂️ 美容</option>
                                        </select>
                                        <input type="date" value={dateFrom} onChange={e => setDateFrom(e.target.value)} className="px-3 py-2 rounded-lg border border-slate-200 dark:border-gray-600 bg-white dark:bg-gray-700 text-sm" placeholder="開始日期" />
                                        <input type="date" value={dateTo} onChange={e => setDateTo(e.target.value)} className="px-3 py-2 rounded-lg border border-slate-200 dark:border-gray-600 bg-white dark:bg-gray-700 text-sm" placeholder="結束日期" />
                                    </div>
                                    
                                    {/* View mode & batch actions */}
                                    <div className="flex justify-between items-center mt-4 pt-4 border-t border-slate-100 dark:border-gray-700">
                                        <div className="flex gap-2">
                                            {['list', 'calendar', 'crm'].map(mode => (
                                                <button 
                                                    key={mode}
                                                    onClick={() => setViewMode(mode)}
                                                    className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-colors ${viewMode === mode ? 'bg-brand-brown text-white' : 'bg-slate-100 dark:bg-gray-700 text-slate-500 hover:bg-slate-200'}`}
                                                >
                                                    <Icon name={mode === 'list' ? 'list' : mode === 'calendar' ? 'calendar' : 'users'} size={14} className="inline mr-1" />
                                                    {mode === 'list' ? '列表' : mode === 'calendar' ? '日曆' : 'CRM'}
                                                </button>
                                            ))}
                                        </div>
                                        <div className="flex gap-2">
                                            {selectedBookings.size > 0 && (
                                                <>
                                                    <span className="text-xs text-slate-500 self-center">已選 {selectedBookings.size} 筆</span>
                                                    <select onChange={e => { if(e.target.value) handleBatchStatusUpdate(e.target.value); e.target.value = ''; }} className="px-2 py-1 rounded-lg border border-slate-200 dark:border-gray-600 text-xs font-bold bg-white dark:bg-gray-700">
                                                        <option value="">批次更改狀態...</option>
                                                        {STATUS_OPTIONS.map(s => <option key={s.value} value={s.value}>{s.label}</option>)}
                                                    </select>
                                                </>
                                            )}
<button onClick={() => exportToExcel(filteredBookings)} className="px-3 py-1.5 rounded-lg bg-green-50 dark:bg-green-900 text-green-600 text-xs font-bold hover:bg-green-100 transition-colors flex items-center gap-1">
                                                <Icon name="file-spreadsheet" size={14} /> 匯出 Excel
                                            </button>
                                            {/* 移除 PDF 按鈕 */}
                                        </div>
                                    </div>
                                </div>

                                {/* Content based on view mode */}
                                {dataLoading ? (
                                    <SkeletonTable />
                                ) : viewMode === 'calendar' ? (
                                    <CalendarView bookings={filteredBookings} onSelectBooking={b => { setSelectedBooking(b); setIsEditing(false); }} />
                                ) : viewMode === 'crm' ? (
                                    <CustomerCRM bookings={bookings} onSelectBooking={b => { setSelectedBooking(b); setIsEditing(false); }} />
                                ) : (
                                    <div className="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-slate-100 dark:border-gray-700 overflow-hidden">
                                        {/* Mobile view */}
                                        <div className="md:hidden p-4 space-y-3">
                                            {filteredBookings.map(b => (
                                                <div key={b.id} className="bg-slate-50 dark:bg-gray-700 p-4 rounded-xl flex items-center gap-3">
                                                    <input type="checkbox" checked={selectedBookings.has(b.id)} onChange={() => toggleSelectBooking(b.id)} className="w-5 h-5 accent-brand-brown" />
<div className="flex-1" onClick={() => { setSelectedBooking(b); setIsEditing(false); }}>
                                                        <div className="flex items-center gap-2">
                                                            <span className="font-bold text-brand-brown dark:text-brand-yellow">{b.pet_name}</span>
                                                            <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${b.status === 'confirmed' ? 'bg-green-100 text-green-700' : b.status === 'completed' ? 'bg-blue-100 text-blue-700' : b.status === 'cancelled' ? 'bg-red-100 text-red-700' : 'bg-yellow-100 text-yellow-700'}`}>
                                                                {STATUS_OPTIONS.find(s => s.value === b.status)?.label}
                                                            </span>
                                                        </div>
                                                        <div className="text-xs text-slate-500 dark:text-gray-400">{b.owner_name} • {getServiceLabel(b.service_type)}</div>
                                                    </div>
                                                    <div className="text-right">
                                                        {/* 移除金額顯示 */}
                                                        <div className="text-[10px] text-slate-400">{formatDate(b.created_at)}</div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>

                                        {/* Desktop table */}
                                        <div className="hidden md:block overflow-x-auto">
                                            <table className="w-full text-left">
                                                <thead className="bg-slate-50 dark:bg-gray-900 text-slate-500 font-bold text-xs uppercase tracking-wider">
                                                    <tr>
                                                        <th className="px-4 py-3">
                                                            <input type="checkbox" checked={selectedBookings.size === filteredBookings.length && filteredBookings.length > 0} onChange={selectAllBookings} className="w-4 h-4 accent-brand-brown" />
                                                        </th>
                                                        <th className="px-4 py-3">建立時間</th>
                                                        <th className="px-4 py-3">飼主 / 電話</th>
<th className="px-4 py-3">寵物</th>
                                                        <th className="px-4 py-3">服務項目</th>
                                                        {/* 移除金額標題 */}
                                                        <th className="px-4 py-3">狀態</th>
                                                        <th className="px-4 py-3"></th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-100 dark:divide-gray-700">
                                                    {filteredBookings.map(b => (
                                                        <tr key={b.id} className="hover:bg-brand-yellow/5 transition-colors cursor-pointer group">
                                                            <td className="px-4 py-3" onClick={e => e.stopPropagation()}>
                                                                <input type="checkbox" checked={selectedBookings.has(b.id)} onChange={() => toggleSelectBooking(b.id)} className="w-4 h-4 accent-brand-brown" />
                                                            </td>
                                                            <td className="px-4 py-3 text-sm" onClick={() => { setSelectedBooking(b); setIsEditing(false); }}>
                                                                <div className="font-medium text-slate-600 dark:text-gray-300">{formatDate(b.created_at)}</div>
                                                                <div className="text-xs text-slate-400">{new Date(b.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div>
                                                            </td>
                                                            <td className="px-4 py-3" onClick={() => { setSelectedBooking(b); setIsEditing(false); }}>
                                                                <div className="font-bold text-brand-brown dark:text-brand-yellow">{b.owner_name}</div>
                                                                <div className="text-xs text-slate-400">{b.phone}</div>
                                                            </td>
                                                            <td className="px-4 py-3" onClick={() => { setSelectedBooking(b); setIsEditing(false); }}>
                                                                <span className="bg-brand-brown/10 text-brand-brown px-2 py-1 rounded text-xs font-bold">{b.pet_name}</span>
                                                            </td>
<td className="px-4 py-3 text-sm font-bold text-slate-600 dark:text-gray-300" onClick={() => { setSelectedBooking(b); setIsEditing(false); }}>
                                                                {getServiceLabel(b.service_type)}
                                                            </td>
                                                            {/* 移除金額顯示 */}
                                                            <td className="px-4 py-3" onClick={() => { setSelectedBooking(b); setIsEditing(false); }}>
                                                                <span className={`inline-flex items-center gap-1 px-2 py-1 rounded-full text-xs font-bold ${b.status === 'confirmed' ? 'bg-green-50 text-green-600' : b.status === 'completed' ? 'bg-blue-50 text-blue-600' : b.status === 'cancelled' ? 'bg-red-50 text-red-600' : 'bg-yellow-50 text-yellow-600'}`}>
                                                                    {STATUS_OPTIONS.find(s => s.value === b.status)?.icon} {STATUS_OPTIONS.find(s => s.value === b.status)?.label}
                                                                </span>
                                                            </td>
                                                            <td className="px-4 py-3">
                                                                <button onClick={() => { setSelectedBooking(b); setIsEditing(false); }} className="text-slate-300 group-hover:text-brand-brown transition-colors">
                                                                    <Icon name="chevron-right" size={18}/>
                                                                </button>
                                                            </td>
                                                        </tr>
                                                    ))}
                                                    {filteredBookings.length === 0 && (
                                                        <tr><td colSpan="8" className="px-6 py-20 text-center text-slate-400">沒有找到相關訂單</td></tr>
                                                    )}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {activeTab === 'dashboard' && (
                            <div className="space-y-6">
                                <DashboardCharts bookings={bookings} />
                            </div>
                        )}

                        {activeTab === 'logs' && (
                            <ActivityLog logs={activityLogs} />
                        )}
                    </main>

                    {/* Detail Modal */}
                    {selectedBooking && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-0 md:p-4 bg-black/60 backdrop-blur-sm fade-in" onClick={(e) => { if(e.target === e.currentTarget && !isEditing) setSelectedBooking(null); }}>
                            <div className="bg-white dark:bg-gray-800 w-full h-full md:h-[90vh] md:max-w-5xl md:rounded-2xl shadow-2xl flex flex-col overflow-hidden">
                                {/* Header */}
                                <div className="px-6 py-4 border-b border-slate-100 dark:border-gray-700 flex justify-between items-center bg-slate-50 dark:bg-gray-900 shrink-0">
                                    <div>
                                        <h2 className="text-xl font-black text-brand-brown dark:text-brand-yellow">訂單 #{selectedBooking.id}</h2>
                                        <p className="text-slate-400 text-xs">{isEditing ? '編輯模式' : formatDateTime(selectedBooking.created_at)}</p>
                                    </div>
                                    <div className="flex gap-2">
                                        {isEditing ? (
                                            <>
                                                <button onClick={() => triggerAction('save')} className="bg-green-500 text-white px-4 py-2 rounded-xl font-bold flex items-center gap-2 hover:bg-green-600 transition-all text-sm"><Icon name="save" size={16}/> 儲存</button>
                                                <button onClick={() => setIsEditing(false)} className="bg-slate-100 dark:bg-gray-700 text-slate-600 dark:text-gray-300 px-4 py-2 rounded-xl font-bold hover:bg-slate-200 transition-all text-sm">取消</button>
                                            </>
                                        ) : (
                                            <>
                                                <button onClick={startEditing} className="bg-blue-50 dark:bg-blue-900 text-blue-600 px-3 py-2 rounded-xl font-bold flex items-center gap-1 hover:bg-blue-100 transition-all text-sm"><Icon name="pencil" size={14}/> 編輯</button>
                                                <button onClick={() => window.print()} className="bg-slate-100 dark:bg-gray-700 text-slate-600 dark:text-gray-300 px-3 py-2 rounded-xl font-bold flex items-center gap-1 hover:bg-slate-200 transition-all text-sm"><Icon name="printer" size={14}/></button>
                                                <button onClick={() => setSelectedBooking(null)} className="w-10 h-10 bg-slate-100 dark:bg-gray-700 rounded-full flex items-center justify-center hover:bg-red-50 hover:text-red-500 transition-all"><Icon name="x" size={18}/></button>
                                            </>
                                        )}
                                    </div>
                                </div>

                                {/* Content */}
                                <div className="flex-1 overflow-y-auto p-4 md:p-6 bg-slate-50 dark:bg-gray-900">
                                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                        {/* Main content */}
                                        <div className="lg:col-span-2 space-y-4">
                                            {/* Owner info */}
                                            <div className="bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm border border-slate-100 dark:border-gray-700">
                                                <h3 className="font-bold text-brand-brown dark:text-brand-yellow flex items-center gap-2 mb-4"><Icon name="user" size={16}/> 飼主資料</h3>
                                                <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
                                                    <DetailItem label="姓名" value={selectedBooking.owner_name} fieldName="owner_name" isEditing={isEditing} editForm={editForm} handleEditChange={handleEditChange} />
                                                    <DetailItem label="電話" value={selectedBooking.phone} fieldName="phone" isEditing={isEditing} editForm={editForm} handleEditChange={handleEditChange} />
                                                    <DetailItem label="身分證" value={selectedBooking.raw_data?.owner_id} fieldName="owner_id" isEditing={isEditing} editForm={editForm} handleEditChange={handleEditChange} />
                                                    <DetailItem label="Email" value={selectedBooking.raw_data?.email} fieldName="email" fullWidth isEditing={isEditing} editForm={editForm} handleEditChange={handleEditChange} />
                                                    <DetailItem label="地址" value={selectedBooking.raw_data?.address} fieldName="address" fullWidth isEditing={isEditing} editForm={editForm} handleEditChange={handleEditChange} />
                                                    <DetailItem label="緊急聯絡人" value={selectedBooking.raw_data?.emergency_name} fieldName="emergency_name" isEditing={isEditing} editForm={editForm} handleEditChange={handleEditChange} />
                                                    <DetailItem label="緊急電話" value={selectedBooking.raw_data?.emergency_phone} fieldName="emergency_phone" isEditing={isEditing} editForm={editForm} handleEditChange={handleEditChange} />
                                                </div>
                                            </div>

                                            {/* Pet info */}
                                            <div className="bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm border border-slate-100 dark:border-gray-700">
                                                <h3 className="font-bold text-brand-brown dark:text-brand-yellow flex items-center gap-2 mb-4"><Icon name="heart" size={16}/> 寵物資料</h3>
                                                <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                                                    <DetailItem label="名字" value={selectedBooking.pet_name} fieldName="pet_name" isEditing={isEditing} editForm={editForm} handleEditChange={handleEditChange} />
                                                    <DetailItem label="品種" value={selectedBooking.raw_data?.breed} fieldName="breed" isEditing={isEditing} editForm={editForm} handleEditChange={handleEditChange} />
                                                    <DetailItem label="性別" value={selectedBooking.raw_data?.sex} fieldName="sex" isEditing={isEditing} editForm={editForm} handleEditChange={handleEditChange} />
                                                    <DetailItem label="結紮" value={selectedBooking.raw_data?.fix} fieldName="fix" isEditing={isEditing} editForm={editForm} handleEditChange={handleEditChange} />
                                                    <DetailItem label="年齡" value={selectedBooking.raw_data?.age} fieldName="age" isEditing={isEditing} editForm={editForm} handleEditChange={handleEditChange} />
                                                    <DetailItem label="體重" value={selectedBooking.raw_data?.weight} fieldName="weight" isEditing={isEditing} editForm={editForm} handleEditChange={handleEditChange} />
                                                    <DetailItem label="晶片" value={selectedBooking.raw_data?.chip_status} fieldName="chip_status" isEditing={isEditing} editForm={editForm} handleEditChange={handleEditChange} />
                                                    <DetailItem label="晶片號碼" value={selectedBooking.raw_data?.chip_id} fieldName="chip_id" isEditing={isEditing} editForm={editForm} handleEditChange={handleEditChange} />
                                                </div>
                                            </div>

                                            {/* Health info */}
                                            <div className="bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm border border-slate-100 dark:border-gray-700 border-l-4 border-l-brand-yellow">
                                                <h3 className="font-bold text-brand-brown dark:text-brand-yellow flex items-center gap-2 mb-4"><Icon name="activity" size={16}/> 健康與行為</h3>
                                                <div className="grid grid-cols-2 gap-3">
                                                    <DetailItem label="親狗程度" value={selectedBooking.raw_data?.dog_traits} fieldName="dog_traits" fullWidth isEditing={isEditing} editForm={editForm} handleEditChange={handleEditChange} />
                                                    <DetailItem label="過往病史" value={selectedBooking.raw_data?.medical_status} fieldName="medical_status" isEditing={isEditing} editForm={editForm} handleEditChange={handleEditChange} />
                                                    <DetailItem label="病史說明" value={selectedBooking.raw_data?.medical_history} fieldName="medical_history" isEditing={isEditing} editForm={editForm} handleEditChange={handleEditChange} />
                                                    <DetailItem label="容易吠叫" value={selectedBooking.raw_data?.is_barking} fieldName="is_barking" isEditing={isEditing} editForm={editForm} handleEditChange={handleEditChange} />
                                                    <DetailItem label="護食狀況" value={selectedBooking.raw_data?.food_aggr} fieldName="food_aggr" isEditing={isEditing} editForm={editForm} handleEditChange={handleEditChange} />
                                                    <DetailItem label="定點如廁" value={selectedBooking.raw_data?.pad_toilet} fieldName="pad_toilet" isEditing={isEditing} editForm={editForm} handleEditChange={handleEditChange} />
                                                    <DetailItem label="定期疫苗" value={selectedBooking.raw_data?.vaccine} fieldName="vaccine" isEditing={isEditing} editForm={editForm} handleEditChange={handleEditChange} />
                                                    <DetailItem label="定期驅蟲" value={selectedBooking.raw_data?.deworm} fieldName="deworm" isEditing={isEditing} editForm={editForm} handleEditChange={handleEditChange} />
                                                </div>
                                            </div>

                                            {/* Notes */}
                                            <div className="bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm border border-slate-100 dark:border-gray-700">
                                                <h3 className="font-bold text-brand-brown dark:text-brand-yellow flex items-center gap-2 mb-4"><Icon name="clipboard" size={16}/> 備註</h3>
                                                <div className="space-y-3">
                                                    <DetailItem label="過敏資訊" value={selectedBooking.raw_data?.allergy} fieldName="allergy" fullWidth isMultiline isEditing={isEditing} editForm={editForm} handleEditChange={handleEditChange} />
                                                    <DetailItem label="個性描述" value={selectedBooking.raw_data?.personality} fieldName="personality" fullWidth isMultiline isEditing={isEditing} editForm={editForm} handleEditChange={handleEditChange} />
                                                    <DetailItem label="特別注意" value={selectedBooking.raw_data?.special_notes} fieldName="special_notes" fullWidth isMultiline isEditing={isEditing} editForm={editForm} handleEditChange={handleEditChange} />
                                                </div>
                                            </div>

                                            {/* Signature & Vaccine */}
                                            <div className="grid grid-cols-2 gap-4">
                                                <div className="bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm border border-slate-100 dark:border-gray-700">
                                                    <h4 className="text-xs font-bold text-slate-400 mb-2">客戶簽名</h4>
                                                    {selectedBooking.signature_url ? <img src={selectedBooking.signature_url} className="w-full h-24 object-contain bg-slate-50 dark:bg-gray-700 rounded-lg" /> : <div className="w-full h-24 bg-slate-50 dark:bg-gray-700 rounded-lg flex items-center justify-center text-slate-300 text-xs">無簽名</div>}
                                                </div>
                                                <div className="bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm border border-slate-100 dark:border-gray-700">
                                                    <h4 className="text-xs font-bold text-slate-400 mb-2">疫苗證明</h4>
                                                    {selectedBooking.vaccine_url ? <a href={selectedBooking.vaccine_url} target="_blank"><img src={selectedBooking.vaccine_url} className="w-full h-24 object-cover rounded-lg hover:opacity-80 transition-opacity" /></a> : <div className="w-full h-24 bg-slate-50 dark:bg-gray-700 rounded-lg flex items-center justify-center text-slate-300 text-xs">無照片</div>}
                                                </div>
                                            </div>
                                        </div>

                                        {/* Sidebar */}
                                        <div className="space-y-4">
                                            {/* Status */}
                                            <div className="bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm border border-slate-100 dark:border-gray-700">
                                                <label className="text-xs font-bold text-slate-400 mb-3 block">訂單狀態</label>
                                                <div className="grid grid-cols-2 gap-2">
                                                    {STATUS_OPTIONS.map(status => (
                                                        <button key={status.value} onClick={() => updateStatus(selectedBooking.id, status.value)} className={`py-2 px-3 rounded-lg font-bold text-sm flex items-center justify-center gap-1 border-2 transition-all ${selectedBooking.status === status.value ? 'bg-brand-brown text-white border-brand-brown' : 'bg-white dark:bg-gray-700 text-slate-400 border-slate-100 dark:border-gray-600 hover:border-brand-brown/30'}`}>
                                                            {status.icon} {status.label}
                                                        </button>
                                                    ))}
                                                </div>
                                            </div>

                                            {/* Service info */}
                                            <div className="bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm border border-slate-100 dark:border-gray-700">
                                                <label className="text-xs font-bold text-slate-400 mb-3 block">服務資訊</label>
                                                <div className="space-y-3">
                                                    <DetailItem label="服務項目" value={selectedBooking.service_type} fieldName="service_type" isEditing={isEditing} editForm={editForm} handleEditChange={handleEditChange} />
                                                    <DetailItem label="金額" value={selectedBooking.service_price} fieldName="service_price" isEditing={isEditing} editForm={editForm} handleEditChange={handleEditChange} />
                                                    <DetailItem label="入住日期" value={selectedBooking.checkin_date} fieldName="checkin_date" isEditing={isEditing} editForm={editForm} handleEditChange={handleEditChange} />
                                                    <DetailItem label="退房日期" value={selectedBooking.checkout_date} fieldName="checkout_date" isEditing={isEditing} editForm={editForm} handleEditChange={handleEditChange} />
                                                    <DetailItem label="預計接回" value={selectedBooking.pickup_time} fieldName="pickup_time" isEditing={isEditing} editForm={editForm} handleEditChange={handleEditChange} />
                                                </div>
                                            </div>

                                            {/* Admin Notes - 店家內部備註 */}
                                            <div className="bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm border border-slate-100 dark:border-gray-700 border-l-4 border-l-purple-400">
                                                <label className="text-xs font-bold text-slate-400 mb-3 flex items-center gap-2">
                                                    <Icon name="sticky-note" size={14} /> 店家內部備註
                                                </label>
                                                <textarea 
                                                    className="w-full edit-input h-24 text-sm" 
                                                    placeholder="輸入內部備註（僅店家可見）..."
                                                    value={editForm.admin_notes || selectedBooking.raw_data?.admin_notes || ''}
                                                    onChange={e => handleEditChange('admin_notes', e.target.value)}
                                                    disabled={!isEditing}
                                                />
                                                {!isEditing && selectedBooking.raw_data?.admin_notes && (
                                                    <div className="mt-2 text-xs text-slate-500 dark:text-gray-400">
                                                        {selectedBooking.raw_data.admin_notes}
                                                    </div>
                                                )}
                                            </div>

                                            {/* Order History Timeline - 訂單歷史記錄 */}
                                            <div className="bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm border border-slate-100 dark:border-gray-700">
                                                <label className="text-xs font-bold text-slate-400 mb-3 flex items-center gap-2">
                                                    <Icon name="history" size={14} /> 狀態變更記錄
                                                </label>
                                                <div className="space-y-3 max-h-48 overflow-y-auto">
                                                    {(selectedBooking.raw_data?.status_history || []).length > 0 ? (
                                                        selectedBooking.raw_data.status_history.map((h, idx) => (
                                                            <div key={idx} className="flex items-start gap-3 text-xs">
                                                                <div className="w-2 h-2 rounded-full bg-brand-brown mt-1.5 shrink-0"></div>
                                                                <div className="flex-1">
                                                                    <div className="font-bold text-slate-700 dark:text-white">
                                                                        {STATUS_OPTIONS.find(s => s.value === h.from)?.label || '新建'} → {STATUS_OPTIONS.find(s => s.value === h.to)?.label}
                                                                    </div>
                                                                    <div className="text-slate-400">{formatDateTime(h.changed_at)}</div>
                                                                </div>
                                                            </div>
                                                        ))
                                                    ) : (
                                                        <div className="text-center text-slate-400 text-xs py-4">
                                                            <div className="flex items-start gap-3">
                                                                <div className="w-2 h-2 rounded-full bg-green-500 mt-1.5 shrink-0"></div>
                                                                <div className="flex-1 text-left">
                                                                    <div className="font-bold text-slate-700 dark:text-white">訂單建立</div>
                                                                    <div className="text-slate-400">{formatDateTime(selectedBooking.created_at)}</div>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    )}
                                                </div>
                                            </div>

                                            {/* Delete button */}
                                            {!isEditing && (
                                                <button onClick={() => triggerAction('delete')} className="w-full py-3 rounded-xl font-bold text-sm flex items-center justify-center gap-2 text-red-500 hover:bg-red-50 dark:hover:bg-red-900 transition-all border border-transparent hover:border-red-100">
                                                    <Icon name="trash-2" size={16}/> 刪除此訂單
                                                </button>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <PrintContract data={selectedBooking} />
                        </div>
                    )}

                    <ChangePasswordModal isOpen={showPasswordModal} onClose={() => setShowPasswordModal(false)} showToast={showToast} />
                    <ConfirmModal isOpen={showConfirm} onClose={() => setShowConfirm(false)} onConfirm={executeAction} title={confirmAction === 'delete' ? '刪除確認' : '儲存變更確認'} loading={actionLoading} />
                </div>
            );
        };

// PWA Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', async () => {
                try {
                    // 使用 admin 專用的 service worker
                    const registration = await navigator.serviceWorker.register('sw-admin.js');
                    console.log('SW registered:', registration);
                    
                    // 檢查更新
                    registration.addEventListener('updatefound', () => {
                        const newWorker = registration.installing;
                        newWorker.addEventListener('statechange', () => {
                            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                // 有新版本可用
                                console.log('New SW version available');
                            }
                        });
                    });
                } catch (error) {
                    console.error('SW registration failed:', error);
                }
            });
        }

const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

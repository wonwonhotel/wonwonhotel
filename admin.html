        // --- Error Boundary Component (防止白畫面) ---
        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };

        // --- Rate Limiting Hook ---
        const useRateLimiter = () => {
            const checkRateLimit = (key) => {
                const stored = localStorage.getItem(`rate_limit_${key}`);
                if (!stored) return { allowed: true, remaining: RATE_LIMIT.maxAttempts };
                
                const data = JSON.parse(stored);
                const now = Date.now();
                
                if (now - data.firstAttempt > RATE_LIMIT.windowMs) {
                    localStorage.removeItem(`rate_limit_${key}`);
                    return { allowed: true, remaining: RATE_LIMIT.maxAttempts };
                }
                
                return { 
                    allowed: data.attempts < RATE_LIMIT.maxAttempts,
                    remaining: RATE_LIMIT.maxAttempts - data.attempts
                };
            };

            const recordAttempt = (key) => {
                const stored = localStorage.getItem(`rate_limit_${key}`);
                const now = Date.now();
                
                if (!stored) {
                    localStorage.setItem(`rate_limit_${key}`, JSON.stringify({ firstAttempt: now, attempts: 1 }));
                } else {
                    const data = JSON.parse(stored);
                    data.attempts++;
                    localStorage.setItem(`rate_limit_${key}`, JSON.stringify(data));
                }
            };

            return { checkRateLimit, recordAttempt };
        };

        // --- Session Management Hook ---
        const useSessionTimeout = (onTimeout) => {
            const timeoutRef = useRef(null);
            const lastActivityRef = useRef(Date.now());

            const resetTimeout = useCallback(() => {
                lastActivityRef.current = Date.now();
                if (timeoutRef.current) clearTimeout(timeoutRef.current);
                timeoutRef.current = setTimeout(() => {
                    onTimeout();
                }, SESSION_TIMEOUT);
            }, [onTimeout]);

            useEffect(() => {
                const events = ['mousedown', 'keydown', 'scroll', 'touchstart'];
                events.forEach(event => window.addEventListener(event, resetTimeout));
                resetTimeout();

                return () => {
                    events.forEach(event => window.removeEventListener(event, resetTimeout));
                    if (timeoutRef.current) clearTimeout(timeoutRef.current);
                };
            }, [resetTimeout]);

            return { resetTimeout };
        };

        // --- Permission Check Hook ---
        const usePermissions = (userEmail) => {
            const adminConfig = ADMIN_ROLES[userEmail] || { role: 'viewer', permissions: ['view'] };
            
            const hasPermission = (permission) => {
                return adminConfig.permissions.includes(permission);
            };
            
            const canView = () => hasPermission('view');
            const canEdit = () => hasPermission('edit');
            const canDelete = () => hasPermission('delete');
            const canExport = () => hasPermission('export');
            const canAccessSettings = () => hasPermission('settings');
            const canViewLogs = () => hasPermission('logs');
            const canManageAdmins = () => hasPermission('manage_admins');
            
            return {
                role: adminConfig.role,
                roleName: adminConfig.name,
                permissions: adminConfig.permissions,
                hasPermission,
                canView,
                canEdit,
                canDelete,
                canExport,

                canViewLogs,
                canManageAdmins
            };
        };

            });

            const bgColors = {

                info: 'bg-blue-500'
            };

            return (
                <div className={`toast-notification ${bgColors[type]} text-white px-6 py-4 rounded-xl shadow-2xl flex items-center gap-3`}>
                    <Icon name={type === 'success' ? 'check-circle' : type === 'error' ? 'x-circle' : type === 'warning' ? 'alert-triangle' : 'info'} size={20} />
                    <span className="font-bold">{message}</span>
                    <button onClick={onClose} className="ml-2 hover:opacity-70"><Icon name="x" size={16} /></button>
                </div>
            );
        };

        // --- Skeleton Loading Component ---
        const SkeletonCard = () => (
            <div className="bg-white dark:bg-gray-700 p-4 rounded-2xl shadow-sm border border-slate-100 dark:border-gray-600 space-y-3">
                <div className="skeleton h-4 w-3/4 rounded"></div>
                <div className="skeleton h-3 w-1/2 rounded"></div>
                <div className="skeleton h-3 w-2/3 rounded"></div>
            </div>
        );

        const SkeletonTable = () => (
            <div className="space-y-3 p-4">
                {[1,2,3,4,5].map(i => (
                    <div key={i} className="flex gap-4">
                        <div className="skeleton h-12 w-24 rounded"></div>
                        <div className="skeleton h-12 flex-1 rounded"></div>
                        <div className="skeleton h-12 w-32 rounded"></div>
                        <div className="skeleton h-12 w-20 rounded"></div>
                    </div>
                ))}
            </div>
        );

// --- Change Password Modal ---
        const ChangePasswordModal = ({ isOpen, onClose, showToast, currentUserEmail }) => {
            const [oldPassword, setOldPassword] = useState('');
            const [newPassword, setNewPassword] = useState('');
            const [confirmPassword, setConfirmPassword] = useState('');
            const [targetEmail, setTargetEmail] = useState('');
            const [isLoading, setIsLoading] = useState(false);

            // 當開啟時，預設目標為當前登入者
            useEffect(() => {
                if (isOpen && currentUserEmail) {
                    setTargetEmail(currentUserEmail);
                    setOldPassword(''); setNewPassword(''); setConfirmPassword('');
                }
            }, [isOpen, currentUserEmail]);

            const handleUpdatePassword = async () => {
                if (!oldPassword) { showToast('請輸入該帳號的舊密碼', 'error'); return; }
                if (newPassword.length < 6) { showToast('新密碼長度至少需 6 個字元', 'error'); return; }
                if (newPassword !== confirmPassword) { showToast('兩次輸入的新密碼不相符', 'error'); return; }
                
                setIsLoading(true);
                try {
                    // 1. 驗證舊密碼 (並切換 Session 到目標帳號)
                    const { error: signInError } = await supabase.auth.signInWithPassword({ email: targetEmail, password: oldPassword });
                    if (signInError) throw new Error("舊密碼輸入錯誤，無法驗證身分");

                    // 2. 更新密碼
                    const { error: updateError } = await supabase.auth.updateUser({ password: newPassword });
                    if (updateError) throw updateError;
                    
                    showToast(`密碼修改成功！即將重新整理...`, 'success');
                    
                    // 3. 因為身分可能已經切換，為了安全與資料一致性，強制登出並重整
                    setTimeout(async () => {
                        await supabase.auth.signOut();
                        window.location.reload();
                    }, 1500);

                } catch (error) {
                    showToast(error.message || '修改失敗', 'error');
                    setIsLoading(false);
                }
            };

            if (!isOpen) return null;

            return (
                <div className="fixed inset-0 z-[70] flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm fade-in">
                    <div className="bg-white dark:bg-gray-800 w-full max-w-sm rounded-2xl shadow-2xl p-6 space-y-4">
                        <div className="text-center">
                            <h3 className="text-lg font-black text-slate-700 dark:text-white mb-1">變更密碼</h3>
                            <p className="text-xs text-slate-400">目前修改對象：{targetEmail === ADMIN_EMAIL ? '管理員' : '員工'}</p>
                        </div>

                        {/* 如果是超級管理員，顯示切換按鈕 */}
                        {currentUserEmail === ADMIN_EMAIL && (
                            <div className="flex bg-slate-100 dark:bg-gray-700 p-1 rounded-xl">
                                <button onClick={() => setTargetEmail(ADMIN_EMAIL)} className={`flex-1 py-2 rounded-lg text-sm font-bold transition-all ${targetEmail === ADMIN_EMAIL ? 'bg-white shadow text-brand-brown dark:bg-gray-600 dark:text-white' : 'text-slate-400'}`}>修改自己</button>
                                <button onClick={() => setTargetEmail(STAFF_EMAIL)} className={`flex-1 py-2 rounded-lg text-sm font-bold transition-all ${targetEmail === STAFF_EMAIL ? 'bg-white shadow text-blue-500 dark:bg-gray-600 dark:text-blue-400' : 'text-slate-400'}`}>修改員工</button>
                            </div>
                        )}

                        <div className="space-y-4">
                            <input type="password" value={oldPassword} onChange={(e) => setOldPassword(e.target.value)} className="w-full edit-input py-3" placeholder={`輸入${targetEmail === currentUserEmail ? '您的' : '對方的'}舊密碼`} />
                            <hr className="border-dashed border-slate-200 dark:border-gray-600" />
                            <input type="password" value={newPassword} onChange={(e) => setNewPassword(e.target.value)} className="w-full edit-input py-3" placeholder="新密碼 (至少6位)" />
                            <input type="password" value={confirmPassword} onChange={(e) => setConfirmPassword(e.target.value)} className="w-full edit-input py-3" placeholder="確認新密碼" />
                        </div>
                        <div className="flex gap-3 pt-2">
                            <button onClick={onClose} className="flex-1 py-3 rounded-xl bg-slate-100 dark:bg-gray-700 text-slate-600 dark:text-gray-300 font-bold hover:bg-slate-200 dark:hover:bg-gray-600 transition-all">取消</button>
                            <button onClick={handleUpdatePassword} disabled={isLoading} className="flex-1 py-3 rounded-xl bg-brand-brown text-white font-bold hover:bg-brand-dark-brown disabled:opacity-50 transition-all flex items-center justify-center gap-2">
                                {isLoading ? <Icon name="loader-2" className="animate-spin" /> : '確認修改'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- Confirm Modal ---
        const ConfirmModal = ({ isOpen, onClose, onConfirm, title, loading }) => {
            const [confirmPassword, setConfirmPassword] = useState('');
            useEffect(() => { if (!isOpen) setConfirmPassword(''); }, [isOpen]);
            if (!isOpen) return null;

            return (
                <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm fade-in">
                    <div className="bg-white dark:bg-gray-800 w-full max-w-sm rounded-2xl shadow-2xl p-6 space-y-4">
                        <div className="text-center">
                            <div className="w-12 h-12 bg-yellow-100 dark:bg-yellow-900 text-yellow-600 rounded-full flex items-center justify-center mx-auto mb-3"><Icon name="lock" size={24} /></div>
                            <h3 className="text-lg font-black text-slate-700 dark:text-white">{title}</h3>
                            <p className="text-sm text-slate-500 dark:text-gray-400 mt-1">此為敏感操作，請輸入密碼以確認。</p>
                        </div>
                        <input type="password" placeholder="請輸入您的密碼" value={confirmPassword} onChange={(e) => setConfirmPassword(e.target.value)} className="w-full text-center py-3 border-2 border-slate-200 dark:border-gray-600 rounded-xl focus:border-brand-brown outline-none font-bold bg-white dark:bg-gray-700 dark:text-white" autoFocus />
                        <div className="flex gap-3 pt-2">
                            <button onClick={onClose} className="flex-1 py-3 rounded-xl bg-slate-100 dark:bg-gray-700 text-slate-600 dark:text-gray-300 font-bold hover:bg-slate-200 dark:hover:bg-gray-600 transition-all">取消</button>
                            <button onClick={() => onConfirm(confirmPassword)} disabled={loading || !confirmPassword} className="flex-1 py-3 rounded-xl bg-brand-brown text-white font-bold hover:bg-brand-dark-brown disabled:opacity-50 transition-all flex items-center justify-center gap-2">
                                {loading ? <Icon name="loader-2" className="animate-spin" /> : '確認執行'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- Calendar View Component ---
        const CalendarView = ({ bookings, onSelectBooking }) => {
            const [currentDate, setCurrentDate] = useState(new Date());
            
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const startDay = firstDay.getDay();
            const daysInMonth = lastDay.getDate();
            
            const days = [];
            for (let i = 0; i < startDay; i++) days.push(null);
            for (let i = 1; i <= daysInMonth; i++) days.push(i);
            
            const getBookingsForDay = (day) => {
                if (!day) return [];
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                return bookings.filter(b => {
                    if (b.checkin_date && b.checkout_date) {
                        return dateStr >= b.checkin_date && dateStr <= b.checkout_date;
                    }
                    return b.created_at?.startsWith(dateStr);
                });
            };

            const prevMonth = () => setCurrentDate(new Date(year, month - 1, 1));
            const nextMonth = () => setCurrentDate(new Date(year, month + 1, 1));
            const goToday = () => setCurrentDate(new Date());

            return (
                <div className="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-slate-100 dark:border-gray-700 overflow-hidden">
                    <div className="p-4 border-b border-slate-100 dark:border-gray-700 flex justify-between items-center bg-slate-50 dark:bg-gray-900">
                        <button onClick={prevMonth} className="p-2 hover:bg-slate-200 dark:hover:bg-gray-700 rounded-lg transition-colors">
                            <Icon name="chevron-left" size={20} />
                        </button>
                        <div className="flex items-center gap-3">
                            <h3 className="text-lg font-black text-slate-700 dark:text-white">
                                {year} 年 {month + 1} 月
                            </h3>
                            <button onClick={goToday} className="text-xs bg-brand-brown text-white px-3 py-1 rounded-full font-bold hover:bg-brand-dark-brown transition-colors">
                                今天
                            </button>
                        </div>
                        <button onClick={nextMonth} className="p-2 hover:bg-slate-200 dark:hover:bg-gray-700 rounded-lg transition-colors">
                            <Icon name="chevron-right" size={20} />
                        </button>
                    </div>
                    
                    <div className="grid grid-cols-7 border-b border-slate-100 dark:border-gray-700">
                        {['日', '一', '二', '三', '四', '五', '六'].map(d => (
                            <div key={d} className="p-2 text-center text-xs font-bold text-slate-500 dark:text-gray-400 bg-slate-50 dark:bg-gray-900">
                                {d}
                            </div>
                        ))}
                    </div>
                    
                    <div className="grid grid-cols-7">
                        {days.map((day, idx) => {
                            const dayBookings = getBookingsForDay(day);
                            const isToday = day && new Date().toDateString() === new Date(year, month, day).toDateString();
                            
                            return (
                                <div key={idx} className={`calendar-day border-r border-b border-slate-100 dark:border-gray-700 p-1 ${!day ? 'bg-slate-50 dark:bg-gray-900' : ''} ${isToday ? 'bg-brand-yellow/20' : ''}`}>
                                    {day && (
                                        <>
                                            <div className={`text-xs font-bold mb-1 ${isToday ? 'text-brand-brown' : 'text-slate-600 dark:text-gray-400'}`}>
                                                {day}
                                            </div>
                                            <div className="space-y-1 max-h-16 overflow-y-auto">
                                                {dayBookings.slice(0, 3).map(b => (
                                                    <div 
                                                        key={b.id} 
                                                        onClick={() => onSelectBooking(b)}
                                                        className={`calendar-event truncate ${
                                                            b.service_type?.includes('住宿') 
                                                                ? 'bg-orange-100 text-orange-700 dark:bg-orange-900 dark:text-orange-300' 
                                                                : 'bg-blue-100 text-blue-700 dark:bg-blue-900 dark:text-blue-300'
                                                        }`}
                                                    >
                                                        {getPetNames(b)}
                                                    </div>
                                                ))}
                                                {dayBookings.length > 3 && (
                                                    <div className="text-[10px] text-slate-400 text-center">
                                                        +{dayBookings.length - 3} 更多
                                                    </div>
                                                )}
                                            </div>
                                        </>
                                    )}
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };

        // --- Dashboard Charts Component (獨立查詢全部訂單) ---
        const DashboardCharts = ({ bookings }) => {
            const chartRef1 = useRef(null);
            const chartRef2 = useRef(null);
            const chart1Instance = useRef(null);
            const chart2Instance = useRef(null);
            const [allData, setAllData] = useState([]);
            const [loading, setLoading] = useState(true);

            // ✅ 獨立從資料庫查詢全部訂單（不分頁）
            useEffect(() => {
                let cancelled = false;
                (async () => {
                    setLoading(true);
                    try {
                        const { data, error } = await supabase
                            .from('bookings')
                            .select('created_at, service_type')
                            .order('created_at', { ascending: true });

                        if (!error && !cancelled) {
                            setAllData(data || []);
                        }
                    } catch (e) {
                        console.error('Dashboard 查詢失敗:', e);
                    } finally {
                        if (!cancelled) setLoading(false);
                    }
                })();
                return () => { cancelled = true; };
            }, []);

            // ✅ 繪製圖表
            useEffect(() => {
                let cancelled = false;
                (async () => {
                    await ensureChart();
                    if (cancelled) return;

                    const dataToUse = allData || bookings || [];
                    if (dataToUse.length === 0 || !chartRef1.current || !chartRef2.current) return;

                    // ✅ 計算月度訂單資料（全部月份）
                    const monthlyData = {};
                    dataToUse.forEach(b => {
                        const month = b.created_at?.substring(0, 7);
                        if (month) monthlyData[month] = (monthlyData[month] || 0) + 1;
                    });

                    // ✅ 排序全部月份（從最早到最近）
                    const sortedMonths = Object.keys(monthlyData).sort();

                    // ✅ 建立圖表1：月度訂單趨勢
                    if (chart1Instance.current) chart1Instance.current.destroy();
                    if (chartRef1.current) {
                        chart1Instance.current = new Chart(chartRef1.current, {
                            type: 'line',
                            data: {
                                labels: sortedMonths.map(m => m.replace('-', '/')),
                                datasets: [{
                                    label: '訂單數',
                                    data: sortedMonths.map(m => monthlyData[m]),
                                    borderColor: '#736357',
                                    backgroundColor: 'rgba(115, 99, 87, 0.1)',
                                    fill: true,
                                    tension: 0.4,
                                    pointBackgroundColor: '#736357',
                                    pointRadius: 3,
                                    pointHoverRadius: 6
                                }]
                            },
                            options: {
                                responsive: true,
                                maintainAspectRatio: false,
                                plugins: {
                                    legend: { display: false }
                                },
                                scales: {
                                    x: {
                                        grid: { display: false },
                                        ticks: {
                                            maxTicksLimit: 12,
                                            font: { size: 10 }
                                        }
                                    },
                                    y: {
                                        beginAtZero: true,
                                        ticks: {
                                            stepSize: 1,
                                            font: { size: 10 }
                                        }
                                    }
                                }
                            }
                        });
                    }

                    // ✅ 服務類型分佈（圓餅圖）
                    const serviceData = {};
                    dataToUse.forEach(b => {
                        const type = b.service_type?.includes('住宿') ? '住宿' : (b.service_type || '其他');
                        serviceData[type] = (serviceData[type] || 0) + 1;
                    });

                    if (chart2Instance.current) chart2Instance.current.destroy();
                    if (chartRef2.current) {
                        chart2Instance.current = new Chart(chartRef2.current, {
                            type: 'doughnut',
                            data: {
                                labels: Object.keys(serviceData),
                                datasets: [{
                                    data: Object.values(serviceData),
                                    backgroundColor: ['#F7E7B5', '#736357', '#06C755', '#3b82f6', '#ef4444', '#8b5cf6']
                                }]
                            },
                            options: {
                                responsive: true,
                                maintainAspectRatio: false,
                                plugins: {
                                    legend: {
                                        position: 'bottom',
                                        labels: { font: { size: 11 }, boxWidth: 12, padding: 8 }
                                    }
                                }
                            }
                        });
                    }
                })();

                return () => { cancelled = true; };
            }, [allData, bookings]);

            if (loading) {
                return (
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div className="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-slate-100 dark:border-gray-700 h-48 flex items-center justify-center">
                            <div className="text-slate-400 text-sm">📊 載入數據中...</div>
                        </div>
                        <div className="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-slate-100 dark:border-gray-700 h-48 flex items-center justify-center">
                            <div className="text-slate-400 text-sm">📊 載入數據中...</div>
                        </div>
                    </div>
                );
            }

            const totalMonths = allData ? Object.keys(allData.reduce((acc, b) => {
                const m = b.created_at?.substring(0, 7);
                if (m) acc[m] = true;
                return acc;
            }, {})).length : 0;

            return (
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {/* 月度訂單趨勢 - 手機可左右滑動 */}
                    <div className="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-slate-100 dark:border-gray-700 overflow-hidden">
                        <div className="flex justify-between items-center mb-3">
                            <h4 className="text-sm font-bold text-slate-500 dark:text-gray-400">📈 月度訂單趨勢</h4>
                            <span className="text-[10px] text-slate-400 bg-slate-100 dark:bg-gray-700 px-2 py-0.5 rounded-full">
                                共 {totalMonths} 個月
                            </span>
                        </div>
                        <div className="relative">
                            <div className="overflow-x-auto overflow-y-hidden pb-2 -mx-1 px-1 touch-pan-x">
                                <div className="min-w-[600px] h-48">
                                    <canvas ref={chartRef1}></canvas>
                                </div>
                            </div>
                            <div className="pointer-events-none absolute right-0 top-0 bottom-0 w-12 bg-gradient-to-l from-white dark:from-gray-800 to-transparent md:hidden"></div>
                        </div>
                        <p className="text-[10px] text-slate-400 text-center mt-1">👆 左右滑動查看全部月份</p>
                    </div>

                    {/* 服務類型分佈 */}
                    <div className="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-slate-100 dark:border-gray-700">
                        <h4 className="text-sm font-bold text-slate-500 dark:text-gray-400 mb-3">📊 服務類型分佈</h4>
                        <div className="h-48">
                            <canvas ref={chartRef2}></canvas>
                        </div>
                        <p className="text-[10px] text-slate-400 text-center mt-1">共 {allData?.length || 0} 筆訂單</p>
                    </div>
                </div>
            );
        };

        // --- Customer CRM Component ---
        const CustomerCRM = ({ bookings, onSelectBooking }) => {
            const [searchTerm, setSearchTerm] = useState('');
            
            const customers = useMemo(() => {
                const grouped = {};
                bookings.forEach(b => {
                    const phone = b.phone;
                    if (!phone) return;
                    if (!grouped[phone]) {
                        grouped[phone] = {
                            phone,
                            owner_name: b.owner_name,
                            email: b.raw_data?.email,
                            pets: new Set(),
                            bookings: [],
                            totalSpent: 0
                        };
                    }
                    grouped[phone].bookings.push(b);
                    grouped[phone].totalSpent += parseInt(b.service_price) || 0;

                    const petList = getPetListFromBooking(b);
                    petList.forEach(p => {
                        if (p.pet_name) grouped[phone].pets.add(p.pet_name);
                    });
                });
                return Object.values(grouped).map(c => ({
                    ...c,
                    pets: Array.from(c.pets)
                })).sort((a, b) => b.bookings.length - a.bookings.length);
            }, [bookings]);

            const filteredCustomers = customers.filter(c => 
                c.owner_name?.includes(searchTerm) || 
                c.phone?.includes(searchTerm) ||
                c.pets.some(p => p.includes(searchTerm))
            );

            return (
                <div className="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-slate-100 dark:border-gray-700 overflow-hidden">
                    <div className="p-4 border-b border-slate-100 dark:border-gray-700 bg-slate-50 dark:bg-gray-900">
                        <div className="flex items-center gap-3">
                            <Icon name="users" size={20} className="text-brand-brown" />
                            <h3 className="font-bold text-slate-700 dark:text-white">客戶管理 CRM</h3>
                        </div>
                        <div className="mt-3 relative">
                            <Icon name="search" size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
                            <input 
                                type="text" 
                                placeholder="搜尋客戶..." 
                                value={searchTerm}
                                onChange={e => setSearchTerm(e.target.value)}
                                className="w-full pl-10 pr-4 py-2 rounded-lg border border-slate-200 dark:border-gray-600 bg-white dark:bg-gray-700 text-sm"
                            />
                        </div>
                    </div>
                    <div className="max-h-96 overflow-y-auto">
                        {filteredCustomers.map(customer => (
                            <div key={customer.phone} className="p-4 border-b border-slate-100 dark:border-gray-700 hover:bg-slate-50 dark:hover:bg-gray-700 transition-colors">
                                <div className="flex justify-between items-start">
                                    <div>
                                        <div className="font-bold text-slate-700 dark:text-white">{customer.owner_name}</div>
                                        <div className="text-sm text-slate-500 dark:text-gray-400">{customer.phone}</div>
                                        <div className="flex flex-wrap gap-1 mt-2">
                                            {customer.pets.map(pet => (
                                                <span key={pet} className="text-xs bg-brand-yellow/30 text-brand-brown px-2 py-0.5 rounded-full font-bold">
                                                    🐕 {pet}
                                                </span>
                                            ))}
                                        </div>
                                    </div>
                                    <div className="text-right">
                                        <div className="text-xs text-slate-400 font-bold bg-slate-100 dark:bg-gray-700 px-2 py-1 rounded">{customer.bookings.length} 筆訂單</div>
                                    </div>
                                </div>
                                <div className="mt-3 flex gap-2">
                                    {customer.bookings.slice(0, 3).map(b => (
                                        <button 
                                            key={b.id}
                                            onClick={() => onSelectBooking(b)}
                                            className="text-xs bg-slate-100 dark:bg-gray-600 px-2 py-1 rounded hover:bg-slate-200 dark:hover:bg-gray-500 transition-colors"
                                        >
                                            #{b.id}
                                        </button>
                                    ))}
                                    {customer.bookings.length > 3 && (
                                        <span className="text-xs text-slate-400">+{customer.bookings.length - 3}</span>
                                    )}
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // --- Activity Log Component ---
        const ActivityLog = ({ logs }) => (
            <div className="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-slate-100 dark:border-gray-700 overflow-hidden">
                <div className="p-4 border-b border-slate-100 dark:border-gray-700 bg-slate-50 dark:bg-gray-900 flex items-center gap-3">
                    <Icon name="activity" size={20} className="text-brand-brown" />
                    <h3 className="font-bold text-slate-700 dark:text-white">操作日誌</h3>
                </div>
                <div className="max-h-64 overflow-y-auto">
                    {logs.length === 0 ? (
                        <div className="p-8 text-center text-slate-400">暫無操作記錄</div>
                    ) : (
                        logs.map((log, idx) => (
                            <div key={idx} className="p-3 border-b border-slate-100 dark:border-gray-700 text-sm">
                                <div className="flex justify-between">
                                    <span className="font-bold text-slate-700 dark:text-white">{log.action}</span>
                                    <span className="text-xs text-slate-400">{formatDateTime(log.timestamp)}</span>
                                </div>
                                <div className="text-slate-500 dark:text-gray-400 text-xs mt-1">{log.details}</div>
                            </div>
                        ))
                    )}
                </div>
            </div>
        );
        // --- Email Log Viewer Component (手機優化版 + 搜尋) ---
const EmailLogViewer = ({ showToast }) => {
            const [logs, setLogs] = useState([]);
            const [loading, setLoading] = useState(false);
            const [refreshTrigger, setRefreshTrigger] = useState(0);
            const [searchTerm, setSearchTerm] = useState(''); // 新增搜尋狀態
            const [expandedLogId, setExpandedLogId] = useState(null); // 新增手機版展開狀態

            useEffect(() => {
                const fetchEmailLogs = async () => {
                    setLoading(true);
                    const { data, error } = await supabase
                        .from('email_logs')
                        .select('*')
                        .order('created_at', { ascending: false })
                        .limit(50);

                    if (error) {
                        console.error('Error fetching logs:', error);
                    } else {
                        setLogs(data || []);
                    }
                    setLoading(false);
                };
                fetchEmailLogs();
            }, [refreshTrigger]);

            // 過濾邏輯
            const filteredLogs = logs.filter(log => 
                (log.recipient_email && log.recipient_email.includes(searchTerm)) || 
                (log.pet_owner_name && log.pet_owner_name.includes(searchTerm))
            );

const handleResend = async (e, log) => {
                e.stopPropagation(); // 防止點擊按鈕時觸發卡片摺疊
                
                if (!confirm(`確定要重新寄送給 ${log.recipient_email} 嗎？`)) return;
                
                showToast("正在準備重新寄送...", "info");

                try {
                    // 呼叫你部署好的 resend-email Edge Function
                    const { data, error } = await supabase.functions.invoke('resend-email', { 
                        body: { log_id: log.id } 
                    });

                    if (error) throw error;

                    showToast("✅ 郵件已重新發送！", "success");
                    setRefreshTrigger(prev => prev + 1); // 重新整理清單看新狀態
                } catch (error) {
                    console.error("重寄失敗:", error);
                    showToast("❌ 重寄失敗：" + (error.message || "請檢查網路"), "error");
                }
            };
            const getStatusBadge = (status) => {
                const statusMap = {
                    'request': { label: '已請求', bg: 'bg-gray-100', text: 'text-gray-600' },
                    'sent': { label: '已發送', bg: 'bg-blue-50', text: 'text-blue-600' },
                    'delivered': { label: '已送達', bg: 'bg-green-100', text: 'text-green-700' },
                    'opened': { label: '已開啟', bg: 'bg-emerald-100', text: 'text-emerald-700' },
                    'clicked': { label: '已點擊', bg: 'bg-purple-100', text: 'text-purple-700' },
                    'soft_bounce': { label: '暫時失敗', bg: 'bg-orange-100', text: 'text-orange-700' },
                    'hard_bounce': { label: '無效信箱', bg: 'bg-red-100', text: 'text-red-700' },
                    'error': { label: '錯誤', bg: 'bg-red-100', text: 'text-red-700' }
                };
                const config = statusMap[status] || { label: status, bg: 'bg-gray-100', text: 'text-gray-600' };
                return <span className={`px-2 py-1 rounded-full text-[10px] font-bold ${config.bg} ${config.text}`}>{config.label}</span>;
            };

            return (
                <div className="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-slate-100 dark:border-gray-700 overflow-hidden flex flex-col h-[calc(100vh-200px)]">
                    {/* Header & Search */}
                    <div className="p-4 border-b border-slate-100 dark:border-gray-700 bg-slate-50 dark:bg-gray-900 shrink-0 space-y-3">
                        <div className="flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <Icon name="mail" size={20} className="text-brand-brown" />
                                <h3 className="font-bold text-slate-700 dark:text-white">系統郵件紀錄</h3>
                            </div>
                            <button onClick={() => setRefreshTrigger(prev => prev + 1)} className="p-2 hover:bg-slate-200 dark:hover:bg-gray-700 rounded-full transition-colors">
                                <Icon name="rotate-cw" size={16} className={loading ? "animate-spin" : ""} />
                            </button>
                        </div>
                        {/* 搜尋框 */}
                        <div className="relative">
                            <Icon name="search" size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
                            <input 
                                type="text" 
                                placeholder="搜尋 Email 或 飼主姓名..." 
                                value={searchTerm}
                                onChange={e => setSearchTerm(e.target.value)}
                                className="w-full pl-10 pr-4 py-2 rounded-lg border border-slate-200 dark:border-gray-600 bg-white dark:bg-gray-700 text-sm focus:outline-none focus:border-brand-brown"
                            />
                        </div>
                    </div>
                    
                    {/* Content Area */}
                    <div className="overflow-y-auto flex-1 p-0 md:p-0 bg-white dark:bg-gray-800">
                        {loading && logs.length === 0 ? (
                            <div className="p-8 text-center text-slate-400">載入中...</div>
                        ) : filteredLogs.length === 0 ? (
                            <div className="p-12 text-center flex flex-col items-center gap-2">
                                <div className="w-12 h-12 bg-slate-100 rounded-full flex items-center justify-center text-slate-300"><Icon name="inbox" size={24}/></div>
                                <span className="text-slate-400 text-sm">沒有找到相關紀錄</span>
                            </div>
                        ) : (
                            <>
                                {/* Mobile View (Card List) */}
                                <div className="md:hidden divide-y divide-slate-100 dark:divide-gray-700">
                                    {filteredLogs.map((log) => (
                                        <div key={log.id} className="bg-white dark:bg-gray-800" onClick={() => setExpandedLogId(expandedLogId === log.id ? null : log.id)}>
                                            <div className="p-4 flex items-start gap-3 active:bg-slate-50 transition-colors cursor-pointer">
                                                <div className={`mt-1 w-2 h-2 rounded-full shrink-0 ${log.status === 'opened' ? 'bg-green-500' : log.status === 'delivered' ? 'bg-blue-500' : 'bg-slate-300'}`}></div>
                                                <div className="flex-1 min-w-0">
                                                    <div className="flex justify-between items-start mb-1">
                                                        <span className="font-bold text-slate-700 dark:text-white truncate text-sm">{log.pet_owner_name || '未紀錄飼主'}</span>
                                                        <span className="text-[10px] text-slate-400 shrink-0">{new Date(log.created_at).toLocaleDateString()}</span>
                                                    </div>
                                                    <div className="text-xs text-slate-500 dark:text-gray-400 truncate font-mono mb-1.5">{log.recipient_email}</div>
                                                    <div className="flex justify-between items-center">
                                                        {getStatusBadge(log.status)}
                                                        <Icon name={expandedLogId === log.id ? "chevron-up" : "chevron-down"} size={14} className="text-slate-300"/>
                                                    </div>
                                                </div>
                                            </div>
                                            
                                            {/* Mobile Expanded Details */}
                                            {expandedLogId === log.id && (
                                                <div className="px-4 pb-4 pt-0 animate-in slide-in-from-top-2 duration-200">
                                                    <div className="bg-slate-50 dark:bg-gray-700/50 rounded-xl p-3 text-xs space-y-2 border border-slate-100 dark:border-gray-700">
                                                        <div className="flex justify-between border-b border-slate-200 dark:border-gray-600 pb-2">
                                                            <span className="text-slate-400">時間</span>
                                                            <span className="font-medium dark:text-gray-300">{new Date(log.created_at).toLocaleString()}</span>
                                                        </div>
                                                        <div className="space-y-1">
                                                            <span className="text-slate-400 block">主旨</span>
                                                            <span className="font-medium dark:text-gray-300 block break-words">{log.subject || '無主旨'}</span>
                                                        </div>
                                                        <div className="pt-2 flex justify-end">
                                                            <button 
                                                                onClick={(e) => handleResend(e, log)}
                                                                className="flex items-center gap-1 bg-white dark:bg-gray-600 border border-slate-200 dark:border-gray-500 px-3 py-1.5 rounded-lg text-brand-brown dark:text-gray-200 font-bold shadow-sm active:scale-95 transition-transform"
                                                            >
                                                                <Icon name="refresh-cw" size={12}/> 重寄信件
                                                            </button>
                                                        </div>
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    ))}
                                </div>

                                {/* Desktop View (Table) - 保持原樣但使用 filteredLogs */}
                                <div className="hidden md:block">
                                    <table className="w-full text-left">
                                        <thead className="bg-slate-50 dark:bg-gray-900 text-slate-500 font-bold text-xs uppercase tracking-wider sticky top-0 z-10">
                                            <tr>
                                                <th className="px-6 py-3">時間</th>
                                                <th className="px-6 py-3">收件人 / 飼主</th>
                                                <th className="px-6 py-3">主旨</th>
                                                <th className="px-6 py-3">狀態</th>
                                                <th className="px-6 py-3 text-right">操作</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100 dark:divide-gray-700">
                                            {filteredLogs.map((log) => (
                                                <tr key={log.id} className="hover:bg-slate-50 dark:hover:bg-gray-700 transition-colors">
                                                    <td className="px-6 py-4 text-sm text-slate-500">
                                                        <div>{new Date(log.created_at).toLocaleDateString()}</div>
                                                        <div className="text-xs">{new Date(log.created_at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</div>
                                                    </td>
                                                    <td className="px-6 py-4">
                                                        <div className="font-bold text-slate-700 dark:text-gray-200">{log.pet_owner_name || '未紀錄'}</div>
                                                        <div className="text-xs text-slate-400">{log.recipient_email}</div>
                                                    </td>
                                                    <td className="px-6 py-4 text-sm text-slate-600 dark:text-gray-300">
                                                        {log.subject || '無主旨'}
                                                    </td>
                                                    <td className="px-6 py-4">
                                                        {getStatusBadge(log.status)}
                                                    </td>
                                                    <td className="px-6 py-4 text-right">
                                                        <button 
                                                            onClick={(e) => handleResend(e, log)}
                                                            className="text-xs font-bold text-brand-brown hover:bg-brand-brown/10 px-3 py-1.5 rounded border border-brand-brown/30 transition-all"
                                                        >
                                                            重寄
                                                        </button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </>
                        )}
                    </div>
                </div>
            );
        };

        // --- Terms Manager Component (分頁模式 + 恢復預設值) ---
        const TermsManager = ({ supabase, showToast }) => {
            const [terms, setTerms] = useState([]);
            const [loading, setLoading] = useState(true);
            const [activeKey, setActiveKey] = useState('grooming');
            const [editingKey, setEditingKey] = useState(null);
            const [editTitle, setEditTitle] = useState('');
            const [editContent, setEditContent] = useState('');
            const [previewMode, setPreviewMode] = useState(false);
            const [resetting, setResetting] = useState(false);
            const [showResetModal, setShowResetModal] = useState(false);
            const [selectedResetKeys, setSelectedResetKeys] = useState([]);

            const TERM_KEYS = {
                grooming: '犬、貓美容契約條款',
                boarding: '犬、貓寄養契約條款',
                senior: '高風險寵物美容服務風險告知',
                boardingRisk: '高風險寵物住宿服務風險告知'
            };

            const TAB_ORDER = ['grooming', 'boarding', 'senior', 'boardingRisk'];

            // 切換選擇
            const toggleResetSelection = (key) => {
                setSelectedResetKeys(prev => 
                    prev.includes(key) 
                        ? prev.filter(k => k !== key) 
                        : [...prev, key]
                );
            };

            // 全選/取消全選
            const toggleSelectAll = () => {
                if (selectedResetKeys.length === TAB_ORDER.length) {
                    setSelectedResetKeys([]);
                } else {
                    setSelectedResetKeys([...TAB_ORDER]);
                }
            };

            const loadTerms = async () => {
                setLoading(true);
                try {
                    const { data, error } = await supabase
                        .from('terms')
                        .select('*')
                        .order('key', { ascending: true });

                    if (error) {
                        showToast('載入條款失敗: ' + error.message, 'error');
                        const defaultTerms = Object.entries(TERM_KEYS).map(([key, title]) => ({
                            key,
                            title,
                            content: `<p>請編輯【${title}】的內容...</p>`
                        }));
                        setTerms(defaultTerms);
                    } else {
                        console.log('📋 從 terms 表讀取到的資料:', data);
                        
                        const defaultTerms = Object.entries(TERM_KEYS).map(([key, title]) => ({
                            key,
                            title,
                            content: `<p>請編輯【${title}】的內容...</p>`
                        }));

                        const finalTerms = defaultTerms.map(defaultTerm => {
                            const existing = data.find(t => t.key === defaultTerm.key);
                            if (existing) {
                                const content = existing.content && existing.content.trim() !== '' 
                                    ? existing.content 
                                    : `<p>請編輯【${defaultTerm.title}】的內容...</p>`;
                                return {
                                    ...existing,
                                    content: content,
                                    title: existing.title || defaultTerm.title
                                };
                            }
                            return defaultTerm;
                        });

                        console.log('✅ 最終條款資料:', finalTerms.map(t => ({
                            key: t.key,
                            contentLength: t.content?.length || 0,
                            contentPreview: t.content?.substring(0, 100) + '...'
                        })));
                        
                        setTerms(finalTerms);
                    }
                } catch (err) {
                    console.error('載入條款錯誤:', err);
                    showToast('載入條款發生錯誤', 'error');
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => {
                loadTerms();
            }, []);

            // 恢復預設值 (支援勾選)
            const resetToDefault = async () => {
                if (selectedResetKeys.length === 0) {
                    showToast('請至少選擇一個要恢復的條款', 'warning');
                    return;
                }

                const names = selectedResetKeys.map(k => TERM_KEYS[k]).join('、');
                if (!confirm(`確定要將以下條款恢復為預設值嗎？\n\n${names}\n\n您目前自訂的內容將會遺失！`)) return;
                
                setResetting(true);
                try {
                    // 從 settings 表讀取預設值
                    const keysToFetch = selectedResetKeys.map(k => `default_${k}`);
                    console.log('🔍 要讀取的 keys:', keysToFetch);
                    
                    const { data, error } = await supabase
                        .from('settings')
                        .select('key, value')
                        .in('key', keysToFetch);

                    if (error) throw error;
                    
                    console.log('📦 從 settings 讀取到的資料:', data);

                    // 建立映射
                    const defaultMap = {};
                    data.forEach(item => {
                        const termKey = item.key.replace('default_', '');
                        defaultMap[termKey] = item.value;
                    });
                    
                    console.log('🗺️ 建立的映射:', defaultMap);

                    // 更新選中的條款
                    const updates = selectedResetKeys.map(key => {
                        const content = defaultMap[key] || `<p>請編輯【${TERM_KEYS[key]}】的內容...</p>`;
                        console.log(`📝 更新 ${key}: 內容長度 ${content.length}`);
                        return supabase
                            .from('terms')
                            .upsert({
                                key: key,
                                title: TERM_KEYS[key],
                                content: content,
                                updated_at: new Date().toISOString()
                            }, { onConflict: 'key' });
                    });

                    await Promise.all(updates);
                    
                    showToast(`✅ 已恢復 ${selectedResetKeys.length} 個條款為預設值！`, 'success');
                    await loadTerms(); // 重新載入
                    setEditingKey(null);
                    setPreviewMode(false);
                    setShowResetModal(false);
                    setSelectedResetKeys([]);
                } catch (err) {
                    console.error('恢復預設值失敗:', err);
                    showToast('❌ 恢復失敗: ' + err.message, 'error');
                } finally {
                    setResetting(false);
                }
            };

            const startEditing = (term) => {
                if (editingKey === term.key) {
                    setEditingKey(null);
                    setPreviewMode(false);
                    return;
                }

                setEditingKey(term.key);
                setEditTitle(term.title || '');
                setEditContent(term.content || '');
                setPreviewMode(false);
            };

            const saveTerm = async (key) => {
                const content = editContent.trim();
                const title = editTitle || terms.find(t => t.key === key)?.title || '';

                if (!content || content === '' || content === '<p><br></p>' || content === '<p></p>') {
                    showToast('條款內容不能為空白', 'error');
                    return;
                }

                try {
                    const { error } = await supabase
                        .from('terms')
                        .upsert({
                            key: key,
                            title: title,
                            content: content,
                            updated_at: new Date().toISOString()
                        }, { onConflict: 'key' });

                    if (error) {
                        showToast('儲存失敗: ' + error.message, 'error');
                    } else {
                        showToast('✅ 條款已成功更新！', 'success');
                        setTerms(prev => prev.map(t => 
                            t.key === key ? { ...t, title, content } : t
                        ));
                        setEditingKey(null);
                        setPreviewMode(false);
                    }
                } catch (err) {
                    console.error('儲存錯誤:', err);
                    showToast('儲存發生錯誤: ' + err.message, 'error');
                }
            };

            const currentTerm = terms.find(t => t.key === activeKey);
            const isEditing = editingKey === activeKey;

            if (loading) {
                return <div className="p-8 text-center text-slate-400">載入條款資料中...</div>;
            }

            const getTabClass = (key) => {
                const isActive = activeKey === key;
                const term = terms.find(t => t.key === key);
                const defaultContent = `<p>請編輯【${TERM_KEYS[key]}】的內容...</p>`;
                const isDefault = term?.content === defaultContent || term?.content === `<p>請編輯【${term?.title || TERM_KEYS[key]}】的內容...</p>`;
                const isEdited = term?.content && 
                               term?.content.trim() !== '' && 
                               term?.content !== '<p><br></p>' &&
                               term?.content !== '<p></p>' &&
                               !isDefault;
                
                // ✅ 高風險條款用紅色，一般條款用綠色
                const isHighRisk = key === 'senior' || key === 'boardingRisk';
                
                // 按鈕底色
                let bgColor = 'text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-gray-700';
                if (isActive) {
                    bgColor = 'bg-[#736357] text-white shadow-md';
                } else if (isEdited) {
                    bgColor = isHighRisk 
                        ? 'bg-red-50 dark:bg-red-900/20 text-red-700 dark:text-red-400 hover:bg-red-100 dark:hover:bg-red-900/30' 
                        : 'bg-green-50 dark:bg-green-900/20 text-green-700 dark:text-green-400 hover:bg-green-100 dark:hover:bg-green-900/30';
                }
                
                return `px-4 py-2.5 rounded-xl font-bold text-sm transition-all flex items-center gap-2 whitespace-nowrap ${bgColor}`;
            };

            return (
                <div className="space-y-6">
                    {/* 說明區塊 + 恢復按鈕 */}
                    <div className="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-slate-100 dark:border-gray-700 p-6">
                        <div className="flex flex-wrap items-center justify-between gap-3">
                            <div className="flex items-center gap-3">
                                <Icon name="book-open" size={24} className="text-brand-brown" />
                                <h3 className="text-xl font-black text-slate-700 dark:text-white">條款內容管理</h3>
                            </div>
                            <button
                                onClick={() => setShowResetModal(true)}
                                disabled={resetting}
                                className="px-4 py-2 rounded-lg bg-red-500 text-white font-bold text-sm hover:bg-red-600 transition-all disabled:opacity-50 flex items-center gap-2"
                            >
                                {resetting ? (
                                    <Icon name="loader-2" size={16} className="animate-spin" />
                                ) : (
                                    <Icon name="rotate-ccw" size={16} />
                                )}
                                {resetting ? '恢復中...' : '🔄 恢復預設值'}
                            </button>
                        </div>
                        <p className="text-sm text-slate-500 dark:text-gray-400 mt-2">
                            點擊上方分頁切換不同條款，點擊「編輯」按鈕修改內容。支援 <strong>HTML 標籤</strong> 進行排版。
                        </p>
                        <p className="text-xs text-slate-400 mt-1">
                            💡 點擊「恢復預設值」將所有條款重置為系統預設內容
                        </p>
                    </div>

                    {/* 分頁導航 */}
                    <div className="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-slate-100 dark:border-gray-700 p-2 flex flex-wrap items-center gap-1">
                        {TAB_ORDER.map(key => {
                            const term = terms.find(t => t.key === key);
                            const label = term?.title || TERM_KEYS[key] || key;
                            const shortLabel = label.replace('犬、貓', '').replace('服務風險告知', '').replace('風險告知', '');
                            return (
                                <button
                                    key={key}
                                    onClick={() => {
                                        setActiveKey(key);
                                        setEditingKey(null);
                                        setPreviewMode(false);
                                    }}
                                    className={getTabClass(key)}
                                >
                                    {activeKey === key && <Icon name="check-circle" size={14} />}
                                    {shortLabel || label}
                                    {false && (
                                        <span className="w-2 h-2 rounded-full bg-green-500 inline-block ml-1"></span>
                                    )}
                                </button>
                            );
                        })}
                    </div>

                    {/* 當前條款內容 */}

        // --- Export Functions ---
const exportToExcel = async (bookings, filename = 'bookings') => {

        // --- Detail Item Component ---

                                    <p><strong>入住:</strong> {data.checkin_date}</p>

        // --- Main App Component ---
        const App = () => {
            const [session, setSession] = useState(null);
            const [loading, setLoading] = useState(true);
            const [dataLoading, setDataLoading] = useState(false);
            
            // 登入狀態
            const [loginEmail, setLoginEmail] = useState('');
            const [password, setPassword] = useState('');
            const [loginError, setLoginError] = useState('');

            // 取得權限
            const { canEdit, canDelete, roleName, canManageAdmins, canViewLogs, canExport } = usePermissions(session?.user?.email);
            
const [bookings, setBookings] = useState([]);
const [selectedBooking, setSelectedBooking] = useState(null);
const [selectedBookings, setSelectedBookings] = useState(new Set());

// ✅ 分頁設定
const PAGE_SIZE = 20;
const [page, setPage] = useState(0);
const [hasMore, setHasMore] = useState(true);
const [totalCount, setTotalCount] = useState(0);
const [pageSize, setPageSize] = useState(20);            
            // Filters
            const [searchFilter, setSearchFilter] = useState('');
            const [statusFilter, setStatusFilter] = useState('all');
const [serviceFilter, setServiceFilter] = useState({ pet: 'all', service: 'all' });
const [dateFrom, setDateFrom] = useState('');
const [dateTo, setDateTo] = useState('');
            
            // View mode
            const [viewMode, setViewMode] = useState('list');
            const [activeTab, setActiveTab] = useState('orders');
            
// Edit mode
            const [isEditing, setIsEditing] = useState(false);
            const [editForm, setEditForm] = useState({});
            
            // 獨立的備註功能 (讓員工也能寫)
            const [adminNote, setAdminNote] = useState('');
            const [noteLoading, setNoteLoading] = useState(false);

            // 當打開訂單時，自動把備註載入到 adminNote
            useEffect(() => {
                if (selectedBooking) {
                    setAdminNote(selectedBooking.raw_data?.admin_notes || '');
                }
            }, [selectedBooking]);
            
            // Modals
            const [showConfirm, setShowConfirm] = useState(false);
            const [confirmAction, setConfirmAction] = useState(null);
            const [actionLoading, setActionLoading] = useState(false);
            const [showPasswordModal, setShowPasswordModal] = useState(false);
            
            const [toast, setToast] = useState(null);
            const [activityLogs, setActivityLogs] = useState([]);
            const [isDark, setIsDark] = useDarkMode();
            // ✅ 先顯示快取資料（讓列表立刻出現）
useEffect(() => {
    const cached = localStorage.getItem('bookings_cache');
    if (cached) {
        try {
            setBookings(JSON.parse(cached));
        } catch(e) {}
    }
}, []);
            const { checkRateLimit, recordAttempt } = useRateLimiter();
            const showToast = (message, type = 'info') => setToast({ message, type });

            // Session timeout
            const handleSessionTimeout = useCallback(async () => {
                showToast('Session 已過期，請重新登入', 'warning');
                await supabase.auth.signOut();
                setSession(null);
            }, []);

            useSessionTimeout(session ? handleSessionTimeout : () => {});

            const addLog = (action, details) => {
                const newLog = { action, details, timestamp: new Date().toISOString() };
                setActivityLogs(prev => [newLog, ...prev].slice(0, 100));
                localStorage.setItem('activity_logs', JSON.stringify([newLog, ...activityLogs].slice(0, 100)));
            };

            useEffect(() => {
                const saved = localStorage.getItem('activity_logs');
                if (saved) setActivityLogs(JSON.parse(saved));
            }, []);

            useEffect(() => {
                supabase.auth.getSession().then(({ data: { session } }) => {
                    setSession(session);
                    setLoading(false);
                });
const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
    setSession(session);
    if(session) fetchBookings(0, true, pageSize);
});
                return () => subscription.unsubscribe();
            }, []);

            useEffect(() => {
                if (!session) return;
                const channel = supabase
                    .channel('bookings-changes')
                    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'bookings' }, (payload) => {
                        const normalized = normalizeBooking(payload.new);
                        setBookings(prev => [normalized, ...prev]);
                        showToast(`🎉 新訂單！${getPetNames(normalized)} - ${normalized.owner_name}`, 'success');
                        addLog('新訂單', `#${normalized.id} ${getPetNames(normalized)}`);
                    })
                    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'bookings' }, (payload) => {
                        setBookings(prev => prev.map(b => b.id === payload.new.id ? normalizeBooking(payload.new) : b));
                    })
                    .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'bookings' }, (payload) => {
                        setBookings(prev => prev.filter(b => b.id !== payload.old.id));
                    })
                    .subscribe();
                return () => { supabase.removeChannel(channel); };
            }, [session]);

            const handleLogin = async (e) => {
                e.preventDefault();
                const rateCheck = checkRateLimit('login');
                if (!rateCheck.allowed) {
                    setLoginError(`登入嘗試次數過多，請 15 分鐘後再試`);
                    return;
                }
                
                setLoading(true);
                setLoginError('');
                recordAttempt('login');
                
                const { error } = await supabase.auth.signInWithPassword({ email: loginEmail, password: password });
                if (error) {
                    setLoginError(`密碼錯誤 (剩餘 ${rateCheck.remaining - 1} 次嘗試)`); 
                    setLoading(false); 
                } else {
                    addLog('登入', `${loginEmail === ADMIN_EMAIL ? '管理員' : '員工'}登入成功`);
                }
            };

            const handleLogout = async () => {
                addLog('登出', '使用者登出');
                await supabase.auth.signOut();
                window.location.href = 'index.html';
            };

const fetchBookings = async (pageToLoad = 0, reset = false, size = pageSize) => {
    setDataLoading(true);

    const from = pageToLoad * size;
    const to = from + size - 1;

    // ✅ 先查詢總筆數
    const { count, error: countError } = await supabase
        .from('bookings')
        .select('*', { count: 'exact', head: true });

    if (!countError) {
        setTotalCount(count || 0);
    }

    // ✅ 再查詢該頁資料（加入 raw_data）
    const { data, error } = await supabase
        .from('bookings')
        .select('id, created_at, owner_name, phone, pet_name, service_type, status, checkin_date, checkout_date, service_price, raw_data')
        .order('created_at', { ascending: false })
        .range(from, to);

    if (!error) {
        const newData = data || [];
        // ✅ 正規化每個 booking 的 raw_data
        const normalizedData = newData.map(b => normalizeBooking(b));
        if (reset) {
            setBookings(normalizedData);
            localStorage.setItem('bookings_cache', JSON.stringify(normalizedData));
        } else {
            setBookings(prev => {

const searchBookings = async (keyword) => {
    if (!keyword || keyword.trim() === '') {
        // 如果搜尋關鍵字為空，回到第一頁
        fetchBookings(0, true, pageSize);
        return;
    }

    setDataLoading(true);
    try {
        const searchLower = keyword.trim();
        
        // ✅ 判斷是否為日期格式（支援多種格式）
        let searchDates = null;
        let isDateSearch = false;
        
        // 1) YYYY-MM-DD 完整日期
        if (/^\d{4}-\d{2}-\d{2}$/.test(searchLower)) {
            searchDates = [searchLower];
            isDateSearch = true;
        } 
        // 2) MM/DD 或 M/D（搜尋所有年份）
        else if (/^\d{1,2}\/\d{1,2}$/.test(searchLower)) {
            const parts = searchLower.split('/');
            const month = parts[0].padStart(2, '0');
            const day = parts[1].padStart(2, '0');
            // ✅ 搜尋所有年份的該月日（從 2020 到 2030）
            const years = [];
            const currentYear = new Date().getFullYear();
            for (let y = currentYear - 5; y <= currentYear + 5; y++) {
                years.push(`${y}-${month}-${day}`);
            }
            searchDates = years;
            isDateSearch = true;
        } 
        // 3) MM-DD 或 M-D（搜尋所有年份）
        else if (/^\d{1,2}-\d{1,2}$/.test(searchLower)) {
            const parts = searchLower.split('-');
            const month = parts[0].padStart(2, '0');
            const day = parts[1].padStart(2, '0');
            const years = [];
            const currentYear = new Date().getFullYear();
            for (let y = currentYear - 5; y <= currentYear + 5; y++) {
                years.push(`${y}-${month}-${day}`);
            }
            searchDates = years;
            isDateSearch = true;
        }

        // ✅ 建立查詢 - 搜尋全部訂單（不分頁）
        let query = supabase
            .from('bookings')
            .select('*', { count: 'exact' });

        // ✅ 日期搜尋（支援多年份）
        if (isDateSearch && searchDates) {
            // 使用 or 條件搜尋多個日期（入住日期或美容日期）
            const dateConditions = searchDates.map(d => 
                `checkin_date.eq.${d},raw_data->>grooming_date.eq.${d}`
            ).join(',');
            query = query.or(dateConditions);
        } else {
            // 文字搜尋：姓名、電話、寵物名
            query = query.or(`owner_name.ilike.%${searchLower}%,phone.ilike.%${searchLower}%,pet_name.ilike.%${searchLower}%`);
        }

        const { data, error, count } = await query.order('created_at', { ascending: false });

        if (!error) {
            setBookings(data || []);
            setTotalCount(count || 0);
            setPage(0);
            setHasMore(false); // 搜尋結果不分頁
            localStorage.setItem('bookings_cache', JSON.stringify(data || []));
            showToast(`找到 ${data?.length || 0} 筆結果`, 'success');
        } else {
            console.error('搜尋失敗:', error);
            showToast('搜尋失敗，請重試', 'error');
        }
    } catch (e) {
        console.error('搜尋錯誤:', e);
        showToast('搜尋發生錯誤', 'error');
    }
    setDataLoading(false);
};

const stats = useMemo(() => {

        // ✅ 日期區間篩選
        if (dateFrom || dateTo) {

                            <span className="hidden sm:inline">美容</span>

                        >
                            <span>🐶</span>
                            <span className="hidden sm:inline">狗狗</span>
                        </button>
                        
                        {/* 🐱 貓咪 - 手機只顯示 icon */}
                        <button 
                            onClick={() => setServiceFilter({ ...serviceFilter, pet: serviceFilter.pet === 'cat' ? 'all' : 'cat' })}

                </div>

                {filteredBookings.length > 0 && (() => {
                    const totalPages = Math.ceil(totalCount / pageSize);
                    const currentPage = page + 1;

                    let startPage = Math.max(1, currentPage - Math.floor(maxVisible / 2));
                    let endPage = Math.min(totalPages, startPage + maxVisible - 1);
                    if (endPage - startPage < maxVisible - 1) {
                        startPage = Math.max(1, endPage - maxVisible + 1);
                    }

                    return (
                        <div className="mt-6 pt-4 border-t border-slate-100 dark:border-gray-700 space-y-4">

                                    >

                                    </button>

                                    {Array.from({ length: endPage - startPage + 1 }, (_, i) => startPage + i).map(p => (
                                        <button
                                            key={p}
                                            onClick={() => { fetchBookings(p - 1, false, pageSize); }}
                                            className={`px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all ${
                                                p === currentPage
                                                    ? 'bg-[#736357] text-white shadow-sm'

                                        >
                                            {p}
                                        </button>
                                    ))}

                                    <button
                                        onClick={() => { if (hasMore) fetchBookings(page + 1, false, pageSize); }}
